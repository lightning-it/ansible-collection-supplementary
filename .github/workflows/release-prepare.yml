# yamllint disable rule:truthy
---
name: Prepare collection release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Stable release version, for example 1.2.3. It must equal the next version implied by reviewed fragments.
        required: false
        default: ""
      base_branch:
        description: Base branch. Leave empty to use protected main.
        required: false
        default: ""
      target_branch:
        description: Release PR target branch. Must be main.
        required: false
        default: main
      create_github_release:
        description: Create a GitHub release after merge.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_galaxy:
        description: Publish to Ansible Galaxy after merge.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      security_evidence_id:
        description: Exact MLX-90 Evidence ID; release automation only.
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-prepare-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security-classification:
    name: Classify evidence-bound Security release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      security-release: ${{ steps.classify.outputs.security_release }}
      security-evidence-id: ${{ steps.classify.outputs.security_evidence_id }}
      security-version: ${{ steps.classify.outputs.security_version }}
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable pre-consumption binding base
        id: binding
        env:
          BEFORE_SHA: ${{ github.event.before || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_sha="$GITHUB_SHA"
          if [ "$EVENT_NAME" = push ] && \
              git diff --name-only --no-renames "$BEFORE_SHA" "$GITHUB_SHA" -- \
                changelogs/release-preparation.json \
                | grep -Fxq changelogs/release-preparation.json
          then
            receipt=changelogs/release-preparation.json
            test -f "$receipt"
            test ! -L "$receipt"
            base_sha="$(
              jq -er '.base_sha | select(test("^[0-9a-f]{40}$"))' "$receipt"
            )"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
      - name: Checkout immutable pre-consumption Security binding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.binding.outputs.base_sha }}
          path: security-binding-base
          persist-credentials: false
      - name: Classify before selecting a protected environment
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          EVIDENCE_ID: ${{ inputs.security_evidence_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            commit_message="$(git show -s --format=%B "$GITHUB_SHA")"
            python scripts/classify-security-release.py \
              --event-kind push \
              --base-sha "$BEFORE_SHA" \
              --head-sha "$GITHUB_SHA" \
              --ref "$GITHUB_REF" \
              --commit-message "$commit_message" \
              --evidence-id "$EVIDENCE_ID" \
              --binding-root security-binding-base
          else
            python scripts/classify-security-release.py \
              --event-kind version \
              --version "$VERSION" \
              --evidence-id "$EVIDENCE_ID" \
              --binding-root security-binding-base
          fi

  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    needs: security-classification
    if: >-
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(release): prepare v')
        )
      ) &&
      (needs.security-classification.outputs.security-release == 'false' ||
       (needs.security-classification.outputs.security-release == 'true' &&
        github.actor == 'lightning-it-release-automation[bot]'))
    environment:
      name: >-
        ${{ needs.security-classification.outputs.security-release == 'true' &&
            github.actor == 'lightning-it-release-automation[bot]' &&
            'mlx90-security-release-prepare' ||
            'ansible-collection-release-prepare' }}

    steps:
      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve release automation App bot identity
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D" 2>/dev/null || printf '{}')"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          if [ "$login" != "${APP_SLUG}[bot]" ] || ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the release automation App bot identity."
            exit 1
          fi
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          token: ${{ steps.release-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"

      - name: Install release tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            ansible-core==2.18.18 \
            antsibull-changelog==0.35.1 \
            PyYAML==6.0.3

      - name: Prepare release branch
        id: prepare-release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BASE_BRANCH_INPUT: ${{ github.event.inputs.base_branch }}
          TARGET_BRANCH_INPUT: ${{ github.event.inputs.target_branch }}
          CREATE_GITHUB_RELEASE_INPUT: ${{ github.event.inputs.create_github_release }}
          PUBLISH_GALAXY_INPUT: ${{ github.event.inputs.publish_galaxy }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SECURITY_RELEASE: ${{ needs.security-classification.outputs.security-release }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          authenticated_push() {
            GH_TOKEN="$GH_TOKEN" git -c credential.helper= \
              -c 'credential.helper=!gh auth git-credential' \
              push "$@"
          }

          VERSION="${VERSION_INPUT:-}"
          TARGET_BRANCH="${TARGET_BRANCH_INPUT:-main}"
          CREATE_GITHUB_RELEASE="${CREATE_GITHUB_RELEASE_INPUT:-true}"
          PUBLISH_GALAXY="${PUBLISH_GALAXY_INPUT:-true}"

          BASE_BRANCH="${BASE_BRANCH_INPUT:-main}"
          if [ "$BASE_BRANCH" != "main" ]; then
            echo "::error::Collection release PRs must be prepared from protected main."
            exit 1
          fi
          if [ "$TARGET_BRANCH" != "main" ]; then
            echo "::error::Collection release PRs must target main."
            exit 1
          fi

          git config user.name "${{ steps.release-bot.outputs.login }}"
          git config user.email "${{ steps.release-bot.outputs.email }}"
          git fetch origin "$BASE_BRANCH" "$TARGET_BRANCH"
          git switch -C release-prepare-base "origin/$BASE_BRANCH"
          BASE_SHA="$(git rev-parse HEAD)"
          export BASE_SHA

          fragment_count="$(
            find changelogs/fragments \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name '.gitkeep' \
              | wc -l
          )"
          if [ "$fragment_count" -eq 0 ]; then
            echo "No changelog fragments found; no collection release PR needed."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_args=()
          if [ -n "$VERSION" ]; then
            version_args=(--requested-version "$VERSION")
          fi
          version_resolution="$(
            python scripts/release-version.py \
              --galaxy galaxy.yml \
              --fragments changelogs/fragments \
              --write-preparation-receipt changelogs/release-preparation.json \
              --repository "$GITHUB_REPOSITORY" \
              --repository-id "$REPOSITORY_ID" \
              --base-sha "$BASE_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$WORKFLOW_REF" \
              --workflow-event "$WORKFLOW_EVENT" \
              --workflow-actor "$WORKFLOW_ACTOR" \
              "${version_args[@]}"
          )"
          VERSION="$(jq -er '.version' <<< "$version_resolution")"
          RELEASE_IMPACT="$(jq -er '.impact' <<< "$version_resolution")"
          PREPARATION_MODE="$(jq -er '.release_mode' changelogs/release-preparation.json)"
          if [ "$SECURITY_RELEASE" = true ]; then
            test "$PREPARATION_MODE" = security
            SECURITY_CHAIN_ID="$(jq -er '.chain_id' changelogs/release-preparation.json)"
            [[ "$SECURITY_CHAIN_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          else
            test "$SECURITY_RELEASE" = false
            test "$PREPARATION_MODE" = normal
            SECURITY_CHAIN_ID=""
          fi
          export VERSION

          tag_matches="$(
            git ls-remote --tags origin \
              "refs/tags/v${VERSION}" \
              "refs/tags/v${VERSION}^{}"
          )"
          if [ -n "$tag_matches" ]; then
            echo "::error::Immutable tag v${VERSION} already exists."
            exit 1
          fi

          github_release_response="$(mktemp)"
          github_release_status="$(
            curl --silent --show-error --location \
              --output "$github_release_response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}"
          )"
          case "$github_release_status" in
            404) ;;
            200)
              echo "::error::GitHub Release v${VERSION} already exists."
              exit 1
              ;;
            *)
              echo "::error::Could not prove GitHub Release v${VERSION} is absent (HTTP ${github_release_status})."
              exit 1
              ;;
          esac

          if [ "$PUBLISH_GALAXY" = "true" ]; then
            galaxy_response="$(mktemp)"
            galaxy_status="$(
              curl --silent --show-error --location \
                --output "$galaxy_response" \
                --write-out '%{http_code}' \
                "https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/lit/supplementary/versions/${VERSION}/"
            )"
            case "$galaxy_status" in
              404) ;;
              200)
                echo "::error::Ansible Galaxy collection version ${VERSION} already exists."
                exit 1
                ;;
              *)
                echo "::error::Could not prove Galaxy version ${VERSION} is absent (HTTP ${galaxy_status})."
                exit 1
                ;;
            esac
          fi

          RELEASE_BRANCH="release/v${VERSION}"
          release_ref="refs/heads/${RELEASE_BRANCH}"
          remote_release_sha="$(
            git ls-remote --heads origin "$release_ref" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [ -n "$remote_release_sha" ] && \
              ! [[ "$remote_release_sha" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "::error::Could not resolve a trustworthy release-branch lease."
            exit 1
          fi
          echo "Preparing reviewed ${RELEASE_IMPACT} release v${VERSION} from ${BASE_BRANCH} to ${TARGET_BRANCH}."

          git switch -C "$RELEASE_BRANCH" "origin/$BASE_BRANCH"

          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          class LintFriendlyDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          def write_yaml(path, data):
              path.write_text(
                  yaml.dump(
                      data,
                      Dumper=LintFriendlyDumper,
                      sort_keys=False,
                      explicit_start=True,
                  )
              )

          version = os.environ["VERSION"]
          path = Path("galaxy.yml")
          data = yaml.safe_load(path.read_text())
          data["version"] = version
          write_yaml(path, data)
          PY

          antsibull-changelog lint
          antsibull-changelog release

          python - <<'PY'
          from pathlib import Path
          import yaml

          class LintFriendlyDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          for path in (
              Path("galaxy.yml"),
              Path("changelogs/changelog.yaml"),
              Path("changelogs/.plugin-cache.yaml"),
          ):
              if not path.exists():
                  continue
              data = yaml.safe_load(path.read_text())
              path.write_text(
                  yaml.dump(
                      data,
                      Dumper=LintFriendlyDumper,
                      sort_keys=False,
                      explicit_start=True,
                  )
              )
          PY

          ansible-galaxy collection build --force

          tarball="$(ls ./*.tar.gz)"
          summary="$(
            awk \
              '/^v'"$VERSION"'$/{flag=1; print; next} /^v[0-9]/{if(flag) exit} flag {print}' \
              CHANGELOG.rst
          )"

          git add galaxy.yml changelogs CHANGELOG.rst
          git commit -m "chore(release): prepare v${VERSION}"
          pushed_sha="$(git rev-parse HEAD)"
          if [ -n "$remote_release_sha" ]; then
            git fetch --no-tags origin "$release_ref"
            test "$(git rev-parse FETCH_HEAD)" = "$remote_release_sha"
            git switch --detach "$remote_release_sha"
            pushed_sha="$remote_release_sha"
          fi

          promotion_base="$RUNNER_TEMP/release-promotion-base"
          test ! -e "$promotion_base"
          git worktree add --detach "$promotion_base" "$BASE_SHA"
          python "$promotion_base/scripts/security_main_promotion.py" \
            --base-root "$promotion_base" \
            --head-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$pushed_sha" \
            --head-ref "$RELEASE_BRANCH" >/dev/null
          git worktree remove "$promotion_base"

          if [ -z "$remote_release_sha" ]; then
            authenticated_push origin "HEAD:${release_ref}"
            test "$(git ls-remote origin "$release_ref" | awk '{print $1}')" = \
              "$pushed_sha"
          else
            echo "Reusing the already verified immutable release branch head ${pushed_sha}."
          fi

          body_file="$(mktemp)"
          {
            echo "## Release v${VERSION}"
            echo
            echo "Base branch: \`${BASE_BRANCH}\`"
            echo "Target branch: \`${TARGET_BRANCH}\`"
            echo "Build artifact: \`${tarball}\`"
            echo "GitHub release creation: \`${CREATE_GITHUB_RELEASE}\`"
            echo "Galaxy publishing: \`${PUBLISH_GALAXY}\`"
            echo "Reviewed semantic impact: \`${RELEASE_IMPACT}\`"
            echo "Release mode: \`${PREPARATION_MODE}\`"
            if [ "$PREPARATION_MODE" = security ]; then
              echo "MLX-90 chain: \`${SECURITY_CHAIN_ID}\`"
              echo "- Human actions in the successful Security path: \`0\`"
            fi
            echo "Required merge method: \`merge commit\` (squash and rebase are prohibited)"
            echo
            echo "## Changelog summary"
            echo
            if [ -n "$summary" ]; then
              echo '```rst'
              echo "$summary"
              echo '```'
            else
              echo "See generated changelog files in this PR."
            fi
          } > "$body_file"

          owned_pulls="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f "base=${TARGET_BRANCH}" \
              -f "head=${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}" \
              -f per_page=100
          )"
          owned_count="$(jq 'length' <<< "$owned_pulls")"
          if [ "$owned_count" -gt 1 ]; then
            echo "::error::Multiple same-repository release PRs exist."
            exit 1
          fi
          if [ "$owned_count" -eq 0 ]; then
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$RELEASE_BRANCH" \
              --title "Release v${VERSION}" \
              --body-file "$body_file"
          fi

          max_pr_lookup_attempts=6
          successful_pr_lookup_count=0
          owned_pr_ready=false
          owned_pulls='[]'
          for (( attempt=1; attempt<=max_pr_lookup_attempts; attempt++ )); do
            lookup_outcome=api-failure
            if ! owned_pulls="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=open \
                -f "base=${TARGET_BRANCH}" \
                -f "head=${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}" \
                -f per_page=100
            )"; then
              owned_pulls='[]'
              if [ "$attempt" -eq "$max_pr_lookup_attempts" ]; then
                if [ "$successful_pr_lookup_count" -eq 0 ]; then
                  echo "::error::Release PR lookup failed on all ${max_pr_lookup_attempts} API attempts."
                else
                  echo "::error::Release PR lookup failed on the final API attempt after" \
                    "${successful_pr_lookup_count} successful but non-converged response(s)."
                fi
                exit 1
              fi
            else
              lookup_outcome=non-converged
              successful_pr_lookup_count=$((successful_pr_lookup_count + 1))
              if ! owned_count="$(
                jq -er 'if type == "array" then length else error("response is not an array") end' \
                  <<< "$owned_pulls"
              )"; then
                echo "::error::Release PR lookup returned invalid JSON or an unexpected response shape."
                exit 1
              fi
              if [ "$owned_count" -gt 1 ]; then
                owned_numbers="$(jq -c 'map(.number)' <<< "$owned_pulls")"
                echo "::error::Multiple same-repository release PRs exist: ${owned_numbers}."
                exit 1
              fi
              if [ "$owned_count" -eq 1 ] && jq -e \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg branch "$RELEASE_BRANCH" \
                --arg base "$TARGET_BRANCH" \
                --arg sha "$pushed_sha" '
                  .[0].head.repo.full_name == $repo
                  and .[0].head.ref == $branch
                  and .[0].head.sha == $sha
                  and .[0].base.ref == $base
                ' <<< "$owned_pulls" >/dev/null
              then
                owned_pr_ready=true
                break
              fi
            fi

            if [ "$attempt" -lt "$max_pr_lookup_attempts" ]; then
              retry_delay=$((1 << (attempt - 1)))
              case "$lookup_outcome" in
                api-failure)
                  echo "::notice::Release PR API request failed; retrying in ${retry_delay}s."
                  ;;
                non-converged)
                  echo "::notice::Release PR lookup has not converged to the exact expected state;" \
                    "retrying in ${retry_delay}s."
                  ;;
                *)
                  echo "::error::Unexpected Release PR lookup outcome: ${lookup_outcome}."
                  exit 1
                  ;;
              esac
              sleep "$retry_delay"
            fi
          done
          if [ "$owned_pr_ready" != true ]; then
            observed_release_pr="$(
              jq -c '
                map({
                  number,
                  head_repository: .head.repo.full_name,
                  head_ref: .head.ref,
                  head_sha: .head.sha,
                  base_ref: .base.ref
                })
              ' <<< "$owned_pulls"
            )"
            echo "::error::Release PR did not converge to the exact same-repository ref/base/head" \
              "after ${max_pr_lookup_attempts} API attempts. Expected" \
              "${GITHUB_REPOSITORY}:${RELEASE_BRANCH}@${pushed_sha} -> ${TARGET_BRANCH};" \
              "observed ${observed_release_pr}."
            exit 1
          fi
          existing="$(jq -r '.[0].number' <<< "$owned_pulls")"
          gh pr edit "$existing" \
            --title "Release v${VERSION}" \
            --body-file "$body_file"

          if [ "$SECURITY_RELEASE" = true ]; then
            test "$WORKFLOW_ACTOR" = 'lightning-it-release-automation[bot]'
            test "$(jq -er '.[0].user.login' <<< "$owned_pulls")" = \
              'lightning-it-release-automation[bot]'
            test "$(jq -er '.[0].head.sha' <<< "$owned_pulls")" = "$pushed_sha"
            gh pr merge "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --auto --merge --match-head-commit "$pushed_sha"
          fi
