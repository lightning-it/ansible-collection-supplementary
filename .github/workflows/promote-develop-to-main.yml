# Repository-local adoption from lightning-it/shared-assets-lit.
# Keep this repository-local workflow aligned with the protected release policy.
# yamllint disable rule:truthy
---
name: Promote develop to main

on:
  push:
    branches: [develop]
  schedule:
    # Reconcile after trusted automerge jobs whose GITHUB_TOKEN merge does not
    # emit another workflow-triggering push event.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-develop-to-main
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch promotion from protected main
    if: >-
      github.repository == 'lightning-it/ansible-collection-supplementary' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the trusted main-ref promotion job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" -eq 1
          gh workflow run promote-develop-to-main.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

  promote:
    # This protected source is bound only to itself. Every downstream copy is
    # rendered to exactly one inventory-authorized target before installation.
    if: >-
      github.repository == 'lightning-it/ansible-collection-supplementary' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ansible-collection-release-prepare

    steps:
      - name: Reject reruns before credential minting
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" -eq 1

      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Create or reconcile one protected promotion PR
        env:
          APP_INSTALLATION_ID: ${{ steps.release-app.outputs.installation-id }}
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" -eq 1
          title='chore(release): promote develop to main'
          test "${APP_SLUG}" = lightning-it-release-automation
          test "${APP_INSTALLATION_ID}" = 148019054
          installations="$(gh api --paginate --slurp \
            'installation/repositories?per_page=100')"
          jq -e --arg repository "${REPOSITORY}" '
            [.[].repositories[]?] as $repositories
            | ($repositories | length) == 1
            and $repositories[0].full_name == $repository
          ' <<<"${installations}" >/dev/null

          repository="$(gh api "repos/${REPOSITORY}")"
          main="$(gh api "repos/${REPOSITORY}/branches/main")"
          develop="$(gh api "repos/${REPOSITORY}/branches/develop")"
          jq -e --arg repository "${REPOSITORY}" '
            .full_name == $repository and .archived == false and .disabled == false
          ' <<<"${repository}" >/dev/null
          jq -e '.name == "main" and .protected == true' <<<"${main}" >/dev/null
          jq -e '.name == "develop" and .protected == true' <<<"${develop}" >/dev/null
          expected_base="$(jq -er .commit.sha <<<"${main}")"
          expected_head="$(jq -er .commit.sha <<<"${develop}")"
          [[ "${expected_base}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${expected_head}" =~ ^[0-9a-f]{40}$ ]]

          head_marker="<!-- lit-promotion-head:${expected_head} -->"
          run_marker="<!-- lit-promotion-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
          ready_marker="<!-- lit-promotion-evidence-ready:${expected_base}:${expected_head} -->"

          compare="$(gh api \
            "repos/${REPOSITORY}/compare/${expected_base}...${expected_head}")"
          jq -e --arg base "${expected_base}" --arg head "${expected_head}" '
            .base_commit.sha == $base
            and .merge_base_commit.sha == $base
            and .status == "ahead"
            and (.ahead_by | type) == "number"
            and (.ahead_by | isfinite)
            and (.ahead_by | floor) == .ahead_by
            and .ahead_by > 0
            and (.behind_by | type) == "number"
            and (.behind_by | isfinite)
            and (.behind_by | floor) == .behind_by
            and .behind_by == 0
            and (.total_commits | type) == "number"
            and (.total_commits | isfinite)
            and (.total_commits | floor) == .total_commits
            and .total_commits == .ahead_by
            and (.commits | type) == "array"
            and (.commits | length) == ([.total_commits, 250] | min)
            and all(.commits[];
              type == "object"
              and (.sha | type) == "string"
              and (.sha | test("^[0-9a-f]{40}$")))
            and ([.commits[].sha] | length) ==
              ([.commits[].sha] | unique | length)
            and .commits[-1].sha == $head
          ' <<<"${compare}" >/dev/null

          token_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${token_header}"
          test ! -e repository
          git init --quiet repository
          git -C repository remote add origin "https://github.com/${REPOSITORY}.git"
          git -C repository \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
            fetch --quiet --no-tags origin main develop
          test "$(git -C repository rev-parse origin/main)" = "${expected_base}"
          test "$(git -C repository rev-parse origin/develop)" = "${expected_head}"
          # LI-139 release-state guard:start
          # An ancestry-only merge does not import release-generated state.
          # Normal promotions must preserve that state, including failed pre-tag
          # preparations. Only the governed release/back-sync paths advance it.
          # Preserve every existing Security record, not just this release.
          # New records may enter through the separately reviewed intake path.
          security_history_changes="$(git -C repository diff --name-only --no-renames \
            --no-ext-diff --no-textconv --diff-filter=CDMRTUXB \
            "$expected_base" "$expected_head" -- .lit/security-releases .lit/security-release-intakes)"
          test -z "$security_history_changes"
          base_version="$(git -C repository show "${expected_base}:galaxy.yml" | sed -n 's/^version: //p')"
          head_version="$(git -C repository show "${expected_head}:galaxy.yml" | sed -n 's/^version: //p')"
          stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$base_version" =~ $stable_version ]]
          [[ "$head_version" =~ $stable_version ]]
          if [ "$head_version" != "$base_version" ]; then
            echo '::error::Back-sync protected-main release metadata before promoting develop.'
            exit 1
          fi
          for release_path in CHANGELOG.rst changelogs/.plugin-cache.yaml \
              changelogs/changelog.yaml changelogs/release-preparation.json; do
            test "$(git -C repository cat-file -t "${expected_base}:${release_path}")" = blob
            test "$(git -C repository cat-file -t "${expected_head}:${release_path}")" = blob
            git -C repository diff --exit-code --quiet --no-ext-diff --no-textconv \
              "$expected_base" "$expected_head" -- "$release_path"
          done
          release_receipt="$(git -C repository show "${expected_base}:changelogs/release-preparation.json")"
          jq -e --arg version "$base_version" '
            .schema_version == 2 and .next_version == $version
            and (
              if .release_mode == "normal" then
                .security == null and .chain_id == null
              elif .release_mode == "security" then
                (.security | type == "object")
                and (.chain_id | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                and .security.metadata_path == (".lit/security-releases/" + $version + ".json")
                and .security.intake_receipt_path == (".lit/security-release-intakes/" + $version + ".json")
                and (.security.metadata_sha256 | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                and (.security.intake_receipt_sha256 | type == "string" and test("^sha256:[0-9a-f]{64}$"))
              else false end
            )
            and (.fragments | type == "array" and length > 0)
            and all(.fragments[];
              (.path | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*\\.ya?ml$"))
              and (.sha256 | type == "string" and test("^[0-9a-f]{64}$")))
            and ([.fragments[].path] | length) == ([.fragments[].path] | unique | length)
          ' <<<"$release_receipt" >/dev/null
          if [ "$(jq -r '.release_mode' <<<"$release_receipt")" = security ]; then
            for security_kind in metadata intake_receipt; do
              security_path="$(jq -er --arg key "${security_kind}_path" '.security[$key]' <<<"$release_receipt")"
              expected_digest="$(jq -er --arg key "${security_kind}_sha256" '.security[$key]' <<<"$release_receipt")"
              test "$(git -C repository cat-file -t "${expected_base}:${security_path}")" = blob
              test "$(git -C repository cat-file -t "${expected_head}:${security_path}")" = blob
              actual_digest="$(git -C repository show "${expected_base}:${security_path}" | sha256sum | cut -d ' ' -f1)"
              test "sha256:${actual_digest}" = "$expected_digest"
              git -C repository diff --exit-code --quiet --no-ext-diff --no-textconv \
                "$expected_base" "$expected_head" -- "$security_path"
            done
          else
            # Normal mode cannot gain or retain a current-version Security marker.
            for security_directory in .lit/security-releases .lit/security-release-intakes; do
              for revision in "$expected_base" "$expected_head"; do
                security_entry="$(git -C repository ls-tree --full-tree "$revision" -- \
                  "${security_directory}/${base_version}.json")"
                test -z "$security_entry"
              done
            done
          fi
          while IFS= read -r consumed_fragment; do
            consumed_entry="$(git -C repository ls-tree --full-tree "$expected_head" -- \
              "changelogs/fragments/${consumed_fragment}")"
            if [ -n "$consumed_entry" ]; then
              echo '::error::Develop restores a consumed release fragment; complete release back-sync first.'
              exit 1
            fi
          done < <(jq -r '.fragments[].path' <<<"$release_receipt")
          # LI-139 release-state guard:end
          changed_paths=()
          mapfile -t changed_paths < <(
            git -C repository diff --name-only \
              "${expected_base}" "${expected_head}" --
          )
          if [ "${#changed_paths[@]}" -eq 1 ] \
              && [ "${changed_paths[0]}" = .lit/main-ancestry.json ]; then
            outer_parents="$(git -C repository show -s --format=%P "${expected_head}")"
            read -r outer_develop_parent inner_merge unexpected_outer_parent \
              <<<"${outer_parents}"
            if [ -z "${outer_develop_parent}" ] \
                || [ -z "${inner_merge}" ] \
                || [ -n "${unexpected_outer_parent:-}" ]; then
              echo '::error::The ancestry-only develop delta is not a two-parent protected PR merge.'
              exit 1
            fi
            inner_parents="$(git -C repository show -s --format=%P "${inner_merge}")"
            read -r inner_develop_parent inner_main_parent unexpected_inner_parent \
              <<<"${inner_parents}"
            if [ -z "${inner_develop_parent}" ] \
                || [ -z "${inner_main_parent}" ] \
                || [ -n "${unexpected_inner_parent:-}" ]; then
              echo '::error::The protected inner ancestry merge does not have exactly two parents.'
              exit 1
            fi
            evidence="$(git -C repository show \
              "${expected_head}:.lit/main-ancestry.json")"
            if [ "${inner_develop_parent}" != "${outer_develop_parent}" ] \
                || [ "${inner_main_parent}" != "${expected_base}" ] \
                || ! jq -e \
                  --arg repository "${REPOSITORY}" \
                  --arg main_sha "${expected_base}" \
                  --arg develop_parent_sha "${outer_develop_parent}" '
                    (keys | sort) == [
                      "develop_parent_sha", "main_sha", "purpose",
                      "repository", "schema_version"
                    ]
                    and .schema_version == 1
                    and .repository == $repository
                    and .main_sha == $main_sha
                    and .develop_parent_sha == $develop_parent_sha
                    and .purpose == "Bind the reviewed main ancestry backmerge."
                  ' <<<"${evidence}" >/dev/null; then
              echo '::error::The ancestry-only develop delta does not match the protected backmerge contract.'
              exit 1
            fi
            echo 'Only exact protected ancestry evidence changed; no promotion is needed.'
            exit 0
          fi

          body_detail='The organization Required Workflow aggregates exact ingress evidence;'
          body_detail="${body_detail} it does not request a second AI review of the cumulative diff."
          body_text="$(printf '%s\n%s\n%s' \
            '<!-- lit-protected-promotion:v2 -->' \
            'Automated protected promotion of changes already reviewed on develop.' \
            "${body_detail}")"
          ready_body="$(printf '%s\n%s\n%s\n%s' \
            "${head_marker}" "${run_marker}" "${ready_marker}" "${body_text}")"
          pulls="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls?state=open&per_page=100")"
          jq -e '
            type == "array"
            and length > 0
            and all(.[]; type == "array")
            and all(.[][];
              type == "object"
              and (.number | type) == "number"
              and (.state | type) == "string"
              and (.draft | type) == "boolean"
              and (.title | type) == "string"
              and ((.body == null) or ((.body | type) == "string"))
              and (.user | type) == "object"
              and (.user.login | type) == "string"
              and (.user.id | type) == "number"
              and (.user.type | type) == "string"
              and (.base | type) == "object"
              and (.base.ref | type) == "string"
              and (.base.sha | type) == "string"
              and (.base.repo | type) == "object"
              and (.base.repo.full_name | type) == "string"
              and (.head | type) == "object"
              and (.head.ref | type) == "string"
              and (.head.sha | type) == "string"
              and (.head | has("repo"))
              and ((.head.repo == null) or (
                (.head.repo | type) == "object"
                and (.head.repo.full_name | type) == "string")))
          ' <<<"${pulls}" >/dev/null
          candidates="$(jq -c \
            --arg body_text "${body_text}" \
            --arg title "${title}" '
            [.[][]
              | select(.user.login == "lightning-it-release-automation[bot]")
              | select(.user.id == 307565056 and .user.type == "Bot")
              | select(
                  .title == $title
                  or ((.body // "") | endswith("\n" + $body_text))
                )]
          ' <<<"${pulls}")"
          count="$(jq 'length' <<<"${candidates}")"
          test "${count}" -le 1
          created=false
          create_promotion_pr() {
            created_response="$(gh api --method POST "repos/${REPOSITORY}/pulls" \
              -f "title=${title}" \
              -f head=develop \
              -f base=main \
              -f "body=${ready_body}")"
            pr_number="$(jq -er '.number | select(type == "number")' <<<"${created_response}")"
            created=true
          }
          if [ "${count}" -eq 0 ]; then
            create_promotion_pr
          else
            pr_number="$(jq -er '.[0].number' <<<"${candidates}")"
          fi
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]

          live="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          if [ "${created}" != true ]; then
            if ! jq -e \
              --arg repository "${REPOSITORY}" \
              --arg title "${title}" '
                .state == "open"
                and .user.login == "lightning-it-release-automation[bot]"
                and .user.id == 307565056
                and .user.type == "Bot"
                and .title == $title
                and .base.ref == "main"
                and .base.repo.full_name == $repository
                and .head.ref == "develop"
                and .head.repo != null
                and .head.repo.full_name == $repository
              ' <<<"${live}" >/dev/null; then
              echo '::error::Existing controller-owned promotion PR was retargeted or detached.'
              exit 1
            fi
            stale_binding="$(jq -er \
              --arg body_text "${body_text}" \
              --arg expected_base "${expected_base}" \
              --arg expected_head "${expected_head}" '
                ((.body // "") | split("\n")) as $lines
                | select(($lines | length) == 6)
                | ($lines[0] | capture(
                  "^<!-- lit-promotion-head:(?<head>[0-9a-f]{40}) -->$"
                )) as $head_marker
                | ($lines[1] | capture(
                  "^<!-- lit-promotion-run:[1-9][0-9]*:"
                  + "(?<attempt>[1-9][0-9]*) -->$"
                )) as $run
                | ($lines[2] | capture(
                  "^<!-- lit-promotion-evidence-(?<state>pending|ready):"
                  + "(?<base>[0-9a-f]{40}):(?<head>[0-9a-f]{40}) -->$"
                )) as $evidence
                | select($head_marker.head == $evidence.head)
                | select($evidence.state == "pending" or $run.attempt == "1")
                | select(($lines[3:] | join("\n")) == $body_text)
                | select(
                  $evidence.state == "pending"
                  or $evidence.base != $expected_base
                  or $evidence.head != $expected_head
                )
                | [$evidence.state, $evidence.base, $evidence.head] | @tsv
              ' <<<"${live}" || true)"
            if [ -n "${stale_binding}" ]; then
              read -r stale_kind stale_base stale_head <<<"${stale_binding}"
              [[ "${stale_kind}" =~ ^(pending|ready)$ ]]
              [[ "${stale_base}" =~ ^[0-9a-f]{40}$ ]]
              [[ "${stale_head}" =~ ^[0-9a-f]{40}$ ]]
              stale_body="$(jq -er '.body | select(type == "string")' <<<"${live}")"
              stale_live_base="$(jq -er '
                .base.sha | select(test("^[0-9a-f]{40}$"))
              ' <<<"${live}")"
              stale_live_head="$(jq -er '
                .head.sha | select(test("^[0-9a-f]{40}$"))
              ' <<<"${live}")"
              jq -e \
                --arg body "${stale_body}" \
                --arg repository "${REPOSITORY}" \
                --arg title "${title}" \
                --argjson number "${pr_number}" '
                  .number == $number
                  and .state == "open"
                  and .draft == false
                  and .user.login == "lightning-it-release-automation[bot]"
                  and .user.id == 307565056
                  and .user.type == "Bot"
                  and .base.ref == "main"
                  and .base.repo.full_name == $repository
                  and .head.ref == "develop"
                  and .head.repo.full_name == $repository
                  and .title == $title
                  and .body == $body
                ' <<<"${live}" >/dev/null
              closed="$(gh api --method PATCH \
                "repos/${REPOSITORY}/pulls/${pr_number}" -f state=closed)"
              jq -e \
                --arg base "${stale_live_base}" \
                --arg body "${stale_body}" \
                --arg head "${stale_live_head}" \
                --arg repository "${REPOSITORY}" \
                --arg title "${title}" \
                --argjson number "${pr_number}" '
                  .number == $number
                  and .state == "closed"
                  and .user.login == "lightning-it-release-automation[bot]"
                  and .user.id == 307565056
                  and .user.type == "Bot"
                  and .base.ref == "main"
                  and .base.sha == $base
                  and .base.repo.full_name == $repository
                  and .head.ref == "develop"
                  and .head.sha == $head
                  and .head.repo.full_name == $repository
                  and .title == $title
                  and .body == $body
                ' <<<"${closed}" >/dev/null
              echo "Closed ${stale_kind} legacy/stale promotion PR #${pr_number} bound to ${stale_base}..${stale_head}."
              create_promotion_pr
              [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]
              live="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
            fi
          fi
          jq -e \
            --arg base "${expected_base}" \
            --arg head "${expected_head}" \
            --arg repository "${REPOSITORY}" \
            --arg title "${title}" \
            --argjson number "${pr_number}" '
              .number == $number
              and .state == "open"
              and .draft == false
              and .user.login == "lightning-it-release-automation[bot]"
              and .user.id == 307565056
              and .user.type == "Bot"
              and .base.ref == "main"
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and .head.ref == "develop"
              and .head.sha == $head
              and .head.repo.full_name == $repository
              and .title == $title
            ' <<<"${live}" >/dev/null

          if [ "${created}" = true ]; then
            jq -e --arg ready_body "${ready_body}" \
              '.body == $ready_body' <<<"${live}" >/dev/null
            bound_run_marker="${run_marker}"
          elif jq -e \
              --arg head_marker "${head_marker}" \
              --arg ready_marker "${ready_marker}" \
              --arg body_text "${body_text}" '
              ((.body // "") | split("\n")) as $lines
              | ($lines | length) == 6
              and $lines[0] == $head_marker
              and ($lines[1] |
                test("^<!-- lit-promotion-run:[1-9][0-9]*:1 -->$"))
              and $lines[2] == $ready_marker
              and ($lines[3:] | join("\n")) == $body_text
            ' <<<"${live}" >/dev/null; then
            echo "Promotion PR #${pr_number} already has exact ready evidence."
            bound_run_marker="$(jq -er '
              (.body // "") | split("\n")[1]
              | select(test(
                "^<!-- lit-promotion-run:[1-9][0-9]*:1 -->$"
              ))
            ' <<<"${live}")"
          else
            echo '::error::Existing promotion evidence is failed, stale, or malformed.'
            exit 1
          fi

          ready_body="$(printf '%s\n%s\n%s\n%s' \
            "${head_marker}" "${bound_run_marker}" \
            "${ready_marker}" "${body_text}")"

          latest_main="$(gh api "repos/${REPOSITORY}/branches/main")"
          latest_develop="$(gh api "repos/${REPOSITORY}/branches/develop")"
          latest="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          live_main_sha="$(jq -er '
            select(.name == "main" and .protected == true)
            | .commit.sha | select(test("^[0-9a-f]{40}$"))
          ' <<<"${latest_main}")"
          live_develop_sha="$(jq -er '
            select(.name == "develop" and .protected == true)
            | .commit.sha | select(test("^[0-9a-f]{40}$"))
          ' <<<"${latest_develop}")"
          jq -e \
            --arg base "${expected_base}" \
            --arg body "${ready_body}" \
            --arg head "${expected_head}" \
            --arg repository "${REPOSITORY}" \
            --arg title "${title}" \
            --argjson number "${pr_number}" '
              .number == $number
              and .state == "open"
              and .draft == false
              and .user.login == "lightning-it-release-automation[bot]"
              and .user.id == 307565056
              and .user.type == "Bot"
              and .base.ref == "main"
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and .head.ref == "develop"
              and .head.sha == $head
              and .head.repo.full_name == $repository
              and .title == $title
              and .body == $body
            ' <<<"${latest}" >/dev/null
          if [ "${live_main_sha}" != "${expected_base}" ] \
              || [ "${live_develop_sha}" != "${expected_head}" ]; then
            closed="$(gh api --method PATCH \
              "repos/${REPOSITORY}/pulls/${pr_number}" -f state=closed)"
            jq -e \
              --arg base "${expected_base}" \
              --arg body "${ready_body}" \
              --arg head "${expected_head}" \
              --argjson number "${pr_number}" '
                .number == $number
                and .state == "closed"
                and .base.sha == $base
                and .head.sha == $head
                and .body == $body
              ' <<<"${closed}" >/dev/null
            echo '::error::Protected branch drift closed the exact promotion PR.'
            exit 1
          fi

          finalized="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          jq -e \
            --arg ready_body "${ready_body}" \
            --arg base "${expected_base}" \
            --arg head "${expected_head}" '
              .state == "open"
              and .base.sha == $base
              and .head.sha == $head
              and .body == $ready_body
            ' <<<"${finalized}" >/dev/null
          final_main="$(gh api "repos/${REPOSITORY}/branches/main")"
          final_develop="$(gh api "repos/${REPOSITORY}/branches/develop")"
          final_main_sha="$(jq -er '
            select(.name == "main" and .protected == true)
            | .commit.sha | select(test("^[0-9a-f]{40}$"))
          ' <<<"${final_main}")"
          final_develop_sha="$(jq -er '
            select(.name == "develop" and .protected == true)
            | .commit.sha | select(test("^[0-9a-f]{40}$"))
          ' <<<"${final_develop}")"
          if [ "${final_main_sha}" != "${expected_base}" ] \
              || [ "${final_develop_sha}" != "${expected_head}" ]; then
            closed="$(gh api --method PATCH \
              "repos/${REPOSITORY}/pulls/${pr_number}" -f state=closed)"
            jq -e \
              --arg base "${expected_base}" \
              --arg body "${ready_body}" \
              --arg head "${expected_head}" \
              --argjson number "${pr_number}" '
                .number == $number
                and .state == "closed"
                and .base.sha == $base
                and .head.sha == $head
                and .body == $body
              ' <<<"${closed}" >/dev/null
            echo '::error::Protected branch drift closed the finalized stale promotion PR.'
            exit 1
          fi
          echo "Promotion PR #${pr_number} is bound to ${expected_base}..${expected_head}."
