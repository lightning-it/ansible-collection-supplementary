# LI-259 only. Events never create a second entitlement to an effect.
# yamllint disable rule:truthy rule:line-length
---
name: Recover native verifier infrastructure failure
on:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: li259-native-verifier-recovery
  cancel-in-progress: false
env:
  LI219_EVENT_MODE: ${{ vars.LI219_EVENT_MODE }}
  LI259_INFRA_RETRY: ${{ vars.LI259_INFRA_RETRY }}
jobs:
  reconcile:
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: read
    if: >-
      vars.LI259_INFRA_RETRY == 'enabled' && vars.LI219_EVENT_MODE == 'enabled' &&
      github.ref_protected && github.run_attempt == 1 &&
      contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable protected recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile consumed technical verifier slots
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          docker run --rm --read-only --network bridge \
            --cap-drop ALL --security-opt no-new-privileges=true \
            --pids-limit 128 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -e GH_TOKEN -e GITHUB_REPOSITORY -e GITHUB_REPOSITORY_ID \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_EVENT_NAME \
            -e GITHUB_REF_PROTECTED -e GITHUB_WORKFLOW_SHA \
            -e LI219_EVENT_MODE -e LI259_INFRA_RETRY \
            -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" -w /workspace \
            quay.io/l-it/ee-wunder-devtools-ubi9:v1.16.1@sha256:c5e8707e825fcddb3e7bbc7592ebdc99a02e6ba9fa2cad71b88bcd5c71bd4d08 \
            python3 scripts/native_verifier_retry.py reconcile
