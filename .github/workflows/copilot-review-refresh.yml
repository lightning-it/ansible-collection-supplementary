# Managed pilot event path and preserved canonical manual refresh controller.
# yamllint disable rule:truthy rule:line-length
---
name: Refresh Copilot review gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Authoritative PR locator
        required: false
        type: number
      expected_head:
        description: Frozen head locator
        required: false
        type: string
      expected_base:
        description: Frozen base locator
        required: false
        type: string
      review_id:
        description: Authoritative review locator
        required: false
        type: number
      expected_base_sha:
        description: Frozen pull-request base SHA
        required: false
        type: string
      expected_head_sha:
        description: Frozen pull-request head SHA
        required: false
        type: string
      required_workflow_run_id:
        description: Exact failed Required-Workflow run for review-free bootstrap recovery
        required: false
        default: 0
        type: number
      evidence_comment_id:
        description: Optional exact maintainer reply proving resolved findings
        required: false
        default: 0
        type: number
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Reconcile review PR #{0} head {1}', inputs.pr_number, inputs.expected_head) || format('Refresh review PR #{0}', github.event.pull_request.number) }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    ${{
      !(vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) && format('copilot-review-refresh-{0}-{1}', github.repository, inputs.pr_number) ||
      github.event_name == 'workflow_dispatch' && github.ref_protected && github.actor == 'github-actions[bot]' &&
      format('current-revision-{0}-head-{1}-check-current-revision-review', github.repository_id, inputs.expected_head) ||
      github.event.pull_request.draft == false && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository &&
      (
        ('pull_request_review' == github.event_name && (
          (contains(fromJSON('["Copilot","copilot-pull-request-reviewer","copilot-pull-request-reviewer[bot]"]'), github.actor) && 'copilot-pull-request-reviewer[bot]' == github.event.review.user.login) ||
          ('litroc' == github.actor && 'litroc' == github.event.review.user.login) ||
          (contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.review.author_association) && github.event.sender.login == github.actor && (github.event.action == 'dismissed' || github.event.review.user.login == github.actor))
        )) ||
        ('pull_request_review_comment' == github.event_name && (
          (contains(fromJSON('["Copilot","copilot-pull-request-reviewer","copilot-pull-request-reviewer[bot]"]'), github.actor) && 'copilot-pull-request-reviewer[bot]' == github.event.comment.user.login) ||
          ('litroc' == github.actor && 'litroc' == github.event.comment.user.login) ||
          (contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association) && github.event.sender.login == github.actor && (github.event.action == 'deleted' || github.event.comment.user.login == github.actor))
        ))
      ) && format('current-revision-{0}-head-{1}-check-current-revision-review', github.repository_id, github.event.pull_request.head.sha) ||
      format('current-revision-quarantine-{0}', github.run_id)
    }}
  cancel-in-progress: false

env:
  LI219_EVENT_MODE: ${{ (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) && 'enabled' || 'disabled' }}

jobs:
  forward-review-event:
    name: Locate protected review refresh
    if: >-
      (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (
          github.event_name == 'pull_request_review' &&
          (
            (
              contains(fromJSON('["Copilot","copilot-pull-request-reviewer","copilot-pull-request-reviewer[bot]"]'), github.actor) &&
              github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
            ) ||
            (
              github.actor == 'litroc' &&
              github.event.review.user.login == 'litroc'
            ) ||
            contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.review.author_association)
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          (
            (
              contains(fromJSON('["Copilot","copilot-pull-request-reviewer","copilot-pull-request-reviewer[bot]"]'), github.actor) &&
              github.event.comment.user.login == 'copilot-pull-request-reviewer[bot]'
            ) ||
            (
              github.actor == 'litroc' &&
              github.event.comment.user.login == 'litroc'
            ) ||
            contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
          )
        )
      )
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Forward the exact review locator to the protected source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          api() { timeout --foreground --signal=TERM --kill-after=2s 30s gh api "$@"; }
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_REPOSITORY}" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ ]]
          test "${HEAD_REPOSITORY}" = "${REPOSITORY}"
          validate_locator_pr() {
            pr="$(api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            jq -e --arg repo "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" --arg head "${EXPECTED_HEAD}" --arg base "${EXPECTED_BASE}" \
            --arg head_ref "${HEAD_REF}" --arg author "${PR_AUTHOR}" --argjson number "${PR_NUMBER}" '
            .state == "open" and .draft == false and .head.sha == $head and .base.sha == $base
            and .head.repo.full_name == $head_repository and .base.repo.full_name == $repo
            and ($head_repository == $repo or .user.type == "User")
            and .head.ref == $head_ref and .user.login == $author and .number == $number
            ' <<<"${pr}" >/dev/null
          }
          validate_locator_pr
          branch="$(jq -er .base.ref <<<"${pr}")"
          [[ "${branch}" =~ ^(develop|main)$ ]]
          reviews="$(api --paginate --slurp "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          review="$(jq -er --arg head "${EXPECTED_HEAD}" '
            select(type == "array" and length > 0 and length <= 10)
            | select(all(.[]; type == "array"))
            | [.[][] | select(.commit_id == $head and .user.login == "copilot-pull-request-reviewer[bot]")
              | select(.state | ascii_downcase | IN("commented", "approved"))
              | .id | numbers | select(. > 0 and . == floor)] | max // empty
            ' <<<"${reviews}")" || exit 0
          # Locators grant no mutation authority; the protected consumer repeats
          # all source, owner, review and current-head checks. Never retry POST.
          validate_locator_pr
          test "$(jq -er .base.ref <<<"${pr}")" = "${branch}"
          api --method POST "repos/${REPOSITORY}/actions/workflows/copilot-review-refresh.yml/dispatches" \
            -f "ref=${branch}" -f "inputs[pr_number]=${PR_NUMBER}" \
            -f "inputs[expected_head]=${EXPECTED_HEAD}" -f "inputs[expected_base]=${EXPECTED_BASE}" \
            -f "inputs[review_id]=${review}"

  refresh-canonical-gate:
    name: ${{ (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) && 'Refresh canonical Copilot review gate' || 'Inactive event writer' }}
    if: >-
      (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) &&
      github.event_name == 'workflow_dispatch' && github.ref_protected && github.actor == 'github-actions[bot]'
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Materialize the protected operation claim
        run: |
          set -euo pipefail
          umask 077
          cat >"${RUNNER_TEMP}/refresh-operation.sh" <<'CLAIM'
          claim_review_operation() {
            [ "${LI219_EVENT_MODE:-disabled}" = enabled ] || return 0
            # The data ref is the CAS authority; Check inventory is never a lock.
            local target="$1" head="$2" base="$3" pr="$4"
            local key path action target_run created now prior snapshot record payload response committed marker rows attempt
            [[ "${target}" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "${pr}" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "${head}" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "${base}" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "${GITHUB_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || return 1
            [ "${GITHUB_RUN_ATTEMPT}" = 1 ] || return 1
            action="${5:-rerun}"
            case "${action}" in
              rerun) [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || return 1 ;;
              request) [ "${GITHUB_EVENT_NAME}" = pull_request_target ] || return 1 ;;
              *) return 1 ;;
            esac
            [ "${GITHUB_REF_PROTECTED}" = true ] || return 1
            [[ "${GITHUB_REF}" =~ ^refs/heads/(develop|main)$ ]] || return 1
            [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]] || return 1
            operation_api() {
              if declare -F bounded_gh_api >/dev/null; then
                bounded_gh_api "$@"
              else
                timeout --foreground --signal=TERM --kill-after=2s 30s gh api "$@"
              fi
            }
            operation_ref() {
              local result
              result="$(operation_api "repos/${REPOSITORY}/git/ref/heads/lit-review-operations")" || return 1
              jq -er 'select(.ref == "refs/heads/lit-review-operations" and .object.type == "commit")
                | .object.sha | strings | select(test("^[0-9a-f]{40}$"))' <<<"${result}"
            }
            operation_snapshot() {
              # Source commit, manifest and operation are one immutable snapshot. Never
              # combine a mutable ref read with a separately resolved branch:path read.
              local oid="$1" result
              result="$(operation_api graphql -f query='query($owner:String!,$name:String!,$oid:String!,$manifest:String!,$record:String!){
                repository(owner:$owner,name:$name){nameWithOwner
                  source:object(expression:$oid){__typename oid}
                  manifest:object(expression:$manifest){__typename ... on Blob{isTruncated byteSize text}}
                  record:object(expression:$record){__typename ... on Blob{isTruncated byteSize text}}
                }}' -f "owner=${REPOSITORY%%/*}" -f "name=${REPOSITORY#*/}" \
                -f "oid=${oid}" -f "manifest=${oid}:manifest.json" -f "record=${oid}:${path}")" || return 1
              jq -ce --arg oid "${oid}" --arg repo "${REPOSITORY}" --arg repo_id "${GITHUB_REPOSITORY_ID}" '
                select(has("errors") | not) | .data.repository
                | select(.nameWithOwner == $repo and .source.__typename == "Commit" and .source.oid == $oid)
                | select(.manifest.__typename == "Blob" and .manifest.isTruncated == false
                    and (.manifest.byteSize | type) == "number" and .manifest.byteSize > 0 and .manifest.byteSize <= 4096)
                | select((.manifest.text | fromjson) == {schema:1,repository:$repo,repository_id:$repo_id,ref:"refs/heads/lit-review-operations"})
                | select(has("record"))
                | if .record == null then {present:false} else
                    .record | select(.__typename == "Blob" and .isTruncated == false
                      and (.byteSize | type) == "number" and .byteSize > 0 and .byteSize <= 4096)
                    | {present:true,record:(.text | fromjson)} end
                ' <<<"${result}"
            }
            target_run="$(operation_api "repos/${REPOSITORY}/actions/runs/${target}")" || return 1
            created="$(jq -er --argjson id "${target}" '
              select(.id == $id and .run_attempt == 1) | .created_at | fromdateiso8601
              ' <<<"${target_run}")" || return 1
            now="$(date +%s)"
            if [ "$((now - created))" -gt 604800 ] || [ "${created}" -gt "${now}" ]; then
              echo 'Verifier event reservation expired; merge remains blocked.' >&2
              return 1
            fi
            key="li219-verifier-operation:v1:${pr}:${base}:${head}:${target}"
            if [ "${action}" = request ]; then
              # Base changes and fresh producer run IDs cannot buy another AI call.
              key="li219-review-request:v1:${GITHUB_REPOSITORY_ID}:${pr}:${head}"
            fi
            path="operations/$(printf '%s' "${key}" | sha256sum | cut -d ' ' -f 1).json"
            prior="$(operation_ref)" || return 1
            snapshot="$(operation_snapshot "${prior}")" || return 1
            if [ "$(jq -r .present <<<"${snapshot}")" != false ]; then
              echo 'Verifier operation already consumed; only native-state reconciliation is allowed.' >&2
              return 1
            fi
            record="$(jq -cn --arg key "${key}" --arg repo "${REPOSITORY}" --arg run "${GITHUB_RUN_ID}" \
              --arg source "${WORKFLOW_SHA}" --arg repo_id "${GITHUB_REPOSITORY_ID}" --arg action "${action}" '{schema:1,repository:$repo,repository_id:$repo_id,action:$action,operation:$key,claim_run:$run,claim_attempt:"1",source_sha:$source}')" || return 1
            payload="$(jq -cn --arg repo "${REPOSITORY}" --arg prior "${prior}" --arg path "${path}" \
              --arg content "$(printf '%s' "${record}" | base64 -w 0)" '{
                query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid parents(first:2){nodes{oid}}}}}",
                variables:{input:{branch:{repositoryNameWithOwner:$repo,branchName:"lit-review-operations"},
                  expectedHeadOid:$prior,message:{headline:"Consume LI-219 verifier operation"},
                  fileChanges:{additions:[{path:$path,contents:$content}]}}}}')" || return 1
            # Exactly one CAS attempt. A lost response or conflict is NOT permission to
            # retry a mutation, even if readback finds our record. Only confirmed winners
            # may reach the single rerun POST in this invocation.
            committed=''
            if response="$(operation_api graphql --input - <<<"${payload}")"; then
              committed="$(jq -er --arg prior "${prior}" '
                select(has("errors") | not) | .data.createCommitOnBranch.commit
                | select(.parents.nodes == [{oid:$prior}])
                | .oid | strings | select(test("^[0-9a-f]{40}$") and . != $prior)
                ' <<<"${response}")" || committed=''
            fi
            if [ -z "${committed}" ]; then
              for attempt in 1 2 3; do
                if prior="$(operation_ref)" && snapshot="$(operation_snapshot "${prior}")" \
                    && [ "$(jq -r .present <<<"${snapshot}")" = true ]; then break; fi
                [ "${attempt}" -eq 3 ] || sleep 2
              done
              echo 'CAS conflict or uncertain claim response; reconciliation only, no rerun sent.' >&2
              return 1
            fi
            snapshot="$(operation_snapshot "${committed}")" || return 1
            jq -e --argjson record "${record}" '.present == true and .record == $record' \
              <<<"${snapshot}" >/dev/null || return 1
            if [ "${action}" = request ]; then
              CLAIM_COMMIT="${committed}"
              return 0
            fi
            marker="$(jq -cn --arg key "${key}" --arg run "${GITHUB_RUN_ID}" \
              --arg commit "${committed}" '{operation:$key,claim_run:$run,claim_attempt:"1",journal_commit:$commit}')" || return 1
            operation_api --method POST "repos/${REPOSITORY}/check-runs" \
              -f 'name=Review event operation' -f "head_sha=${head}" -f "external_id=${key}" \
              -f status=completed -f conclusion=neutral -f 'output[title]=Verifier mutation consumed' \
              -f "output[summary]=${marker}" >/dev/null || true
            for attempt in 1 2 3; do
              if rows="$(operation_api --paginate --slurp \
                  "repos/${REPOSITORY}/commits/${head}/check-runs?check_name=Review%20event%20operation&filter=all&per_page=100")" \
                && jq -e --arg marker "${marker}" --arg key "${key}" --arg head "${head}" '
                  select(type == "array" and length > 0 and length <= 10)
                  | select(all(.[]; (.check_runs | type) == "array"))
                  | [.[].check_runs[] | select(.external_id == $key)]
                  | length == 1 and .[0].output.summary == $marker
                    and .[0].name == "Review event operation" and .[0].head_sha == $head
                    and .[0].app.id == 15368 and .[0].app.slug == "github-actions"
                    and .[0].status == "completed" and .[0].conclusion == "neutral"
                    and .[0].output.title == "Verifier mutation consumed"
                  ' <<<"${rows}" >/dev/null; then return 0; fi
              [ "${attempt}" -eq 3 ] || sleep 2
            done
            echo 'Consumed operation receipt not visible; no rerun sent.' >&2
            return 1
          }
          CLAIM
      - name: Rerun the canonical protected gate when needed
        env:
          LOCATOR_PR: ${{ inputs.pr_number }}
          LOCATOR_HEAD: ${{ inputs.expected_head }}
          LOCATOR_BASE: ${{ inputs.expected_base }}
          LOCATOR_REVIEW: ${{ inputs.review_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = workflow_dispatch ]; then
            test "${TRIGGER_ACTOR}" = 'github-actions[bot]'
            test "${GITHUB_REF_PROTECTED}" = true
            [[ "${LOCATOR_PR}" =~ ^[1-9][0-9]*$ ]]
            [[ "${LOCATOR_REVIEW}" =~ ^[1-9][0-9]*$ ]]
            [[ "${LOCATOR_HEAD}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${LOCATOR_BASE}" =~ ^[0-9a-f]{40}$ ]]
            pr="$(gh api "repos/${REPOSITORY}/pulls/${LOCATOR_PR}")"
            jq -e --arg head "${LOCATOR_HEAD}" --arg base "${LOCATOR_BASE}" \
              --arg repo "${REPOSITORY}" --argjson number "${LOCATOR_PR}" '
                .number == $number and .state == "open" and .draft == false
                and .head.sha == $head and .base.sha == $base
                and (.head.repo.full_name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$")) and .base.repo.full_name == $repo
                and (.head.repo.full_name == $repo or .user.type == "User")
              ' <<<"${pr}" >/dev/null
            branch="$(jq -er .base.ref <<<"${pr}")"
            [[ "${branch}" =~ ^(develop|main)$ ]]
            test "${GITHUB_REF}" = "refs/heads/${branch}"
            test "${WORKFLOW_SHA}" = "${LOCATOR_BASE}"
            protected_base="$(gh api "repos/${REPOSITORY}/branches/${branch}")"
            jq -e --arg branch "${branch}" --arg source "${WORKFLOW_SHA}" '
              .name == $branch and .protected == true and .commit.sha == $source
              ' <<<"${protected_base}" >/dev/null
            review="$(gh api "repos/${REPOSITORY}/pulls/${LOCATOR_PR}/reviews/${LOCATOR_REVIEW}")"
            jq -e --arg head "${LOCATOR_HEAD}" --argjson id "${LOCATOR_REVIEW}" '
                .id == $id and .commit_id == $head
                and .user.login == "copilot-pull-request-reviewer[bot]"
                and (.state | ascii_downcase | IN("commented", "approved"))
              ' <<<"${review}" >/dev/null
            PR_NUMBER="${LOCATOR_PR}"
            HEAD_SHA="${LOCATOR_HEAD}"
            BASE_SHA="${LOCATOR_BASE}"
            HEAD_REPOSITORY="$(jq -er .head.repo.full_name <<<"${pr}")"
            HEAD_REF="$(jq -er .head.ref <<<"${pr}")"
            BASE_REF="$(jq -er .base.ref <<<"${pr}")"
            PR_AUTHOR="$(jq -er .user.login <<<"${pr}")"
            # Hydrate the locator exclusively from authoritative API reads. The
            # existing event/content/thread guards re-read it before mutation.
            TRIGGER_ACTOR='copilot-pull-request-reviewer[bot]'
            EVENT_NAME=pull_request_review
            GITHUB_EVENT_PATH="${RUNNER_TEMP}/reconciled-review.json"
            umask 077
            jq -n --argjson pr "${pr}" --argjson review "${review}" '
              {action:"submitted",pull_request:$pr,review:$review,sender:$review.user}
              ' >"${GITHUB_EVENT_PATH}"
          fi
          jq -e \
            --arg actor "${TRIGGER_ACTOR}" \
            --arg event "${EVENT_NAME}" \
            --arg repository "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" '
              type == "object"
              and (.pull_request | type) == "object"
              and .pull_request.draft == false
              and .pull_request.head.repo.full_name == $head_repository
              and .pull_request.base.repo.full_name == $repository
              and (
                if $event == "pull_request_review" then
                  (.review | type) == "object"
                  and (.review.user | type) == "object"
                  and (.sender | type) == "object"
                  and (
                    (.action == "dismissed"
                      and .sender.login == $actor
                      and (.review.author_association == "COLLABORATOR"
                        or .review.author_association == "MEMBER"
                        or .review.author_association == "OWNER"))
                    or ((.action == "submitted" or .action == "edited")
                      and (
                        (($actor == "Copilot"
                            or $actor == "copilot-pull-request-reviewer"
                            or $actor == "copilot-pull-request-reviewer[bot]")
                          and .review.user.login
                            == "copilot-pull-request-reviewer[bot]")
                        or ($actor == "litroc"
                          and .review.user.login == "litroc")
                        or ((.review.author_association == "COLLABORATOR"
                            or .review.author_association == "MEMBER"
                            or .review.author_association == "OWNER")
                          and .review.user.login == $actor)
                      ))
                  )
                elif $event == "pull_request_review_comment" then
                  (.comment | type) == "object"
                  and (.comment.user | type) == "object"
                  and (.sender | type) == "object"
                  and (
                    (.action == "deleted"
                      and .sender.login == $actor
                      and (.comment.author_association == "COLLABORATOR"
                        or .comment.author_association == "MEMBER"
                        or .comment.author_association == "OWNER"))
                    or ((.action == "created" or .action == "edited")
                      and (
                        (($actor == "Copilot"
                            or $actor == "copilot-pull-request-reviewer"
                            or $actor == "copilot-pull-request-reviewer[bot]")
                          and .comment.user.login
                            == "copilot-pull-request-reviewer[bot]")
                        or ($actor == "litroc"
                          and .comment.user.login == "litroc")
                        or ((.comment.author_association == "COLLABORATOR"
                            or .comment.author_association == "MEMBER"
                            or .comment.author_association == "OWNER")
                          and .comment.user.login == $actor)
                      ))
                  )
                else false
                end
              )
            ' "${GITHUB_EVENT_PATH}" >/dev/null
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          if [ "${PR_AUTHOR}" = "lightning-it-release-automation[bot]" ] \
            && [[ "${HEAD_REF}" != backmerge/*-main ]]; then
            echo 'Release-App review evidence is owned by its dedicated producer; Copilot refresh is not applicable.'
            exit 0
          fi
          [[ "${HEAD_REPOSITORY}" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ ]]
          export HEAD_REPOSITORY
          PRODUCER_OWNER_MODE=verification
          if [ "${PR_AUTHOR}" = litroc ] && [ "${HEAD_REPOSITORY}" = "${REPOSITORY}" ]; then
            PRODUCER_OWNER_MODE=copilot
          fi
          if { [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
              && [[ "${HEAD_REF}" =~ ^chore/sync-(shared-assets-lit|repository-quality)- ]]; } \
            || { [ "${PR_AUTHOR}" = "renovate[bot]" ] \
              && [[ "${HEAD_REF}" == renovate/* ]]; } \
            || { { [ "${PR_AUTHOR}" = "lightning-it-release-automation[bot]" ] \
                || [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ]; } \
              && [[ "${HEAD_REF}" == backmerge/*-main ]]; }; then
            test "${HEAD_REPOSITORY}" = "${REPOSITORY}"
            test "${BASE_REF}" = develop
            PRODUCER_OWNER_MODE=deterministic
          fi
          export PRODUCER_OWNER_MODE
          export EVENT_BASE="${BASE_SHA}"
          export LIVE_BASE="${BASE_SHA}"
          export EVENT_HEAD="${HEAD_SHA}"
          export EVENT_HEAD_REF="${HEAD_REF}"
          owner_guard="${RUNNER_TEMP}/current-revision-producer-owner.sh"
          umask 077
          cat >"${owner_guard}" <<'PRODUCER_OWNER_GUARD'
          oa() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo 'Producer-owner API read failed after five attempts.' >&2
                return 1
              fi
              sleep 2
            done
          }

          elect_once() {
            local ca cid cands crows
            local crj e fbase fhead
            local flive fpr frows
            local jpages ojp
            local cassoc pj pp rj rpages
            [[ "${PRODUCER_OWNER_MODE}" =~ ^(copilot|verification|deterministic)$ ]] || return 1
            rpages="$(oa --paginate --slurp "repos/${REPOSITORY}/actions/runs?event=pull_request_target&head_sha=${EVENT_HEAD}&per_page=100")" || return 1
            jq -e --arg h "${EVENT_HEAD}" \
              --arg repo "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" --argjson n "${PR_NUMBER}" '
              type == "array" and length > 0 and length <= 10
              and all(.[];
                type == "object"
                and (.workflow_runs | type) == "array")
              and all(.[].workflow_runs[]?;
                . as $r
                | type == "object"
                and (.id | type) == "number" and .id > 0
                and .id == (.id | floor)
                and (.run_attempt | type) == "number" and .run_attempt > 0
                and .run_attempt == (.run_attempt | floor)
                and (.status | type) == "string"
                and (((.status | IN("requested", "waiting", "pending", "queued", "in_progress"))
                      and .conclusion == null)
                  or (.status == "completed" and (.conclusion | IN("success", "failure",
                    "neutral", "cancelled", "timed_out", "action_required", "stale",
                    "startup_failure", "skipped"))))
                and (.event | type) == "string" and (.event | length) > 0
                and (.path | type) == "string" and (.path | length) > 0
                and (.name | type) == "string" and (.name | length) > 0
                and (.head_branch | type) == "string"
                and (.head_branch | length) > 0
                and (.head_sha | type) == "string"
                and (.head_sha | test("^[0-9a-f]{40}$"))
                and (.repository | type) == "object"
                and (.repository.full_name | type) == "string"
                and (.repository.full_name | length) > 0
                and (.head_repository | type) == "object"
                and (.head_repository.full_name | type) == "string"
                and (.head_repository.full_name | length) > 0
                and (.pull_requests | type) == "array"
                and (.pull_requests | length) <= 10
                and all(.pull_requests[];
                  type == "object"
                  and (.number | type) == "number" and .number > 0
                  and .number == (.number | floor)
                  and (.base | type) == "object"
                  and (.base.sha | type) == "string"
                  and (.base.sha | test("^[0-9a-f]{40}$"))
                  and (.head | type) == "object"
                  and (.head.sha | type) == "string"
                  and (.head.sha | test("^[0-9a-f]{40}$"))
                  and .head.sha == $r.head_sha
                  and (.head.ref | type) == "string"
                  and (.head.ref | length) > 0
                  and .head.ref == $r.head_branch)
                and (if .event == "pull_request_target"
                    and .path == ".github/workflows/copilot-review.yml"
                    and .name == "Current revision review gate"
                    and .head_sha == $h
                    and .repository.full_name == $repo
                    and .head_repository.full_name == $head_repository
                  then (.pull_requests | length) <= 1
                    and all(.pull_requests[]; .head.repo.url == ("https://api.github.com/repos/" + $head_repository)
                      and .base.repo.url == ("https://api.github.com/repos/" + $repo))
                  else true end))
              and ([.[].workflow_runs[].id] | length)
                == ([.[].workflow_runs[].id] | unique | length)
              ' <<<"${rpages}" >/dev/null || return 1
            frows="$(jq -cer --arg h "${EVENT_HEAD}" --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" --argjson n "${PR_NUMBER}" '
                [.[].workflow_runs[]
                  | select(.event == "pull_request_target")
                  | select(.path == ".github/workflows/copilot-review.yml")
                  | select(.name == "Current revision review gate")
                  | select(.head_sha == $h)
                  | select(.head_branch == $ref)
                  | select(.repository.full_name == $repo)
                  | select(.head_repository.full_name == $head_repository)
                  | select((.pull_requests | length) == 1)
                  | .pull_requests[0]
                  | select(.number != $n)
                  | [.number, .base.sha, .head.sha]]
                | unique
                | if length > 10 then error("foreign-pr-inventory-unbounded")
                  else map(@tsv) | join("\n") end
              ' <<<"${rpages}")" || return 1
            while IFS=$'\t' read -r fpr fbase fhead; do
              [ -n "${fpr}" ] || continue
              flive="$(oa "repos/${REPOSITORY}/pulls/${fpr}")" || return 1
              jq -e --arg b "${fbase}" --arg h "${fhead}" --arg repo "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" --argjson n "${fpr}" '
                  .number == $n
                  and .base.sha == $b
                  and .base.repo.full_name == $repo
                  and .head.sha == $h
                  and .head.repo.full_name == $head_repository
                and ($head_repository == $repo or .user.type == "User")
                ' <<<"${flive}" >/dev/null || return 1
            done <<<"${frows}"
            if jq -e --arg h "${EVENT_HEAD}" \
              --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" '
                any(.[].workflow_runs[]?;
                  .event == "pull_request_target"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_sha == $h
                  and .head_branch == $ref
                  and .repository.full_name == $repo
                  and .head_repository.full_name == $head_repository
                  and .pull_requests == [])
              ' <<<"${rpages}" >/dev/null; then
              pp="$(oa --method GET --paginate --slurp \
                -f state=open -f "head=${HEAD_REPOSITORY%%/*}:${EVENT_HEAD_REF}" \
                -F per_page=100 "repos/${REPOSITORY}/pulls")" || return 1
              jq -e --arg b "${LIVE_BASE}" --arg h "${EVENT_HEAD}" \
                --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" \
                --argjson n "${PR_NUMBER}" '
                  type == "array" and length > 0 and length <= 10
                  and all(.[]; type == "array")
                  and ([.[][]] | length) == 1
                  and .[0][0].number == $n
                  and .[0][0].state == "open"
                  and .[0][0].base.sha == $b
                  and .[0][0].base.repo.full_name == $repo
                  and .[0][0].head.ref == $ref
                  and .[0][0].head.sha == $h
                  and .[0][0].head.repo.full_name == $head_repository
                ' <<<"${pp}" >/dev/null || return 1
            fi
            cands="$(jq -ce --arg b "${EVENT_BASE}" --arg h "${EVENT_HEAD}" --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" --argjson n "${PR_NUMBER}" '
                [.[].workflow_runs[] |
                  select(.event == "pull_request_target") |
                  select(.path == ".github/workflows/copilot-review.yml") |
                  select(.name == "Current revision review gate") |
                  select(.head_sha == $h) |
                  select(.repository.full_name == $repo) |
                  select(.head_repository.full_name == $head_repository) |
                  select(any(.pull_requests[]?;
                    .number == $n
                    and .base.sha == $b
                    and .head.sha == $h)
                    or (.pull_requests == [] and .head_branch == $ref))]
                | if length == 0 then error("producer-owner-missing")
                  elif length > 20 then error("producer-owner-overflow")
                  elif ([.[].id] | unique | length) != length
                    then error("producer-owner-run-duplicate")
                  else sort_by(.id) end
              ' <<<"${rpages}")" || return 1
            e='[]'
            crows="$(jq -er '.[] | [.id, .run_attempt, .status, (.pull_requests | length)] | @tsv' <<<"${cands}")" || return 1
            while IFS=$'\t' read -r cid ca cstate cassoc; do
              [[ "${cid}" =~ ^[1-9][0-9]*$ ]] || return 1
              [[ "${ca}" =~ ^(1|2)$ ]] || return 1
              [[ "${cstate}" =~ ^(requested|waiting|pending|queued|in_progress|completed)$ ]] || return 1
              jpages="$(oa --paginate --slurp "repos/${REPOSITORY}/actions/runs/${cid}/attempts/${ca}/jobs?filter=all&per_page=100")" || return 1
              jq -e --arg h "${EVENT_HEAD}" --argjson a "${ca}" --argjson rid "${cid}" '
                type == "array" and length > 0 and length <= 10
                and all(.[]; type == "object" and (.jobs | type) == "array")
                and ([.[].jobs[].id] | length) == ([.[].jobs[].id] | unique | length)
                and all(.[].jobs[]?; type=="object" and (.id|type)=="number" and .id>0
                  and (.name|type)=="string" and .run_id==$rid and .run_attempt==$a and .head_sha==$h and (.status|type)=="string" and has("conclusion"))
                ' <<<"${jpages}" >/dev/null || return 1
              pj="$(jq -ce --arg h "${EVENT_HEAD}" --argjson a "${ca}" --argjson rid "${cid}" '
                  [.[].jobs[] |
                    select(.name == "Verify current revision policy") |
                    select(.run_id == $rid) |
                    select(.run_attempt == $a) |
                    select(.head_sha == $h)]
                  | if length > 1 then error("producer-owner-job-duplicate")
                    else . end
                ' <<<"${jpages}")" || return 1
              if [ "$(jq 'length' <<<"${pj}")" -eq 0 ]; then
                if [[ "${cstate}" =~ ^(requested|waiting|pending|queued)$ ]] &&
                  jq -e 'all(.[].jobs; length == 0)' <<<"${jpages}" >/dev/null &&
                  [ "$(jq 'length' <<<"${e}")" -gt 0 ]; then
                  continue
                fi
                return 1
              fi
              jq -e '
                .[0] as $job
                | (($job.status | IN(
                    "requested", "waiting", "pending", "queued", "in_progress"))
                    and $job.conclusion == null)
                  or ($job.status == "completed"
                    and ($job.conclusion | IN(
                      "success", "failure", "neutral", "cancelled",
                      "timed_out", "action_required", "stale",
                      "startup_failure", "skipped")))
                ' <<<"${pj}" >/dev/null || return 1
              if jq -e '
                  .[0].status == "completed"
                  and .[0].conclusion == "skipped"
                  ' <<<"${pj}" >/dev/null; then
                continue
              fi
              if [ "${cassoc}" -eq 0 ]; then
                jq -e --arg binding "Event binding #${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}:${cid}" '
                    (.[0].steps | type) == "array"
                    and all(.[0].steps[]; (.name | type) == "string")
                    and ([.[0].steps[] | select(.name == $binding)] | length) == 1
                  ' <<<"${pj}" >/dev/null || continue
              fi
              if [ "${PRODUCER_OWNER_MODE}" = copilot ]; then
                crj="$(jq -ce --arg h "${EVENT_HEAD}" --argjson a "${ca}" --argjson rid "${cid}" '
                    [.[].jobs[] |
                      select(.name == "Request Copilot review for current revision") |
                      select(.run_id == $rid) |
                      select(.run_attempt == $a) |
                      select(.head_sha == $h)]
                    | if length > 1 then error("producer-owner-requester-duplicate")
                      else . end
                  ' <<<"${jpages}")" || return 1
                if [ "$(jq 'length' <<<"${crj}")" -eq 0 ]; then
                  return 1
                fi
                jq -e '
                  .[0] as $job
                  | (($job.status | IN(
                      "requested", "waiting", "pending", "queued", "in_progress"))
                      and $job.conclusion == null)
                    or ($job.status == "completed"
                      and ($job.conclusion | IN(
                        "success", "failure", "neutral", "cancelled",
                        "timed_out", "action_required", "stale",
                        "startup_failure", "skipped")))
                  ' <<<"${crj}" >/dev/null || return 1
                if [ "${ca}" -eq 1 ]; then
                  ojp="${jpages}"
                else
                  ojp="$(oa --paginate --slurp "repos/${REPOSITORY}/actions/runs/${cid}/attempts/1/jobs?filter=all&per_page=100")" || return 1
                  jq -e --arg h "${EVENT_HEAD}" --argjson rid "${cid}" '
                    type == "array" and length > 0 and length <= 10
                    and all(.[]; type == "object" and (.jobs | type) == "array")
                    and ([.[].jobs[].id] | length) == ([.[].jobs[].id] | unique | length)
                    and all(.[].jobs[]?; type=="object" and (.id|type)=="number" and .id>0
                      and (.name|type)=="string" and .run_id==$rid and .run_attempt==1 and .head_sha==$h and (.status|type)=="string" and has("conclusion"))
                    ' <<<"${ojp}" >/dev/null || return 1
                fi
                rj="$(jq -ce --arg h "${EVENT_HEAD}" --argjson rid "${cid}" '
                    [.[].jobs[] |
                      select(.name == "Request Copilot review for current revision") |
                      select(.run_id == $rid) |
                      select(.run_attempt == 1) |
                      select(.head_sha == $h)]
                    | if length > 1 then error("producer-owner-original-requester-duplicate")
                      else . end
                  ' <<<"${ojp}")" || return 1
                if [ "$(jq 'length' <<<"${rj}")" -eq 0 ]; then
                  return 1
                fi
                jq -e '
                  .[0] as $job
                  | (($job.status | IN(
                      "requested", "waiting", "pending", "queued", "in_progress"))
                      and $job.conclusion == null)
                    or ($job.status == "completed"
                      and ($job.conclusion | IN(
                        "success", "failure", "neutral", "cancelled",
                        "timed_out", "action_required", "stale",
                        "startup_failure", "skipped")))
                  ' <<<"${rj}" >/dev/null || return 1
                if jq -e '
                    .[0].status == "completed"
                    and .[0].conclusion == "skipped"
                    ' <<<"${rj}" >/dev/null; then
                  continue
                fi
              fi
              e="$(jq -cn --argjson current "${e}" --argjson id "${cid}" --argjson a "${ca}" '$current + [{id:$id,run_attempt:$a}]')" || return 1
            done <<<"${crows}"
            jq -er '
              if length == 0 then error("producer-owner-e-missing")
              elif ([.[].id] | unique | length) != length
                then error("producer-owner-e-duplicate")
              else min_by(.id).id end
              ' <<<"${e}" || return 1
          }

          eo() {
            local first second
            first="$(elect_once)" || return 1
            sleep 2
            second="$(elect_once)" || return 1
            if [ "${first}" != "${second}" ]; then
              echo 'Producer-owner inventory changed between stable reads.' >&2
              return 1
            fi
            printf '%s' "${first}"
          }
          PRODUCER_OWNER_GUARD
          # shellcheck source=/dev/null
          source "${owner_guard}"
          validate_live_pr_tuple() {
            test "${GITHUB_REF}" = "refs/heads/${BASE_REF}" || return 1
            test "${WORKFLOW_SHA}" = "${BASE_SHA}" || return 1
            local live_pr live_controller
            live_controller="$(oa "repos/${REPOSITORY}/branches/${BASE_REF}")" || return 1
            jq -e --arg branch "${BASE_REF}" --arg source "${WORKFLOW_SHA}" '
              .name == $branch and .protected == true and .commit.sha == $source
              ' <<<"${live_controller}" >/dev/null || return 1
            live_pr="$(oa \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" || return 1
            jq -e \
              --arg author "${PR_AUTHOR}" --argjson number "${PR_NUMBER}" \
              --arg base_ref "${BASE_REF}" \
              --arg base_sha "${BASE_SHA}" \
              --arg head_ref "${HEAD_REF}" \
              --arg head_sha "${HEAD_SHA}" \
              --arg repository "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" '
                .number == $number and .state == "open"
                and .draft == false
                and .user.login == $author
                and .base.ref == $base_ref
                and .base.sha == $base_sha
                and .base.repo.full_name == $repository
                and .head.ref == $head_ref
                and .head.sha == $head_sha
                and .head.repo.full_name == $head_repository
                and ($head_repository == $repository or .user.type == "User")
              ' <<<"${live_pr}" >/dev/null
          }
          validate_live_pr_tuple
          owner_run_id=''
          for owner_attempt in $(seq 1 10); do
            if owner_run_id="$(eo)"; then
              break
            fi
            if [ "${owner_attempt}" -eq 10 ]; then
              echo 'No stable canonical producer owner became visible.' >&2
              exit 1
            fi
            sleep 6
          done
          [[ "${owner_run_id}" =~ ^[1-9][0-9]*$ ]]
          evidence_owner_run_id="${owner_run_id}"
          owner_pr_number="${PR_NUMBER}"
          current_external_kind=copilot
          if [ "${PR_AUTHOR}" = "renovate[bot]" ] \
            && [[ "${HEAD_REF}" == renovate/* ]]; then
            current_external_kind=renovate
          elif [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
            && [[ "${HEAD_REF}" =~ ^chore/sync-(shared-assets-lit|repository-quality)- ]]; then
            current_external_kind=managed-sync
          elif { [ "${PR_AUTHOR}" = "lightning-it-release-automation[bot]" ] \
              || [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ]; } \
            && [[ "${HEAD_REF}" == backmerge/*-main ]]; then
            current_external_kind=ancestry-backmerge
          fi
          current_external_id="mlx90-current-revision:${current_external_kind}:v6:${PR_NUMBER}:${owner_run_id}:${BASE_SHA}:${HEAD_SHA}"
          revalidate_refresh_owner() {
            local live_owner
            live_owner="$(eo)" || return 1
            test "${live_owner}" = "${owner_run_id}"
          }
          read_refresh_checks() {
            local pages
            pages="$(oa --paginate --slurp \
              "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")" \
              || return 1
            jq -e '
              type == "array" and length > 0 and length <= 10
              and all(.[]; type == "object" and (.check_runs | type) == "array")
              and all(.[].check_runs[]?;
                type == "object"
                and (.id | type) == "number" and .id > 0 and .id == (.id | floor)
                and (.name | type) == "string"
                and (.app | type) == "object"
                and (.app.id | type) == "number" and .app.id > 0
                and (.app.slug | type) == "string" and (.app.slug | length) > 0
                and (.head_sha | type) == "string"
                and (.head_sha | test("^[0-9a-f]{40}$")))
              ' <<<"${pages}" >/dev/null || return 1
            jq -ce --arg head "${HEAD_SHA}" '
            [.[].check_runs[]? |
              select(.name == "Current revision review") |
              select(.app.id == 15368 and .app.slug == "github-actions") |
              select(.head_sha == $head)]
            | select(length <= 20)
            | select(([.[].id] | length) == ([.[].id] | unique | length))
            | select(all(.[];
                (.external_id | type) == "string" and (.external_id | length) > 0
                and (.details_url | type) == "string" and (.details_url | length) > 0
                and (.status | type) == "string"
                and (((.status | IN("requested", "waiting", "pending", "queued", "in_progress"))
                      and .conclusion == null and .completed_at == null)
                  or (.status == "completed"
                    and (.conclusion | IN("success", "failure", "neutral", "cancelled",
                      "timed_out", "action_required", "stale", "startup_failure", "skipped"))
                    and (.completed_at | type) == "string"))
                and (.output | type) == "object"
                and ((.output.title | type) | IN("string", "null"))
                and ((.output.summary | type) | IN("string", "null"))))
            | sort_by(.id)
            ' <<<"${pages}" || return 1
          }
          revalidate_refresh_state() {
            local expected_count="$1" expected_snapshot="${2:-}"
            local fresh live_owner_after live_owner_before
            [[ "${expected_count}" =~ ^([0-9]|1[0-9]|20)$ ]] || return 1
            validate_live_pr_tuple || return 1
            live_owner_before="$(eo)" || return 1
            test "${live_owner_before}" = "${owner_run_id}" || return 1
            fresh="$(read_refresh_checks)" || return 1
            test "$(jq 'length' <<<"${fresh}")" -eq "${expected_count}" \
              || return 1
            if [ "${expected_count}" -gt 0 ]; then
              jq -e --argjson expected "${expected_snapshot}" '
                sort_by(.id) as $live
                | ($expected | sort_by(.id)) as $want
                | ($live | length) == ($want | length)
                and all(range(0; $live | length);
                  $live[.].id == $want[.].id
                  and $live[.].name == $want[.].name
                  and $live[.].app.id == $want[.].app.id
                  and $live[.].app.slug == $want[.].app.slug
                  and $live[.].head_sha == $want[.].head_sha
                  and $live[.].external_id == $want[.].external_id
                  and $live[.].status == $want[.].status
                  and $live[.].conclusion == $want[.].conclusion
                  and $live[.].details_url == $want[.].details_url
                  and $live[.].completed_at == $want[.].completed_at
                  and $live[.].output.title == $want[.].output.title
                  and $live[.].output.summary == $want[.].output.summary)
                ' <<<"${fresh}" >/dev/null || return 1
            fi
            live_owner_after="$(eo)" || return 1
            test "${live_owner_after}" = "${owner_run_id}" || return 1
            validate_live_pr_tuple
          }
          assert_refresh_rerun_budget() {
            local run="$1"
            jq -e \
              --argjson owner_run_id "${owner_run_id}" '
                .id == $owner_run_id
                and .status == "completed"
                and .run_attempt == 1
              ' <<<"${run}" >/dev/null
          }
          validate_refresh_owner_run() {
            local run="$1" expected_owner="${2:-${owner_run_id}}" expected_pr="${3:-${owner_pr_number:-${PR_NUMBER}}}"
            jq -e \
              --arg base "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --arg head_ref "${HEAD_REF}" \
              --arg repository "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" \
              --argjson owner_run_id "${expected_owner}" \
              --argjson pr "${expected_pr}" '
                . as $run
                | .id == $owner_run_id
                and .event == "pull_request_target"
                and .path == ".github/workflows/copilot-review.yml"
                and .name == "Current revision review gate"
                and (.run_attempt == 1 or .run_attempt == 2)
                and (.head_branch | type) == "string"
                and (.head_branch | length) > 0
                and .head_sha == $head
                and .repository.full_name == $repository
                and .head_repository.full_name == $head_repository
                and (any(.pull_requests[]?;
                  .number == $pr
                  and .base.sha == $base
                  and .head.sha == $head
                  and (.head.ref | type) == "string"
                  and (.head.ref | length) > 0
                  and .head.ref == $run.head_branch
                  and .head.repo.url == ("https://api.github.com/repos/" + $head_repository)
                  and .base.repo.url == ("https://api.github.com/repos/" + $repository))
                  or (.pull_requests == [] and .head_branch == $head_ref))
              ' <<<"${run}" >/dev/null
          }
          refresh_event_record_state() {
            local action event id key live
            action="$(jq -er '.action | select(type == "string")' \
              "${GITHUB_EVENT_PATH}")" || return 1
            case "${EVENT_NAME}" in
              pull_request_review) key=review ;;
              pull_request_review_comment) key=comment ;;
              *) return 1 ;;
            esac
            event="$(jq -ce --arg key "${key}" '.[$key] | select(type == "object")' \
              "${GITHUB_EVENT_PATH}")" || return 1
            id="$(jq -er '.id | select(type == "number" and . > 0 and . == floor)' \
              <<<"${event}")" || return 1
            jq -e --arg api "${GITHUB_API_URL}" --arg head "${HEAD_SHA}" \
              --arg repository "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" --argjson pr "${PR_NUMBER}" '
                .commit_id == $head and (.user.login | type) == "string"
                and (.author_association | type) == "string"
                and .pull_request_url == ($api + "/repos/" + $repository + "/pulls/" + ($pr | tostring))
              ' <<<"${event}" >/dev/null || return 1
            if [ "${EVENT_NAME}" = pull_request_review_comment ]; then
              jq -e '(.body | type) == "string"' <<<"${event}" >/dev/null || return 1
              if [ "${action}" = deleted ]; then
                live="$(read_refresh_review_state threads)" || return 1
                jq -e 'all(.[].comments.pageInfo.hasNextPage; . == false)' \
                  <<<"${live}" >/dev/null || return 1
                if jq -e --argjson id "${id}" \
                  'any(.[].comments.nodes[]?; .databaseId == $id)' \
                  <<<"${live}" >/dev/null; then printf superseded; else printf current; fi
                return 0
              fi
              [[ "${action}" =~ ^(created|edited)$ ]] || return 1
              live="$(oa \
                "repos/${REPOSITORY}/pulls/comments/${id}")" || return 1
              if jq -e --argjson event "${event}" --argjson id "${id}" '
                .id == $id and .user.login == $event.user.login
                and .author_association == $event.author_association
                and .commit_id == $event.commit_id and .body == $event.body
                and .path == $event.path and .created_at == $event.created_at
                and .updated_at == $event.updated_at
                and .pull_request_url == $event.pull_request_url
                ' <<<"${live}" >/dev/null; then printf current; else printf superseded; fi
              return 0
            fi
            live="$(oa \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${id}")" \
              || return 1
            if jq -e --arg action "${action}" --arg head "${HEAD_SHA}" \
              --argjson event "${event}" --argjson id "${id}" '
                .id == $id
                and .user.login == $event.user.login and .author_association == $event.author_association
                and .commit_id == $head and .commit_id == $event.commit_id
                and (.body // "") == ($event.body // "")
                and ((.state | ascii_downcase) == (($event.state // "") | ascii_downcase))
                and .submitted_at == $event.submitted_at
                and .pull_request_url == $event.pull_request_url
                and (if $action == "dismissed" then (.state | ascii_downcase) == "dismissed"
                  else (($action | IN("submitted", "edited")) and
                    ((.state | ascii_downcase) | IN("commented", "approved", "changes_requested"))) end)
              ' <<<"${live}" >/dev/null; then
              printf current
            else
              printf superseded
            fi
          }
          read_refresh_review_state() {
            local after='' cursors='[]' event_state event_state_after has_next
            local mode="${1:-state}" name owner page query thread_page threads='[]'; local -a arguments
            [[ "${mode}" =~ ^(state|threads)$ ]] || return 1
            if [ "${mode}" = state ]; then
              validate_live_pr_tuple || return 1
              event_state="$(refresh_event_record_state)" || return 1
              [[ "${event_state}" =~ ^(current|superseded)$ ]] || return 1
            fi
            read -r owner name <<<"${REPOSITORY//\// }"
            # shellcheck disable=SC2016  # GraphQL variables stay literal.
            query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid reviewThreads(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{id isResolved comments(first:100){pageInfo{hasNextPage} nodes{databaseId author{login} pullRequestReview{commit{oid}}}}}}}}}'
            for thread_page in $(seq 1 10); do
              arguments=(-f query="${query}" -F owner="${owner}" -F name="${name}"
                -F number="${PR_NUMBER}")
              [ -z "${after}" ] || arguments+=(-f after="${after}")
              page="$(oa graphql "${arguments[@]}")" || return 1
              jq -e --arg head "${HEAD_SHA}" '
                select(((.errors // []) | type) == "array" and ((.errors // []) | length) == 0)
                | .data.repository.pullRequest as $pr
                | $pr.reviewThreads as $threads
                | ($pr | type) == "object" and $pr.headRefOid == $head
                and ($threads | type) == "object" and ($threads.nodes | type) == "array"
                and ($threads.pageInfo.hasNextPage | type) == "boolean"
                and all($threads.nodes[]?; (.id | type) == "string" and (.id | length) > 0
                  and (.isResolved | type) == "boolean" and (.comments | type) == "object"
                  and (.comments.nodes | type) == "array"
                  and (.comments.pageInfo.hasNextPage | type) == "boolean"
                  and all(.comments.nodes[]?; (.databaseId | type) == "number"
                    and .databaseId > 0 and .databaseId == (.databaseId | floor)
                    and (.author.login | type) == "string"
                    and (.pullRequestReview.commit.oid | test("^[0-9a-f]{40}$"))))
                ' <<<"${page}" >/dev/null || return 1
              threads="$(jq -ce --argjson prior "${threads}" '$prior +
                .data.repository.pullRequest.reviewThreads.nodes |
                select(([.[].id]|length) == ([.[].id]|unique|length)) |
                select(([.[].comments.nodes[].databaseId]|length) ==
                  ([.[].comments.nodes[].databaseId]|unique|length))' <<<"${page}")" || return 1
              has_next="$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage|tostring' <<<"${page}")" || return 1
              [ "${has_next}" = true ] || break
              [ "${thread_page}" -lt 10 ] || return 1
              after="$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor|
                select(type == "string" and length > 0)' <<<"${page}")" || return 1
              cursors="$(jq -ce --arg c "${after}" 'select(index($c)|not)+[$c]' \
                <<<"${cursors}")" || return 1
            done
            [ "${has_next}" = false ] || return 1
            if [ "${mode}" = threads ]; then printf '%s' "${threads}"; return 0; fi
            validate_live_pr_tuple || return 1
            event_state_after="$(refresh_event_record_state)" || return 1
            [[ "${event_state_after}" =~ ^(current|superseded)$ ]] || return 1
            [ "${event_state}" = current ] && [ "${event_state_after}" = current ] || event_state=superseded
            jq -cn --arg event_state "${event_state}" --arg head "${HEAD_SHA}" \
              --argjson threads "${threads}" '
                {event_current:($event_state == "current"),
                  incomplete:([$threads[] | select(.isResolved == false and
                    .comments.pageInfo.hasNextPage)] | length),
                  unresolved:([$threads[] | select(.isResolved == false)
                    | select(any(.comments.nodes[];
                      (.author.login | IN("copilot-pull-request-reviewer",
                        "copilot-pull-request-reviewer[bot]"))
                      and .pullRequestReview.commit.oid == $head))] | length)}'
          }
          vh() {
            local check_json="$1" expected_url="$2"
            local b pb po vo
            b="$(jq -cer \
              --arg author "${PR_AUTHOR}" \
              --arg current_base "${BASE_SHA}" \
              --arg current_kind "${current_external_kind}" \
              --arg head "${HEAD_SHA}" \
              --arg url "${expected_url}" \
              --argjson pr "${PR_NUMBER}" '
                .[0] as $check
                | ($check.output.summary | fromjson) as $summary
                | ($check.external_id |
                    if test("^mlx90-current-revision:(copilot|managed-sync|ancestry-backmerge|renovate):v6:[1-9][0-9]*:[1-9][0-9]*:[0-9a-f]{40}:[0-9a-f]{40}$")
                    then capture("^mlx90-current-revision:(?<kind>copilot|managed-sync|ancestry-backmerge|renovate):v6:(?<pr>[1-9][0-9]*):(?<owner>[1-9][0-9]*):(?<base>[0-9a-f]{40}):(?<head>[0-9a-f]{40})$")
                      | {version:"v6",kind:.kind,pr:(.pr|tonumber),
                          owner:(.owner|tonumber),base:.base,head:.head}
                    elif test("^mlx90-current-revision:(copilot|ancestry-backmerge):v5:[1-9][0-9]*:[0-9a-f]{40}:[0-9a-f]{40}$")
                    then capture("^mlx90-current-revision:(?<kind>copilot|ancestry-backmerge):v5:(?<owner>[1-9][0-9]*):(?<base>[0-9a-f]{40}):(?<head>[0-9a-f]{40})$")
                      | {version:"v5",kind:.kind,pr:null,
                          owner:(.owner|tonumber),base:.base,head:.head}
                    else error("previous-tuple-external-id") end
                  ) as $b
                | select($check.status == "completed")
                | select($check.conclusion == "success"
                    or ($check.conclusion == "failure"
                      and $b.version == "v6"
                      and $check.output.title == "Current revision review invalidated"
                      and $summary.invalidated_check_run_id == $check.id
                      and $summary.reason == "canonical refresh invalidation"
                      and ($summary | keys | sort) == ["base_sha","head_sha",
                        "invalidated_check_run_id","producer_run_id","reason","schema"]))
                | select(($check.completed_at | type) == "string")
                | select($check.details_url == $url)
                | select($b.kind == $current_kind)
                | select($b.base != $current_base)
                | select($b.head == $head)
                | select($b.version == "v5" or $b.pr == $pr)
                | select($summary.schema == 4)
                | select($summary.base_sha == $b.base)
                | select($summary.head_sha == $b.head)
                | select($summary.producer_run_id == $b.owner)
                | select(
                    if $check.conclusion == "failure" then true
                    elif $b.version == "v6" then
                      $summary.pull_request_number == $pr
                    else
                      (($summary | has("pull_request_number")) | not)
                      or $summary.pull_request_number == $pr
                    end)
                | select(
                    if $b.kind == "copilot" then
                      ($author != "lightning-it-release-automation[bot]"
                        and $author != "lightning-it-shared-assets-sync[bot]"
                        and $author != "renovate[bot]"
                        and ($check.conclusion == "failure" or $summary.review_path
                          == "applicable Copilot or governed automation exemption"))
                    elif $b.kind == "managed-sync" then
                      ($author == "lightning-it-shared-assets-sync[bot]"
                        and ($check.conclusion == "failure" or $summary.review_path
                          == "deterministic provenance-bound managed distribution exemption"))
                    elif $b.kind == "renovate" then
                      ($author == "renovate[bot]"
                        and ($check.conclusion == "failure" or $summary.review_path
                          == "deterministic policy-bound Renovate exemption"))
                    else
                      (($author == "lightning-it-release-automation[bot]"
                          or $author == "lightning-it-shared-assets-sync[bot]")
                        and ($check.conclusion == "failure" or $summary.review_path
                          == "deterministic evidence-bound ancestry exemption"))
                    end)
                | $b
              ' <<<"${check_json}")" || return 1
            pb="$(jq -er '.base' <<<"${b}")" || return 1
            po="$(jq -er '.owner' <<<"${b}")" || return 1
            [[ "${pb}" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "${po}" =~ ^[1-9][0-9]*$ ]] || return 1
            vo="$(EVENT_BASE="${pb}" \
              eo)" || return 1
            test "${vo}" = "${po}"
          }

          read_evidence_owner_pr() {
            oa "repos/${REPOSITORY}/pulls/${1}"
          }

          va() {
            local check_json="$1" owner_payload parsed evidence_owner
            parsed="$(jq -cer \
              --arg author "${PR_AUTHOR}" \
              --arg base "${BASE_SHA}" \
              --arg current_kind "${current_external_kind}" \
              --arg head "${HEAD_SHA}" \
              --argjson current_pr "${PR_NUMBER}" \
              --argjson owner_run_id "${owner_run_id}" '
                .[0] as $check
                | ($check.output.summary | fromjson) as $summary
                | ($check.external_id |
                    if test("^mlx90-current-revision:copilot:v6:[1-9][0-9]*:[1-9][0-9]*:"
                      + $base + ":" + $head + "$")
                    then capture("^mlx90-current-revision:(?<kind>copilot):v6:(?<pr>[1-9][0-9]*):(?<owner>[1-9][0-9]*):(?<base>[0-9a-f]{40}):(?<head>[0-9a-f]{40})$")
                      | {version:"v6",kind:.kind,pr:(.pr|tonumber),
                          owner:(.owner|tonumber),base:.base,head:.head}
                    elif test("^mlx90-current-revision:(managed-sync|ancestry-backmerge|renovate):v6:"
                      + ($current_pr|tostring) + ":[1-9][0-9]*:" + $base + ":" + $head + "$")
                    then capture("^mlx90-current-revision:(?<kind>managed-sync|ancestry-backmerge|renovate):v6:(?<pr>[1-9][0-9]*):(?<owner>[1-9][0-9]*):(?<base>[0-9a-f]{40}):(?<head>[0-9a-f]{40})$")
                      | {version:"v6",kind:.kind,pr:(.pr|tonumber),
                          owner:(.owner|tonumber),base:.base,head:.head}
                    elif test("^mlx90-current-revision:(copilot|ancestry-backmerge):v5:[1-9][0-9]*:"
                      + $base + ":" + $head + "$")
                    then capture("^mlx90-current-revision:(?<kind>copilot|ancestry-backmerge):v5:(?<owner>[1-9][0-9]*):(?<base>[0-9a-f]{40}):(?<head>[0-9a-f]{40})$")
                      | {version:"v5",kind:.kind,pr:$current_pr,
                          owner:(.owner|tonumber),base:.base,head:.head}
                    elif ($current_kind == "ancestry-backmerge"
                      and $author == "lightning-it-release-automation[bot]"
                      and test("^mlx90-current-revision:v4:"
                        + ($owner_run_id|tostring) + ":[0-9a-f]{64}$"))
                    then {version:"v4",kind:"ancestry-backmerge",pr:$current_pr,
                      owner:$owner_run_id,base:$base,head:$head}
                    else error("current-tuple-external-id") end
                  ) as $binding
                | select($binding.kind == $current_kind)
                | select($binding.owner == $owner_run_id
                    or ($binding.version == "v6" and $binding.kind == "copilot"
                      and $binding.pr != $current_pr))
                | select($binding.base == $base and $binding.head == $head)
                | select($summary.schema == 4)
                | select($summary.base_sha == $base)
                | select($summary.head_sha == $head)
                | select($summary.producer_run_id == $binding.owner)
                | select(
                    if $binding.version == "v6" then
                      $summary.pull_request_number == $binding.pr
                    else
                      (($summary | has("pull_request_number")) | not)
                      or $summary.pull_request_number == $binding.pr
                    end)
                | $binding
              ' <<<"${check_json}")" || return 1
            evidence_owner_run_id="$(jq -er '.owner' <<<"${parsed}")" || return 1
            owner_pr_number="$(jq -er '.pr' <<<"${parsed}")" || return 1
            [[ "${owner_pr_number}" =~ ^[1-9][0-9]*$ ]] || return 1
            owner_payload="$(read_evidence_owner_pr \
              "${owner_pr_number}")" || return 1
            jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${BASE_SHA}" \
              --arg base_ref "${BASE_REF}" \
              --arg head "${HEAD_SHA}" \
              --arg head_ref "${HEAD_REF}" \
              --arg repository "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" \
              --argjson current_pr "${PR_NUMBER}" \
              --argjson owner_pr "${owner_pr_number}" '
                .number == $owner_pr
                and .draft == false
                and .user.login == $author
                and .base.ref == $base_ref
                and .base.sha == $base
                and .base.repo.full_name == $repository
                and .head.ref == $head_ref
                and .head.sha == $head
                and .head.repo.full_name == $head_repository
                and ($head_repository == $repository or .user.type == "User")
                and (
                  if $owner_pr == $current_pr then
                    .state == "open"
                  else
                    .state == "closed" and .merged_at == null
                  end
                )
              ' <<<"${owner_payload}" >/dev/null || return 1
            if [ "${evidence_owner_run_id}" != "${owner_run_id}" ]; then
              evidence_owner="$(oa "repos/${REPOSITORY}/actions/runs/${evidence_owner_run_id}")" || return 1
              validate_refresh_owner_run "${evidence_owner}" "${evidence_owner_run_id}" "${owner_pr_number}" || return 1
            fi
          }
          neutral="$(read_refresh_checks)"
          review_state="$(read_refresh_review_state)"
          if ! jq -e '.event_current == true' <<<"${review_state}" >/dev/null; then
            echo 'Queued refresh event was superseded while awaiting the mutation lane; no action is permitted.'
            exit 0
          fi
          neutral_count="$(jq 'length' <<<"${neutral}")"
          refresh_expected_count="${neutral_count}"
          refresh_expected_snapshot='null'
          invalidate_refresh_check() {
            local reason="$1"
            mutation_state="$(read_refresh_review_state)" || return 1
            if ! jq -e '.event_current == true' <<<"${mutation_state}" >/dev/null; then
              echo 'Queued refresh event became superseded before invalidation; no mutation is permitted.'
              exit 0
            fi
            case "${reason}" in
              binding) ;;
              incomplete|unresolved) jq -e --arg reason "${reason}" \
                '.[$reason] > 0' <<<"${mutation_state}" >/dev/null || exit 0 ;;
              *) return 1 ;;
            esac
            revalidate_refresh_state \
              "${refresh_expected_count}" "${refresh_expected_snapshot}" || return 1
            invalidated="$(gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${check_id}" \
              -f status=completed -f conclusion=failure \
              -f "details_url=${check_url}" -f "external_id=${current_external_id}" \
              -f 'output[title]=Current revision review invalidated' \
              -f "output[summary]=${recovery_evidence}")" || return 1
            jq -e --arg evidence "${recovery_evidence}" \
              --arg external_id "${current_external_id}" --arg head "${HEAD_SHA}" \
              --arg url "${check_url}" --argjson check_id "${check_id}" '
                .id == $check_id and .name == "Current revision review"
                and .app.id == 15368 and .app.slug == "github-actions"
                and .head_sha == $head and .external_id == $external_id
                and .status == "completed" and .conclusion == "failure"
                and .details_url == $url
                and .output.title == "Current revision review invalidated"
                and .output.summary == $evidence
              ' <<<"${invalidated}" >/dev/null || return 1
            refresh_expected_snapshot="$(jq -c \
              --argjson check_id "${check_id}" --argjson updated "${invalidated}" '
                map(if .id == $check_id then $updated else . end) | sort_by(.id)
              ' <<<"${refresh_expected_snapshot}")" || return 1
          }
          invalidate_duplicate_refresh_checks() {
            local duplicate
            refresh_expected_snapshot="$(jq -c 'sort_by(.id)' <<<"${neutral}")" || return 1
            while IFS= read -r duplicate; do
              check_id="$(jq -er '.id | select(type == "number" and . > 0 and . == floor)' \
                <<<"${duplicate}")" || return 1
              check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
              jq -e --arg url "${check_url}" '.details_url == $url' \
                <<<"${duplicate}" >/dev/null || return 1
              va "[$(jq -c '.' <<<"${duplicate}")]" || return 1
            done < <(jq -c 'sort_by(.id)[]' <<<"${neutral}")
            while IFS= read -r duplicate; do
              check_id="$(jq -er '.id' <<<"${duplicate}")" || return 1
              check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
              recovery_evidence="$(jq -cn \
                --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" \
                --argjson check_run_id "${check_id}" \
                --argjson producer_run_id "${owner_run_id}" '
                  {schema:4,base_sha:$base,head_sha:$head,
                    producer_run_id:$producer_run_id,
                    invalidated_check_run_id:$check_run_id,
                    reason:"canonical refresh invalidation"}
                ')" || return 1
              invalidate_refresh_check binding || return 1
            done < <(jq -c 'sort_by(.id) | reverse | .[]' <<<"${neutral}")
            return 0
          }
          if [ "${neutral_count}" -gt 1 ]; then
            invalidate_duplicate_refresh_checks || exit 1
            echo 'Duplicate protected review checks were deterministically invalidated; refusing ambiguous evidence.' >&2
            exit 1
          fi
          if [ "${neutral_count}" -eq 1 ]; then
            refresh_expected_snapshot="$(jq -c '.' <<<"${neutral}")"
            check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${neutral}")"
            check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
            if ! va "${neutral}"; then
              vh "${neutral}" "${check_url}" \
                || {
                  echo 'The protected review check has neither the current binding nor a verified previous-tuple binding; refusing to mutate it.' >&2
                  exit 1
                }
              echo 'Verified one exact previous-base tuple and its immutable producer owner; bounded handoff required.'
            fi
            recovery_evidence="$(jq -cn \
              --arg base "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --argjson check_run_id "${check_id}" \
              --argjson producer_run_id "${owner_run_id}" '
                {schema:4,base_sha:$base,head_sha:$head,
                  producer_run_id:$producer_run_id,
                  invalidated_check_run_id:$check_run_id,
                  reason:"canonical refresh invalidation"}
              ')"
            # Managed distribution has its own evidence kind. The sync App may
            # never satisfy the Copilot branch. Inside lightning-it/.github it
            # is accepted as managed-sync only on develop; the separate
            # ancestry-backmerge path remains independently bound.
            if jq -e \
              --arg evidence "${recovery_evidence}" \
              --arg url "${check_url}" '
                .[0].status == "completed"
                and .[0].conclusion == "failure"
                and .[0].details_url == $url
                and .[0].output.title == "Current revision review invalidated"
                and .[0].output.summary == $evidence
              ' <<<"${neutral}" >/dev/null; then
              echo 'Verified one exact canonical refresh invalidation; owner rerun required.'
              neutral_count=0
            elif ! jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${BASE_SHA}" \
              --arg current_kind "${current_external_kind}" \
              --arg head "${HEAD_SHA}" \
              --arg pr "${PR_NUMBER}" \
              --arg owner_pr "${owner_pr_number}" \
              --arg repository "${REPOSITORY}" --arg head_repository "${HEAD_REPOSITORY}" \
              --argjson pr_number "${PR_NUMBER}" \
              --argjson owner_pr_number "${owner_pr_number}" \
              --arg owner_run_id "${evidence_owner_run_id}" \
              --arg url "${check_url}" '
                .[0] as $check
                | ($check.output.summary | fromjson) as $summary
                | $check.status == "completed"
                and $check.conclusion == "success"
                and $check.details_url == $url
                and $summary.schema == 4
                and $summary.base_sha == $base
                and $summary.head_sha == $head
                and (
                  if ($check.external_id |
                    test("^mlx90-current-revision:(copilot|ancestry-backmerge):v5:")) then
                    $head_repository == $repository
                    and ((($summary | has("head_repository")) | not)
                      or $summary.head_repository == $head_repository)
                  else
                    $summary.head_repository == $head_repository
                  end
                )
                and (
                  (
                    (
                      (($author != "lightning-it-release-automation[bot]"
                        and $author != "lightning-it-shared-assets-sync[bot]"
                        and $author != "renovate[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:copilot:v6:" + $owner_pr
                            + ":" + $owner_run_id + ":" + $base + ":" + $head + "$")))
                      or
                      ($author == "lightning-it-shared-assets-sync[bot]"
                        and $summary.review_path
                          == "deterministic provenance-bound managed distribution exemption"
                        and ($check.external_id |
                          test("^mlx90-current-revision:managed-sync:v6:" + $pr
                            + ":" + $owner_run_id + ":" + $base + ":" + $head + "$")))
                      or
                      ($author == "renovate[bot]"
                        and $summary.review_path
                          == "deterministic policy-bound Renovate exemption"
                        and ($check.external_id |
                          test("^mlx90-current-revision:renovate:v6:" + $pr
                            + ":" + $owner_run_id + ":" + $base + ":" + $head + "$")))
                      or
                      (($author == "lightning-it-release-automation[bot]"
                        or ($repository == "lightning-it/.github"
                          and $author == "lightning-it-shared-assets-sync[bot]"))
                        and ($check.external_id |
                          test("^mlx90-current-revision:ancestry-backmerge:v6:"
                            + $pr + ":" + $owner_run_id + ":" + $base + ":" + $head + "$")))
                    )
                    and $summary.pull_request_number == (
                      if $current_kind == "copilot" then
                        $owner_pr_number
                      else
                        $pr_number
                      end)
                  )
                  or
                  (
                    (
                      (($author != "lightning-it-release-automation[bot]"
                        and $author != "lightning-it-shared-assets-sync[bot]"
                        and $author != "renovate[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:copilot:v5:" + $owner_run_id + ":"
                            + $base + ":" + $head + "$")))
                      or
                      (($author == "lightning-it-release-automation[bot]"
                        or ($repository == "lightning-it/.github"
                          and $author == "lightning-it-shared-assets-sync[bot]"))
                        and ($check.external_id |
                          test("^mlx90-current-revision:ancestry-backmerge:v5:"
                            + $owner_run_id + ":" + $base + ":" + $head + "$")))
                      or
                      ($author == "lightning-it-release-automation[bot]"
                        and ($check.external_id |
                          test("^mlx90-current-revision:v4:" + $owner_run_id
                            + ":[0-9a-f]{64}$")))
                    )
                    and ((($summary | has("pull_request_number")) | not)
                      or $summary.pull_request_number == $pr_number)
                  )
                )
                and $summary.producer_run_id == ($owner_run_id | tonumber)
              ' <<<"${neutral}" >/dev/null; then
              echo "Existing neutral result is stale or malformed; canonical rerun required."
              invalidate_refresh_check binding
              neutral_count=0
            fi

          fi
          incomplete="$(jq -er '.incomplete | select(type == "number")' \
            <<<"${review_state}")"
          unresolved="$(jq -er '.unresolved | select(type == "number")' \
            <<<"${review_state}")"
          if [ "${incomplete}" -gt 0 ]; then
            if [ "${neutral_count}" -eq 1 ]; then invalidate_refresh_check incomplete; fi
            echo 'Current review-thread evidence is incomplete; refusing refresh mutation.' >&2
            exit 1
          fi
          if [ "${unresolved}" -gt 0 ]; then
            if [ "${neutral_count}" -eq 1 ]; then
              invalidate_refresh_check unresolved
              echo 'Current-head Copilot findings invalidate the neutral PASS.' >&2
              exit 1
            fi
            echo 'Current-head findings remain unresolved; queued refresh is a no-op and cannot consume the rerun budget.'
            exit 0
          fi
          if [ "${neutral_count}" -eq 1 ]; then
            echo "The exact current-head neutral PASS remains valid; no rerun is needed."
            exit 0
          fi

          usable_current_review() {
            [ "${current_external_kind}" = copilot ] || return 0
            local reviews candidates id review comments texts
            reviews="$(oa --paginate --slurp "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")" || return 1
            candidates="$(jq -cer --arg head "${HEAD_SHA}" '
              select(type == "array" and length > 0 and length <= 10)
              | select(all(.[]; type == "array"))
              | [.[][] | select(.commit_id == $head)
                | select(.user.login | IN("copilot-pull-request-reviewer", "copilot-pull-request-reviewer[bot]"))
                | select(.state | ascii_downcase | IN("commented", "approved"))]
              | select(all(.[]; (.id | type) == "number" and .id > 0 and .id == (.id | floor)))
              | select((map(.id) | unique | length) == length)
              ' <<<"${reviews}")" || return 1
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              review="$(oa "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${id}")" || return 1
              jq -e --arg head "${HEAD_SHA}" --argjson id "${id}" '
                .id == $id and .commit_id == $head
                and (.user.login | IN("copilot-pull-request-reviewer", "copilot-pull-request-reviewer[bot]"))
                and (.state | ascii_downcase | IN("commented", "approved"))
                ' <<<"${review}" >/dev/null || return 1
              comments="$(oa --paginate --slurp "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${id}/comments?per_page=100")" || return 1
              texts="$(jq -ce --argjson review "${review}" '
                select(type == "array" and length > 0 and length <= 10)
                | select(all(.[]; type == "array"))
                | [$review.body, .[][].body]
                | select(all(.[]; type == "string" or . == null))
                | map((. // "") | ascii_downcase | gsub("can[\u0027\u2019]t"; "cannot") | gsub("n[\u0027\u2019]t"; " not") | gsub("\\s"; ""))
                ' <<<"${comments}")" || return 1
              if jq -e '
                any(.[]; length > 0) and all(.[];
                  (contains("unabletoreviewthispullrequest")
                   or contains("notabletoreviewthispullrequest") or contains("cannotreviewthispullrequest")
                   or contains("nofilestoreview") or contains("nofileswerereviewed")
                   or contains("unabletoreviewanyfiles") or contains("cannotreviewanyfiles")
                   or contains("notabletoreviewanyfiles")
                   or contains("wasnotabletoreviewanyfiles")
                   or contains("quotaexhausted")
                   or contains("quotaexceeded")
                   or contains("premiumrequestquota")
                   or contains("premiumrequestsquota")
                   or contains("suppressedcomment")
                   or contains("encounteredanerror")) | not)
                ' <<<"${texts}" >/dev/null; then return 0; fi
            done < <(jq -r '.[].id' <<<"${candidates}")
            echo 'No complete current-head AI review is available; preserving the one verifier retry.' >&2
            return 1
          }

          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/refresh-operation.sh"

          rerun_owner_if_review_current() {
            local review_state run run_attempt status
            revalidate_refresh_state \
              "${refresh_expected_count}" "${refresh_expected_snapshot}"
            run="$(gh api "repos/${REPOSITORY}/actions/runs/${owner_run_id}")" \
              || return 1
            validate_refresh_owner_run "${run}" "${owner_run_id}" "${PR_NUMBER}" || return 1
            status="$(jq -er '.status | select(type == "string")' \
              <<<"${run}")" || return 1
            if [ "${status}" != completed ]; then
              [[ "${status}" =~ ^(requested|waiting|pending|queued|in_progress)$ ]] \
                || return 1
              echo "Immutable producer owner ${owner_run_id} is ${status}; completion or scheduled reconciliation will resume verification."
              return 0
            fi
            run_attempt="$(jq -er '.run_attempt | select(. == 1 or . == 2)' \
              <<<"${run}")" || return 1
            if [ "${run_attempt}" -ne 1 ]; then
              echo "Immutable producer owner ${owner_run_id} exhausted its single supported rerun attempt." >&2
              return 0
            fi
            review_state="$(read_refresh_review_state)" || return 1
            if ! jq -e '
              .event_current == true
              and .incomplete == 0
              and .unresolved == 0
              ' <<<"${review_state}" >/dev/null; then
              echo 'Review evidence changed before rerun; preserving the remaining retry budget.' >&2
              return 0
            fi
            revalidate_refresh_state \
              "${refresh_expected_count}" "${refresh_expected_snapshot}"
            run="$(gh api "repos/${REPOSITORY}/actions/runs/${owner_run_id}")" \
              || return 1
            assert_refresh_rerun_budget "${run}" || return 1
            usable_current_review || return 0
            revalidate_refresh_state "${refresh_expected_count}" "${refresh_expected_snapshot}" || return 1
            claim_review_operation "${owner_run_id}" "${HEAD_SHA}" "${BASE_SHA}" "${PR_NUMBER}" || return 0
            # A lost response cannot authorize a second POST. Completion and
            # schedule events read the native attempt and the consumption marker.
            revalidate_refresh_state "${refresh_expected_count}" "${refresh_expected_snapshot}" || return 1
            if gh api --method POST \
                "repos/${REPOSITORY}/actions/runs/${owner_run_id}/rerun"; then
              echo "Rerun requested for immutable producer owner ${owner_run_id}."
            else
              for observation in 1 2 3; do
                if run="$(gh api "repos/${REPOSITORY}/actions/runs/${owner_run_id}")" \
                  && jq -e --argjson id "${owner_run_id}" '.id == $id and .run_attempt == 2' \
                    <<<"${run}" >/dev/null; then
                  echo 'Uncertain rerun response reconciled from native attempt two.'
                  return 0
                fi
                [ "${observation}" -eq 3 ] || sleep 2
              done
              echo 'Rerun response unresolved; consumed marker retained for native reconciliation.'
            fi
          }
          rerun_owner_if_review_current

  legacy-refresh:
    name: ${{ (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) && 'Inactive legacy writer' || 'Refresh canonical Copilot review gate' }}
    if: >-
      !(vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) &&
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["develop","main"]'), github.event.repository.default_branch) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == github.triggering_actor
    permissions:
      actions: write
      checks: read
      contents: read
      # The documented timeline permission is Pull requests: read OR Issues:
      # read. Retain the narrower grant already required by this controller.
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Rerun the canonical protected gate when needed
        env:
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          CONTROLLER_REF: ${{ github.workflow_ref }}
          EXPECTED_EXTERNAL_REQUIRED_WORKFLOW_BLOB_SHA: 0e7b568fcf0ed6829f6e191d7b4e30d3699b48b6
          EXTERNAL_REQUIRED_WORKFLOW_PATH: .github/workflows/supplementary-current-revision-required.yml
          EXTERNAL_REQUIRED_WORKFLOW_REF: main
          EXTERNAL_REQUIRED_WORKFLOW_REPOSITORY: lightning-it/.github
          GH_TOKEN: ${{ github.token }}
          INPUT_EVIDENCE_COMMENT_ID: ${{ inputs.evidence_comment_id }}
          INPUT_EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_REQUIRED_WORKFLOW_RUN_ID: ${{ inputs.required_workflow_run_id }}
          INPUT_REVIEW_ID: ${{ inputs.review_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY_OWNER}" = lightning-it
          test "${GITHUB_ACTOR}" = "${GITHUB_TRIGGERING_ACTOR}"
          BASE_SHA="${INPUT_EXPECTED_BASE_SHA}"
          HEAD_SHA="${INPUT_EXPECTED_HEAD_SHA}"
          PR_NUMBER="${INPUT_PR_NUMBER}"
          REQUIRED_WORKFLOW_RUN_ID="${INPUT_REQUIRED_WORKFLOW_RUN_ID:-0}"
          REVIEW_ID="${INPUT_REVIEW_ID}"
          EVIDENCE_COMMENT_ID="${INPUT_EVIDENCE_COMMENT_ID:-0}"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REVIEW_ID}" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "${REQUIRED_WORKFLOW_RUN_ID}" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "${EVIDENCE_COMMENT_ID}" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "${CONTROLLER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          repository_state="$(gh api "repos/${REPOSITORY}")"
          default_branch="$(jq -er \
            '.default_branch | select(. == "develop" or . == "main")' \
            <<<"${repository_state}")"
          test "${GITHUB_REF}" = "refs/heads/${default_branch}"
          test "${CONTROLLER_REF}" = \
            "${REPOSITORY}/.github/workflows/copilot-review-refresh.yml@refs/heads/${default_branch}"
          default_state="$(gh api \
            "repos/${REPOSITORY}/branches/${default_branch}")"
          default_head="$(jq -er \
            '.commit.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            <<<"${default_state}")"
          jq -e \
            --arg branch "${default_branch}" \
            --arg head "${default_head}" '
              .name == $branch
              and .protected == true
              and .commit.sha == $head
            ' <<<"${default_state}" >/dev/null
          test "${CONTROLLER_SHA}" = "${default_head}"
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${BASE_SHA}" \
            --arg head "${HEAD_SHA}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .draft == false
              and .base.sha == $base
              and .head.sha == $head
              and .base.repo.full_name == $repository
              and (.head.repo.full_name | type == "string" and length > 0)
              and (.base.ref == "develop" or .base.ref == "main")
              and (.head.ref | type == "string" and length > 0)
              and (.user.login | type == "string" and length > 0)
              and (.labels | type) == "array"
              and all(.labels[];
                type == "object" and (.name | type) == "string")
            ' <<<"${pr}" >/dev/null
          PR_AUTHOR="$(jq -er .user.login <<<"${pr}")"
          PR_BASE_REF="$(jq -er .base.ref <<<"${pr}")"
          PR_HEAD_REF="$(jq -er .head.ref <<<"${pr}")"
          PR_HEAD_REPOSITORY="$(jq -er \
            '.head.repo.full_name | select(type == "string" and length > 0)' \
            <<<"${pr}")"
          [[ "${PR_BASE_REF}" =~ ^(develop|main)$ ]]
          if [ "${PR_AUTHOR}" = 'lightning-it-release-automation[bot]' ]; then
            echo "Release-App PRs use only the protected Exact-Revision Codex path."
            exit 0
          fi
          labels_sha256_from_pr() {
            local labels_json pr_json="$1"
            if ! jq -e \
              --arg base "${BASE_SHA}" \
              --arg base_ref "${PR_BASE_REF}" \
              --arg head "${HEAD_SHA}" \
              --arg head_repository "${PR_HEAD_REPOSITORY}" \
              --arg repository "${REPOSITORY}" '
                .state == "open"
                and .draft == false
                and .base.ref == $base_ref
                and .base.sha == $base
                and .head.sha == $head
                and .base.repo.full_name == $repository
                and .head.repo.full_name == $head_repository
                and ($head_repository == $repository or .user.type == "User")
                and (.labels | type) == "array"
                and all(.labels[];
                  type == "object" and (.name | type) == "string")
              ' <<<"${pr_json}" >/dev/null; then
              return 1
            fi
            labels_json="$(jq -cer '[.labels[].name] | sort' <<<"${pr_json}")" || return 1
            printf '%s' "${labels_json}" | sha256sum | cut -d ' ' -f 1
          }
          read_metadata_revision() {
            local owner="${REPOSITORY%%/*}" repository="${REPOSITORY#*/}"
            local query response
            read -r -d '' query <<'GRAPHQL' || true
          query($owner: String!, $repository: String!, $number: Int!) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) { number lastEditedAt }
            }
          }
          GRAPHQL
            response="$(gh api graphql \
              -f query="${query}" \
              -F owner="${owner}" \
              -F repository="${repository}" \
              -F number="${PR_NUMBER}")"
            jq -er \
              --argjson number "${PR_NUMBER}" '
                select(if has("errors") then ((.errors | type) == "array" and (.errors | length) == 0) else true end)
                | select(.data.repository.pullRequest.number == $number)
                | .data.repository.pullRequest.lastEditedAt
                | if . == null then "null"
                  elif type == "string"
                    and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")
                  then . else error("malformed lastEditedAt") end
              ' <<<"${response}"
          }
          PR_LABELS_SHA256="$(labels_sha256_from_pr "${pr}")"
          [[ "${PR_LABELS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          PR_LAST_EDITED_AT="$(read_metadata_revision)"
          runs_url="repos/${REPOSITORY}/actions/runs"
          has_live_write_permission() {
            local actor="$1"
            local actor_permission
            if ! [[ "${actor}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]; then
              return 1
            fi
            if ! actor_permission="$(gh api \
              "repos/${REPOSITORY}/collaborators/${actor}/permission")"; then
              return 1
            fi
            if ! jq -e \
              --arg actor "${actor}" '
                (.permission | type == "string")
                and (.role_name | type == "string" and length > 0)
                and (.user.login | type == "string" and length > 0)
                and .user.type == "User"
                and (.user.permissions.push | type == "boolean")
                and ((.user.login | ascii_downcase) == ($actor | ascii_downcase))
                and .user.permissions.push == true
                and (.permission == "write"
                  or .permission == "maintain"
                  or .permission == "admin")
              ' <<<"${actor_permission}" >/dev/null; then
              return 1
            fi
            return 0
          }
          verify_external_required_workflow() {
            local branch_state repository_state workflow_blob workflow_payload
            repository_state="$(gh api \
              "repos/${EXTERNAL_REQUIRED_WORKFLOW_REPOSITORY}")"
            jq -e \
              --arg repository "${EXTERNAL_REQUIRED_WORKFLOW_REPOSITORY}" '
                .full_name == $repository
                and .private == false
                and .owner.login == "lightning-it"
                and .owner.type == "Organization"
              ' <<<"${repository_state}" >/dev/null
            branch_state="$(gh api \
              "repos/${EXTERNAL_REQUIRED_WORKFLOW_REPOSITORY}/branches/${EXTERNAL_REQUIRED_WORKFLOW_REF}")"
            EXTERNAL_REQUIRED_WORKFLOW_HEAD_SHA="$(jq -er \
              '.commit.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              <<<"${branch_state}")"
            jq -e \
              --arg branch "${EXTERNAL_REQUIRED_WORKFLOW_REF}" \
              --arg head "${EXTERNAL_REQUIRED_WORKFLOW_HEAD_SHA}" '
                .name == $branch
                and .protected == true
                and .commit.sha == $head
              ' <<<"${branch_state}" >/dev/null
            workflow_payload="$(gh api \
              "repos/${EXTERNAL_REQUIRED_WORKFLOW_REPOSITORY}/contents/${EXTERNAL_REQUIRED_WORKFLOW_PATH}?ref=${EXTERNAL_REQUIRED_WORKFLOW_REF}")"
            jq -e \
              --arg blob "${EXPECTED_EXTERNAL_REQUIRED_WORKFLOW_BLOB_SHA}" \
              --arg path "${EXTERNAL_REQUIRED_WORKFLOW_PATH}" '
                .type == "file" and .path == $path and .sha == $blob
                and .encoding == "base64"
                and (.content | type == "string" and length > 0)
                and (.size | type == "number" and . > 0 and . <= 200000)
              ' <<<"${workflow_payload}" >/dev/null
            workflow_blob="$(jq -er .content <<<"${workflow_payload}" \
              | base64 --decode | git hash-object --stdin)"
            test "${workflow_blob}" = \
              "${EXPECTED_EXTERNAL_REQUIRED_WORKFLOW_BLOB_SHA}"
          }
          require_failed_required_workflow() {
            local failed_reservation failed_reservation_id failed_reservation_pages
            local required_job
            local required_jobs_pages required_run required_run_attempt
            local required_run_id required_runs required_runs_pages
            required_runs_pages="$(gh api --paginate --slurp \
              "${runs_url}?event=pull_request_target&head_sha=${HEAD_SHA}&per_page=100")"
            # Live run 33655265312 attempt 2 proves GitHub preserves the PR
            required_runs="$(jq -c \
              --arg api_url "${GITHUB_API_URL}" \
              --arg author "${PR_AUTHOR}" \
              --arg base_ref "${PR_BASE_REF}" \
              --arg base_sha "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --arg head_ref "${PR_HEAD_REF}" \
              --arg head_repository "${PR_HEAD_REPOSITORY}" \
              --arg prefix "Protected current revision PR #${PR_NUMBER} " \
              --arg repository "${REPOSITORY}" \
              --arg suffix " ${HEAD_SHA}" \
              --arg workflow_name "Protected current-revision evidence verifier" \
              --argjson pr "${PR_NUMBER}" '
                [.[].workflow_runs[]? |
                  select(.event == "pull_request_target") |
                  select(.path == ".github/workflows/supplementary-current-revision-required.yml") |
                  select((.workflow_id | type) == "number" and .workflow_id > 0) |
                  select(.workflow_url == ($api_url + "/repos/" + $repository
                    + "/actions/required_workflows/" + (.workflow_id | tostring))) |
                  select(.repository.full_name == $repository) |
                  select(.head_repository.full_name == $head_repository) |
                  select(.head_branch == $head_ref and .head_sha == $head) |
                  select(.actor.login == $author) |
                  select((.run_attempt == 1
                      and .triggering_actor.login == $author)
                    or (.run_attempt > 1
                      and .triggering_actor.login == "github-actions[bot]")) |
                  select((.pull_requests | length) == 1) |
                  select(.pull_requests[0].number == $pr) |
                  select(.pull_requests[0].url == ($api_url + "/repos/"
                    + $repository + "/pulls/" + ($pr | tostring))) |
                  select(.pull_requests[0].base.ref == $base_ref) |
                  select(.pull_requests[0].base.sha == $base_sha) |
                  select(.pull_requests[0].base.repo.url == ($api_url
                    + "/repos/" + $repository)) |
                  select(.pull_requests[0].head.ref == $head_ref) |
                  select(.pull_requests[0].head.sha == $head) |
                  select(.pull_requests[0].head.repo.url == ($api_url
                    + "/repos/" + $head_repository)) |
                  select(.display_title == ($prefix + "opened" + $suffix)
                    or .display_title == ($prefix + "synchronize" + $suffix)
                    or .display_title == ($prefix + "reopened" + $suffix)
                    or .display_title == ($prefix + "ready_for_review" + $suffix)
                    or .display_title == ($prefix + "edited" + $suffix)) |
                  select(.name == .display_title or .name == $workflow_name)]
                | sort_by(.run_number) | reverse
              ' <<<"${required_runs_pages}")"
            test "$(jq 'length' <<<"${required_runs}")" -gt 0
            required_run="$(jq -c '.[0]' <<<"${required_runs}")"
            jq -e '
              (.run_attempt | type) == "number"
              and .run_attempt > 0
              and .status == "completed"
              and .conclusion == "failure"
            ' <<<"${required_run}" >/dev/null
            required_run_id="$(jq -er \
              '.id | select(type == "number" and . > 0)' \
              <<<"${required_run}")"
            required_run_attempt="$(jq -er \
              '.run_attempt | select(type == "number" and . > 0)' \
              <<<"${required_run}")"
            test "$(jq -r .html_url <<<"${required_run}")" = \
              "${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${required_run_id}"
            required_jobs_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs/${required_run_id}/attempts/${required_run_attempt}/jobs?filter=all&per_page=100")"
            required_job="$(jq -c \
              --arg head "${HEAD_SHA}" \
              --argjson run_attempt "${required_run_attempt}" '
              [.[].jobs[]? |
                select(.name == "Required current-revision workflow") |
                select(.head_sha == $head and .run_attempt == $run_attempt) |
                select(.status == "completed" and .conclusion == "failure") |
                select((.runner_name | type) == "string"
                  and (.runner_name | length) > 0)]
            ' <<<"${required_jobs_pages}")"
            test "$(jq 'length' <<<"${required_job}")" -eq 1
            failed_reservation="$(jq -c \
              --arg head "${HEAD_SHA}" \
              --argjson run_attempt "${required_run_attempt}" '
              [.[].jobs[]? |
                select(.name == "Protected current-revision verifier") |
                select(.head_sha == $head and .run_attempt == $run_attempt) |
                select(.status == "completed" and .conclusion == "failure")]
            ' <<<"${required_jobs_pages}")"
            test "$(jq 'length' <<<"${failed_reservation}")" -eq 1
            failed_reservation_id="$(jq -er \
              '.[0].id | select(type == "number" and . > 0)' \
              <<<"${failed_reservation}")"
            failed_reservation_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Protected%20current-revision%20verifier&filter=all&per_page=100")"
            failed_reservation="$(jq -c \
              --argjson check_id "${failed_reservation_id}" '
                [.[].check_runs[]? | select(.id == $check_id)]
              ' <<<"${failed_reservation_pages}")"
            test "$(jq 'length' <<<"${failed_reservation}")" -eq 1
            failed_reservation="$(jq -c '.[0]' <<<"${failed_reservation}")"
            jq -e \
              --arg base "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --arg repository "${REPOSITORY}" \
              --arg server_url "${GITHUB_SERVER_URL}" \
              --argjson check_id "${failed_reservation_id}" \
              --argjson pr "${PR_NUMBER}" \
              --argjson run_id "${required_run_id}" '
                .id == $check_id
                and .name == "Protected current-revision verifier"
                and .app.id == 15368 and .app.slug == "github-actions"
                and .head_sha == $head
                and .details_url == ($server_url + "/" + $repository
                  + "/runs/" + ($check_id | tostring))
                and .external_id == ("rep60-required-workflow:v3:"
                  + ($run_id | tostring) + ":" + ($pr | tostring) + ":"
                  + $base + ":" + $head)
                and .status == "completed" and .conclusion == "failure"
              ' <<<"${failed_reservation}" >/dev/null
          }

          if [ "${REVIEW_ID}" -eq 0 ]; then
            test "${EVIDENCE_COMMENT_ID}" -eq 0
            test "${GITHUB_ACTOR}" = litroc
            test "${PR_AUTHOR}" = litroc
            test "$(jq -r .user.type <<<"${pr}")" = User
            test "${PR_BASE_REF}" = main
            test "${PR_HEAD_REPOSITORY}" = "${REPOSITORY}"
            test "$(jq -r .title <<<"${pr}")" = \
              'fix(rep60): bootstrap protected main review trust root'
            [[ "${PR_HEAD_REF}" =~ ^fix/rep60-main-trust-root-(successor|bootstrap)-v[1-9][0-9]*-[0-9]{8}$ ]]
            test "${REQUIRED_WORKFLOW_RUN_ID}" -gt 0
            has_live_write_permission "${GITHUB_ACTOR}"
            verify_external_required_workflow

            review_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            jq -e --arg head "${HEAD_SHA}" '
              all(add[]?;
                .commit_id != $head
                or (.user.login != "copilot-pull-request-reviewer"
                  and .user.login != "copilot-pull-request-reviewer[bot]"))
            ' <<<"${review_pages}" >/dev/null
            comments="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
            jq -e --arg marker "<!-- mlx90-copilot-request head=${HEAD_SHA} -->" '
              all(add[]?; (.body // "") | contains($marker) | not)
            ' <<<"${comments}" >/dev/null

            failed_run="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${REQUIRED_WORKFLOW_RUN_ID}")"
            jq -e \
              --arg api_url "${GITHUB_API_URL}" \
              --arg base "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --arg head_ref "${PR_HEAD_REF}" \
              --arg repository "${REPOSITORY}" \
              --arg workflow_name "Protected current-revision evidence verifier" \
              --argjson id "${REQUIRED_WORKFLOW_RUN_ID}" \
              --argjson pr "${PR_NUMBER}" '
                .id == $id and .event == "pull_request_target"
                and .path == ".github/workflows/supplementary-current-revision-required.yml"
                and (.workflow_id | type) == "number" and .workflow_id > 0
                and .workflow_url == ($api_url + "/repos/" + $repository
                  + "/actions/required_workflows/" + (.workflow_id | tostring))
                and .repository.full_name == $repository
                and .head_repository.full_name == $repository
                and .head_branch == $head_ref and .head_sha == $head
                and .actor.login == "litroc"
                and .triggering_actor.login == "litroc"
                and .run_attempt == 1
                and .status == "completed" and .conclusion == "failure"
                and (.pull_requests | length) == 1
                and .pull_requests[0].number == $pr
                and .pull_requests[0].base.ref == "main"
                and .pull_requests[0].base.sha == $base
                and .pull_requests[0].base.repo.url == ($api_url
                  + "/repos/" + $repository)
                and .pull_requests[0].head.ref == $head_ref
                and .pull_requests[0].head.sha == $head
                and .pull_requests[0].head.repo.url == ($api_url
                  + "/repos/" + $repository)
                and (.display_title == ("Protected current revision PR #"
                  + ($pr | tostring) + " opened " + $head)
                  or .display_title == ("Protected current revision PR #"
                    + ($pr | tostring) + " ready_for_review " + $head))
                and (.name == .display_title or .name == $workflow_name)
              ' <<<"${failed_run}" >/dev/null
            failed_jobs="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${REQUIRED_WORKFLOW_RUN_ID}/attempts/1/jobs?filter=all&per_page=100")"
            jq -e '
              type == "object"
              and (.total_count | type) == "number"
              and (.jobs | type) == "array"
              and .total_count == (.jobs | length)
              and .total_count >= 1 and .total_count <= 2
              and all(.jobs[];
                (.id | type) == "number" and .id > 0
                and .run_attempt == 1 and .status == "completed"
                and (.name == "Required current-revision workflow"
                  or .name == "Authorize exact Supplementary catch-up v5 successor"))
            ' <<<"${failed_jobs}" >/dev/null
            failed_required_jobs="$(jq -c --arg head "${HEAD_SHA}" '
              [.jobs[] |
                select(.name == "Required current-revision workflow") |
                select(.head_sha == $head) |
                select(.conclusion == "failure") |
                select((.runner_id | type) == "number" and .runner_id > 0) |
                select((.runner_name | type) == "string" and length > 0) |
                select(([.steps[]? |
                  select(.name == "Classify protected main trust-root bootstrap handoff") |
                  select(.status == "completed" and .conclusion == "failure")]
                  | length) == 1) |
                select(([.steps[]? | select(.conclusion == "failure")]
                  | length) == 1)]
            ' <<<"${failed_jobs}")"
            test "$(jq 'length' <<<"${failed_required_jobs}")" -eq 1
            synthetic_jobs="$(jq -c '[.jobs[] |
              select(.name == "Authorize exact Supplementary catch-up v5 successor") |
              select(.conclusion == "skipped") |
              select(.runner_id == null and .runner_name == null) |
              select((.steps | type) == "array" and (.steps | length) == 0)]' \
              <<<"${failed_jobs}")"
            test "$(jq 'length' <<<"${synthetic_jobs}")" -le 1
            test "$(jq '[.jobs[] | select(.conclusion == "failure")] | length' \
              <<<"${failed_jobs}")" -eq 1
            FAILED_REQUIRED_JOB_ID="$(jq -er \
              '.[0].id | select(type == "number" and . > 0)' \
              <<<"${failed_required_jobs}")"

            reservation_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Protected%20current-revision%20verifier&filter=all&per_page=100")"
            jq -e '
              [.[].check_runs[]? |
                select(.name == "Protected current-revision verifier")]
              | length == 0
            ' <<<"${reservation_pages}" >/dev/null

            current_default="$(gh api \
              "repos/${REPOSITORY}/branches/${default_branch}")"
            jq -e --arg head "${CONTROLLER_SHA}" '
              .protected == true and .commit.sha == $head
            ' <<<"${current_default}" >/dev/null
            current_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            jq -e \
              --arg base "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --arg head_ref "${PR_HEAD_REF}" \
              --arg repository "${REPOSITORY}" '
                .state == "open" and .draft == false
                and .user.login == "litroc" and .user.type == "User"
                and .title == "fix(rep60): bootstrap protected main review trust root"
                and .base.ref == "main" and .base.sha == $base
                and .base.repo.full_name == $repository
                and .head.ref == $head_ref and .head.sha == $head
                and .head.repo.full_name == $repository
              ' <<<"${current_pr}" >/dev/null
            current_failed_run="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${REQUIRED_WORKFLOW_RUN_ID}")"
            jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg head "${HEAD_SHA}" \
              --argjson id "${REQUIRED_WORKFLOW_RUN_ID}" '
                .id == $id and .head_sha == $head
                and .run_attempt == 1
                and .status == "completed" and .conclusion == "failure"
                and .actor.login == $author
                and .triggering_actor.login == $author
              ' <<<"${current_failed_run}" >/dev/null

            verify_external_required_workflow
            if ! has_live_write_permission "${GITHUB_ACTOR}"; then
              echo "Dispatch actor lost current write permission before bootstrap verifier rerun." >&2
              exit 1
            fi

            gh api --method POST \
              "repos/${REPOSITORY}/actions/jobs/${FAILED_REQUIRED_JOB_ID}/rerun" \
              >/dev/null
            rerun_observed=false
            for attempt in $(seq 1 30); do
              rerun="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${REQUIRED_WORKFLOW_RUN_ID}")"
              if jq -e \
                  --arg author "${PR_AUTHOR}" \
                  --arg head "${HEAD_SHA}" '
                    .head_sha == $head and .run_attempt == 2
                    and .actor.login == $author
                    and .triggering_actor.login == "github-actions[bot]"
                    and (.status == "queued"
                      or .status == "in_progress"
                      or .status == "completed")
                  ' <<<"${rerun}" >/dev/null; then
                rerun_observed=true
                break
              fi
              sleep 2
            done
            test "${rerun_observed}" = true
            {
              echo '### Protected main trust-root verifier recovery'
              echo
              echo "- PR: ${PR_NUMBER}"
              echo "- Base: ${BASE_SHA}"
              echo "- Head: ${HEAD_SHA}"
              echo "- Required Workflow run: ${REQUIRED_WORKFLOW_RUN_ID}"
              echo "- Required Workflow job: ${FAILED_REQUIRED_JOB_ID}"
              echo "- External verifier head: ${EXTERNAL_REQUIRED_WORKFLOW_HEAD_SHA}"
              echo "- External verifier blob: ${EXPECTED_EXTERNAL_REQUIRED_WORKFLOW_BLOB_SHA}"
              echo '- AI requested: no'
              echo '- Check mutated: no'
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          test "${REQUIRED_WORKFLOW_RUN_ID}" -eq 0

          neutral_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"
          neutral="$(jq -c --arg head "${HEAD_SHA}" '
            [.[].check_runs[]? |
              select(.name == "Current revision review") |
              select(.app.id == 15368 and .app.slug == "github-actions") |
              select(.head_sha == $head)]
          ' <<<"${neutral_pages}")"
          neutral_count="$(jq 'length' <<<"${neutral}")"
          if [ "${neutral_count}" -gt 1 ]; then
            echo "Multiple protected Current revision review checks exist for ${HEAD_SHA}." >&2
            require_failed_required_workflow
            exit 1
          fi
          if [ "${neutral_count}" -eq 1 ]; then
            check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${neutral}")"
            check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
            validate_neutral_producer() {
              local external_id evidence_version kind producer producer_id
              local producer_attempt_jobs producer_failures producer_helper_failures
              local producer_jobs producer_jobs_pages producer_run_attempt producer_url
              local review_id review_pages
              external_id="$(jq -er '.[0].external_id | select(type == "string")' <<<"${neutral}")"
              producer_id="$(jq -er '.[0].output.summary | fromjson | .producer_run_id | select(type == "number" and . > 0)' <<<"${neutral}")"
              producer_url="$(jq -er '.[0].output.summary | fromjson | .run_url | select(type == "string" and length > 0)' <<<"${neutral}")"
              if [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|managed-sync|ancestry-backmerge):v6:${PR_NUMBER}:([1-9][0-9]*):${BASE_SHA}:${HEAD_SHA}$ ]]; then
                evidence_version=v6
                kind="${BASH_REMATCH[1]}"
                test "${BASH_REMATCH[2]}" = "${producer_id}"
              elif [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|ancestry-backmerge):v5:([1-9][0-9]*):${BASE_SHA}:${HEAD_SHA}$ ]]; then
                evidence_version=v5
                kind="${BASH_REMATCH[1]}"
                test "${BASH_REMATCH[2]}" = "${producer_id}"
              else
                return 1
              fi
              if [ "${evidence_version}" = v6 ]; then
                summary_controller_sha="$(jq -er \
                  '.[0].output.summary | fromjson | .controller_sha
                    | select(type == "string" and test("^[0-9a-f]{40}$"))' \
                  <<<"${neutral}")" || return 1
                summary_controller_ref="$(jq -er \
                  '.[0].output.summary | fromjson | .controller_ref
                    | select(type == "string" and length > 0)' \
                  <<<"${neutral}")" || return 1
                test "${summary_controller_ref}" = "${default_branch}" \
                  || return 1
                summary_controller_ancestry="$(gh api \
                  "repos/${REPOSITORY}/compare/${summary_controller_sha}...${default_head}")" \
                  || return 1
                jq -e \
                  --arg controller "${summary_controller_sha}" '
                    .status == "identical"
                    or (.status == "ahead"
                      and .behind_by == 0
                      and .merge_base_commit.sha == $controller)
                  ' <<<"${summary_controller_ancestry}" >/dev/null \
                  || return 1
              fi
              test "${producer_url}" = "${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_id}"
              producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_id}")" || return 1
              jq -e \
                --arg base_ref "${PR_BASE_REF}" \
                --arg base_sha "${BASE_SHA}" \
                --arg head_ref "${PR_HEAD_REF}" \
                --arg head_repository "${PR_HEAD_REPOSITORY}" \
                --arg head_sha "${HEAD_SHA}" \
                --arg repository "${REPOSITORY}" \
                --arg url "${producer_url}" \
                --argjson pr "${PR_NUMBER}" '
                  .event == "pull_request_target"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .repository.full_name == $repository
                  and .head_repository.full_name == $head_repository
                  and .head_branch == $head_ref and .head_sha == $head_sha
                  and .html_url == $url and .status == "completed"
                  and (.conclusion == "success" or .conclusion == "failure")
                  and (.run_attempt | type) == "number"
                  and .run_attempt >= 1 and .run_attempt <= 2
                  and (.pull_requests | length) == 1
                  and .pull_requests[0].number == $pr
                  and .pull_requests[0].base.ref == $base_ref
                  and .pull_requests[0].base.sha == $base_sha
                  and .pull_requests[0].head.ref == $head_ref
                  and .pull_requests[0].head.sha == $head_sha
                ' <<<"${producer}" >/dev/null || return 1
              producer_run_attempt="$(jq -er '.run_attempt | select(type == "number")' <<<"${producer}")"
              producer_jobs_pages="$(gh api --paginate --slurp \
                "repos/${REPOSITORY}/actions/runs/${producer_id}/jobs?filter=all&per_page=100")" || return 1
              producer_attempt_jobs="$(jq -c \
                --arg head "${HEAD_SHA}" \
                --argjson attempt "${producer_run_attempt}" \
                --argjson run_id "${producer_id}" '
                  [.[].jobs[]? |
                    select(.run_id == $run_id and .head_sha == $head) |
                    select(.run_attempt == $attempt and .status == "completed")]
                ' <<<"${producer_jobs_pages}")" || return 1
              test "$(jq 'length' <<<"${producer_attempt_jobs}")" -gt 0 \
                || return 1
              producer_failures="$(jq -c \
                '[.[] | select(.conclusion == "failure")]' \
                <<<"${producer_attempt_jobs}")" || return 1
              if [ "$(jq -r .conclusion <<<"${producer}")" = success ]; then
                test "$(jq 'length' <<<"${producer_failures}")" -eq 0 \
                  || return 1
              else
                producer_helper_failures="$(jq -c '
                  [.[] |
                    select(.name == "Request protected verifier re-evaluation / Re-run the one protected verifier attempt") |
                    select((.runner_id | type) == "number" and .runner_id > 0) |
                    select((.runner_name | type) == "string" and (.runner_name | length) > 0) |
                    select((.steps | type) == "array" and (.steps | length) > 0) |
                    select(([.steps[]? |
                      select(.name == "Validate the live binding and rerun exactly once") |
                      select(.status == "completed" and .conclusion == "failure")]
                      | length) == 1) |
                    select(([.steps[]? | select(.conclusion == "failure")]
                      | length) == 1)]
                  ' <<<"${producer_failures}")" || return 1
                test "$(jq 'length' <<<"${producer_failures}")" -eq 1 \
                  || return 1
                test "$(jq 'length' <<<"${producer_helper_failures}")" -eq 1 \
                  || return 1
                jq -e 'all(.[];
                  .conclusion == "success"
                  or .conclusion == "skipped"
                  or .name == "Request protected verifier re-evaluation / Re-run the one protected verifier attempt")' \
                  <<<"${producer_attempt_jobs}" >/dev/null || return 1
              fi
              producer_jobs="$(jq -c --argjson attempt "${producer_run_attempt}" '
                [.[].jobs[]? | select(.name == "Verify current revision policy") |
                  select(.run_attempt == $attempt and .status == "completed"
                    and .conclusion == "success")]
              ' <<<"${producer_jobs_pages}")" || return 1
              test "$(jq 'length' <<<"${producer_jobs}")" -eq 1
              test "$(jq '[.[0].steps[]? | select(.name == "Publish bound neutral result"
                and .conclusion == "success")] | length' <<<"${producer_jobs}")" -eq 1
              if [ "${kind}" = copilot ]; then
                review_pages="$(gh api --paginate --slurp \
                  "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")" || return 1
                if [ "${evidence_version}" = v6 ]; then
                  review_id="$(jq -er '.[0].output.summary | fromjson | .review_id | select(type == "string" and length > 0)' <<<"${neutral}")" || return 1
                  jq -e --arg head "${HEAD_SHA}" --arg review_id "${review_id}" '
                    [add[]? | select(.node_id == $review_id)] as $reviews |
                    ($reviews | length) == 1 and $reviews[0].commit_id == $head
                    and ($reviews[0].user.login == "copilot-pull-request-reviewer"
                      or $reviews[0].user.login == "copilot-pull-request-reviewer[bot]")
                    and ($reviews[0].state == "COMMENTED" or $reviews[0].state == "APPROVED")
                  ' <<<"${review_pages}" >/dev/null || return 1
                else
                  jq -e --arg head "${HEAD_SHA}" '
                    [add[]? | select(.commit_id == $head) |
                      select(.user.login == "copilot-pull-request-reviewer"
                        or .user.login == "copilot-pull-request-reviewer[bot]")] as $reviews |
                    ($reviews | length) == 1
                    and ($reviews[0].state == "COMMENTED" or $reviews[0].state == "APPROVED")
                  ' <<<"${review_pages}" >/dev/null || return 1
                fi
              fi
            }
            if ! jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --arg head_repository "${PR_HEAD_REPOSITORY}" \
              --arg labels_sha256 "${PR_LABELS_SHA256}" \
              --arg last_edited_at "${PR_LAST_EDITED_AT}" \
              --arg controller_ref "${default_branch}" \
              --arg pr "${PR_NUMBER}" \
              --arg base_ref "${PR_BASE_REF}" \
              --arg repository "${REPOSITORY}" \
              --argjson pr_number "${PR_NUMBER}" \
              --arg url "${check_url}" '
                .[0] as $check
                | ($check.output.summary | fromjson) as $summary
                | $check.status == "completed"
                and $check.conclusion == "success"
                and $check.details_url == $url
                and $summary.schema == 4
                and $summary.base_sha == $base
                and $summary.head_sha == $head
                and (
                  (
                    (
                      (($author != "lightning-it-release-automation[bot]"
                        and $author != "lightning-it-shared-assets-sync[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:copilot:v6:" + $pr
                            + ":[1-9][0-9]*:" + $base + ":" + $head + "$")))
                      or
                      (($author == "lightning-it-shared-assets-sync[bot]"
                        and $repository != "lightning-it/.github"
                        and $base_ref == "develop")
                        and $summary.review_path
                          == "deterministic provenance-bound managed distribution exemption"
                        and ($check.external_id |
                          test("^mlx90-current-revision:managed-sync:v6:" + $pr
                            + ":[1-9][0-9]*:" + $base + ":" + $head + "$")))
                      or
                      (($repository == "lightning-it/.github"
                        and $author == "lightning-it-shared-assets-sync[bot]"
                        and $base_ref == "develop")
                        and $summary.review_path
                          == "deterministic evidence-bound ancestry exemption"
                        and ($check.external_id |
                          test("^mlx90-current-revision:ancestry-backmerge:v6:"
                            + $pr + ":[1-9][0-9]*:" + $base + ":" + $head + "$")))
                    )
                    and $summary.pull_request_number == $pr_number
                    and $summary.head_repository == $head_repository
                    and ($summary.controller_sha | test("^[0-9a-f]{40}$"))
                    and $summary.controller_ref == $controller_ref
                    and $summary.pull_request_labels_sha256 == $labels_sha256
                    and ($summary | has("pull_request_last_edited_at"))
                    and $summary.pull_request_last_edited_at == (
                      if $last_edited_at == "null" then null else $last_edited_at end)
                  )
                  or
                  (
                    (
                      (($author != "lightning-it-release-automation[bot]"
                        and $author != "lightning-it-shared-assets-sync[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:copilot:v5:[1-9][0-9]*:"
                            + $base + ":" + $head + "$")))
                      or
                      (($repository == "lightning-it/.github"
                        and $author == "lightning-it-shared-assets-sync[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:ancestry-backmerge:v5:"
                            + "[1-9][0-9]*:" + $base + ":" + $head + "$")))
                    )
                    and $summary.pull_request_number == $pr_number
                  )
                )
              ' <<<"${neutral}" >/dev/null \
              || ! validate_neutral_producer; then
              echo "Existing neutral result is stale or malformed; canonical rerun required."
              require_failed_required_workflow
              neutral_count=0
            fi

          fi
          if [ "${neutral_count}" -eq 1 ]; then
            read -r owner name <<<"${REPOSITORY//\// }"
            # shellcheck disable=SC2016
            query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid reviewThreads(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{isResolved comments(first:100){pageInfo{hasNextPage} nodes{author{login} pullRequestReview{commit{oid}}}}}}}}}'
            thread_snapshot=''
            for thread_snapshot_attempt in 1 2; do
              threads='[]'
              after=''
              seen_thread_cursors='[]'
              while true; do
              args=(-f query="${query}" -F owner="${owner}" -F name="${name}" -F number="${PR_NUMBER}")
              if [ -n "${after}" ]; then args+=(-f after="${after}"); fi
              page="$(gh api graphql "${args[@]}")"
              if ! jq -e --arg head "${HEAD_SHA}" '
                (if has("errors") then ((.errors | type) == "array" and (.errors | length) == 0) else true end)
                and
                .data.repository.pullRequest.headRefOid == $head
                and
                (.data.repository.pullRequest.reviewThreads | type) == "object"
                and (.data.repository.pullRequest.reviewThreads.nodes | type) == "array"
                and (.data.repository.pullRequest.reviewThreads.pageInfo | type) == "object"
                and ((.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type) == "boolean")
                and (
                  .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false
                  or ((.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | type) == "string"
                    and (.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | length) > 0)
                )
                and all(.data.repository.pullRequest.reviewThreads.nodes[]?;
                  (type == "object")
                  and ((.isResolved | type) == "boolean")
                  and ((.comments | type) == "object")
                  and ((.comments.nodes | type) == "array")
                  and ((.comments.nodes | length) > 0)
                  and ((.comments.pageInfo | type) == "object")
                  and ((.comments.pageInfo.hasNextPage | type) == "boolean")
                  and all(.comments.nodes[]?;
                    (type == "object")
                    and ((.author | type) == "object")
                    and ((.author.login | type) == "string")
                    and ((.author.login | length) > 0)
                    and (.author.login | test("^[^[:space:]]+$"))
                    and ((.pullRequestReview | type) == "object")
                    and ((.pullRequestReview.commit | type) == "object")
                    and ((.pullRequestReview.commit.oid | type) == "string")
                    and (.pullRequestReview.commit.oid | test("^[0-9a-f]{40}$"))
                  )
                )
              ' <<<"${page}" >/dev/null; then
                echo "Review-thread evidence is malformed; refusing to preserve PASS." >&2
                require_failed_required_workflow
                exit 1
              fi
              page_threads="$(jq -cer '.data.repository.pullRequest.reviewThreads.nodes' <<<"${page}")"
              threads="$(jq -cer --argjson page "${page_threads}" '. + $page' <<<"${threads}")"
              has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"${page}")"
              case "${has_next}" in
                false) break ;;
                true)
                  next_after="$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor' <<<"${page}")"
                  if jq -e --arg next "${next_after}" --arg current "${after}" \
                    '($next == $current) or index($next)' <<<"${seen_thread_cursors}" >/dev/null; then
                    echo "Review-thread pagination cursor did not progress; refusing to preserve PASS." >&2
                    require_failed_required_workflow
                    exit 1
                  fi
                  seen_thread_cursors="$(jq -cer --arg next "${next_after}" '. + [$next]' <<<"${seen_thread_cursors}")"
                  after="${next_after}"
                  ;;
                *)
                  echo "Review-thread pagination state is malformed; refusing to preserve PASS." >&2
                  require_failed_required_workflow
                  exit 1
                  ;;
              esac
              done
              incomplete="$(jq '[.[] |
              select(.comments.pageInfo.hasNextPage == true)] | length' <<<"${threads}")"
              if [ "${incomplete}" -gt 0 ]; then
              echo "Review-thread comments exceed the verified page; refusing to preserve PASS." >&2
              require_failed_required_workflow
              exit 1
              fi
              unresolved="$(jq --arg head "${HEAD_SHA}" '[.[] |
              select(.isResolved == false) |
              select(any(.comments.nodes[];
                (.author.login == "copilot-pull-request-reviewer"
                  or .author.login == "copilot-pull-request-reviewer[bot]")
                and .pullRequestReview.commit.oid == $head))] | length' <<<"${threads}")"
              if [ "${unresolved}" -gt 0 ]; then
              echo "Current-head Copilot findings invalidate the neutral PASS." >&2
              require_failed_required_workflow
              exit 1
              fi
              observed_snapshot="$(jq -cS . <<<"${threads}" | sha256sum | cut -d' ' -f1)"
              [[ "${observed_snapshot}" =~ ^[0-9a-f]{64}$ ]]
              if [ "${thread_snapshot_attempt}" -eq 1 ]; then
                thread_snapshot="${observed_snapshot}"
                continue
              fi
              if [ "${observed_snapshot}" != "${thread_snapshot}" ]; then
                echo "Review-thread evidence changed between snapshots; refusing to preserve PASS." >&2
                require_failed_required_workflow
                exit 1
              fi
            done
            current_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            test "$(labels_sha256_from_pr "${current_pr}")" = "${PR_LABELS_SHA256}"
            test "$(read_metadata_revision)" = "${PR_LAST_EDITED_AT}"
            echo "The exact current-head neutral PASS remains valid; no rerun is needed."
            exit 0
          fi

          rerun_reason=''
          trigger_occurred_at=''
          EVIDENCE_COMMENT_AUTHOR=''
          if [ "${EVIDENCE_COMMENT_ID}" -gt 0 ]; then
            if ! has_live_write_permission "${GITHUB_ACTOR}"; then
              echo "Dispatch actor lacks current write permission." >&2
              exit 1
            fi
            comment="$(gh api \
              "repos/${REPOSITORY}/pulls/comments/${EVIDENCE_COMMENT_ID}")"
            EVIDENCE_COMMENT_CREATED_AT="$(jq -er \
              '.created_at | select(type == "string" and length > 0)' \
              <<<"${comment}")"
            EVIDENCE_COMMENT_AUTHOR="$(jq -er \
              '.user.login | select(type == "string" and length > 0)' \
              <<<"${comment}")"
            jq -e \
              --arg comment_author "${EVIDENCE_COMMENT_AUTHOR}" \
              --arg created_at "${EVIDENCE_COMMENT_CREATED_AT}" \
              --argjson comment_id "${EVIDENCE_COMMENT_ID}" '
                .id == $comment_id
                and .user.login == $comment_author
                and .user.type == "User"
                and .created_at == $created_at
                and .updated_at == $created_at
                and (.commit_id | type == "string"
                  and test("^[0-9a-f]{40}$"))
                and has("in_reply_to_id")
              ' <<<"${comment}" >/dev/null
            if ! has_live_write_permission "${EVIDENCE_COMMENT_AUTHOR}"; then
              echo "Evidence reply author lacks current write permission; no rerun is authorized."
              exit 0
            fi
            if ! jq -e \
                --arg head "${HEAD_SHA}" '
                  .commit_id == $head
                  and (.in_reply_to_id | type == "number" and . > 0)
                ' <<<"${comment}" >/dev/null; then
              echo "Review comment is not an exact current-head evidence reply; no rerun is authorized."
              exit 0
            fi
            parent_id="$(jq -er \
              '.in_reply_to_id | select(type == "number" and . > 0)' \
              <<<"${comment}")"
            parent="$(gh api \
              "repos/${REPOSITORY}/pulls/comments/${parent_id}")"
            jq -e \
              --argjson parent_id "${parent_id}" '
                .id == $parent_id
                and (.user.login | type == "string" and length > 0)
                and (.user.type | type == "string" and length > 0)
                and (.commit_id | type == "string"
                  and test("^[0-9a-f]{40}$"))
                and (.path | type == "string" and length > 0)
                and (.pull_request_review_id | type == "number" and . > 0)
              ' <<<"${parent}" >/dev/null
            if ! jq -e \
                --arg head "${HEAD_SHA}" \
                --arg path "$(jq -r .path <<<"${comment}")" '
                  (.user.login == "Copilot"
                    or .user.login == "copilot-pull-request-reviewer"
                    or .user.login == "copilot-pull-request-reviewer[bot]")
                  and .user.type == "Bot"
                  and .commit_id == $head
                  and .path == $path
                ' <<<"${parent}" >/dev/null; then
              echo "Review reply does not target an exact current-head Copilot finding; no rerun is authorized."
              exit 0
            fi
            PARENT_REVIEW_ID="$(jq -er \
              '.pull_request_review_id | select(type == "number" and . > 0)' \
              <<<"${parent}")"
            test "${PARENT_REVIEW_ID}" = "${REVIEW_ID}"

            read -r owner name <<<"${REPOSITORY//\// }"
            # shellcheck disable=SC2016
            resolved_query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid reviewThreads(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{isResolved comments(first:100){pageInfo{hasNextPage} nodes{databaseId author{login} pullRequestReview{databaseId commit{oid}}}}}}}}}'
            collect_resolved_threads() {
              local after='' arguments has_next next_after page page_threads
              local seen_thread_cursors='[]' collected_threads='[]'
              while true; do
                arguments=(-f query="${resolved_query}" -F owner="${owner}" \
                  -F name="${name}" -F number="${PR_NUMBER}")
                if [ -n "${after}" ]; then arguments+=(-f after="${after}"); fi
                if ! page="$(gh api graphql "${arguments[@]}")"; then
                  echo "Resolved review-thread API request failed; no rerun is authorized." >&2
                  return 1
                fi
                if ! jq -e --arg head "${HEAD_SHA}" \
                  '.data.repository.pullRequest.headRefOid == $head' \
                  <<<"${page}" >/dev/null; then
                  echo "Resolved review-thread head changed; no rerun is authorized." >&2
                  return 1
                fi
                if ! resolved_thread_page_is_valid "${page}"; then
                  echo "Resolved review-thread evidence is malformed; no rerun is authorized." >&2
                  return 1
                fi
                page_threads="$(jq -cer '.data.repository.pullRequest.reviewThreads.nodes' <<<"${page}")"
                collected_threads="$(jq -cer --argjson page "${page_threads}" '. + $page' <<<"${collected_threads}")"
                has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"${page}")"
                case "${has_next}" in
                  false) break ;;
                  true)
                    if ! next_resolved_thread_cursor \
                      "${page}" "${after}" "${seen_thread_cursors}"; then
                      return 1
                    fi
                    next_after="${RESOLVED_THREAD_NEXT_CURSOR}"
                    seen_thread_cursors="${RESOLVED_THREAD_SEEN_CURSORS}"
                    after="${next_after}"
                    ;;
                  *)
                    echo "Resolved review-thread pagination state is malformed; no rerun is authorized." >&2
                    return 1
                    ;;
                esac
              done
              if ! jq -e \
                'all(.[]; .comments.pageInfo.hasNextPage == false)' \
                <<<"${collected_threads}" >/dev/null; then
                echo "Resolved review-thread comments exceed the verified page; no rerun is authorized." >&2
                return 1
              fi
              printf '%s' "${collected_threads}"
            }
            resolved_thread_page_is_valid() {
              local page="$1"
              jq -e '
                (if has("errors") then ((.errors | type) == "array" and (.errors | length) == 0) else true end)
                and (.data.repository.pullRequest.reviewThreads | type) == "object"
                and (.data.repository.pullRequest.reviewThreads.nodes | type) == "array"
                and (.data.repository.pullRequest.reviewThreads.pageInfo | type) == "object"
                and ((.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type) == "boolean")
              ' <<<"${page}" >/dev/null || return 1
              jq -e '
                .data.repository.pullRequest.reviewThreads.pageInfo as $page_info
                | $page_info.hasNextPage == false
                  or (($page_info.endCursor | type) == "string"
                    and ($page_info.endCursor | length) > 0)
              ' <<<"${page}" >/dev/null || return 1
              jq -e '
                all(.data.repository.pullRequest.reviewThreads.nodes[]?;
                  (type == "object")
                  and ((.isResolved | type) == "boolean")
                  and ((.comments | type) == "object")
                  and ((.comments.nodes | type) == "array")
                  and ((.comments.nodes | length) > 0)
                  and ((.comments.pageInfo | type) == "object")
                  and ((.comments.pageInfo.hasNextPage | type) == "boolean")
                )
              ' <<<"${page}" >/dev/null || return 1
              jq -e '
                all(.data.repository.pullRequest.reviewThreads.nodes[]?.comments.nodes[]?;
                  (type == "object")
                  and ((.author | type) == "object")
                  and ((.author.login | type) == "string")
                  and ((.author.login | length) > 0)
                  and (.author.login | test("^[^[:space:]]+$"))
                  and ((.databaseId | type) == "number" and .databaseId > 0)
                  and ((.pullRequestReview | type) == "object")
                  and ((.pullRequestReview.databaseId | type) == "number"
                    and .pullRequestReview.databaseId > 0)
                  and ((.pullRequestReview.commit | type) == "object")
                  and ((.pullRequestReview.commit.oid | type) == "string")
                  and (.pullRequestReview.commit.oid | test("^[0-9a-f]{40}$"))
                )
              ' <<<"${page}" >/dev/null
            }
            next_resolved_thread_cursor() {
              local page="$1" after="$2" seen_thread_cursors="$3" next_after
              next_after="$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor' <<<"${page}")"
              if jq -e --arg next "${next_after}" --arg current "${after}" \
                '($next == $current) or index($next)' <<<"${seen_thread_cursors}" >/dev/null; then
                echo "Resolved review-thread pagination cursor did not progress; no rerun is authorized." >&2
                return 1
              fi
              RESOLVED_THREAD_NEXT_CURSOR="${next_after}"
              RESOLVED_THREAD_SEEN_CURSORS="$(jq -cer --arg next "${next_after}" '. + [$next]' <<<"${seen_thread_cursors}")"
            }
            threads="$(collect_resolved_threads)"
            if ! jq -e \
              --arg head "${HEAD_SHA}" \
              --argjson parent_id "${parent_id}" \
              --argjson review_id "${REVIEW_ID}" '
                ([.[] | select(any(.comments.nodes[];
                  .databaseId == $parent_id
                  and (.author.login == "Copilot"
                    or .author.login == "copilot-pull-request-reviewer"
                    or .author.login == "copilot-pull-request-reviewer[bot]")
                  and .pullRequestReview.databaseId == $review_id
                  and .pullRequestReview.commit.oid == $head))] | length) == 1
                and ([.[] | select(any(.comments.nodes[];
                  .databaseId == $parent_id)) | select(.isResolved == true)]
                  | length) == 1
                and ([.[] | select(.isResolved == false) |
                  select(any(.comments.nodes[];
                    (.author.login == "copilot-pull-request-reviewer"
                      or .author.login == "copilot-pull-request-reviewer[bot]")
                    and .pullRequestReview.commit.oid == $head))] | length) == 0
              ' <<<"${threads}" >/dev/null; then
              echo "Resolved-thread evidence is incomplete or non-authorizing; no rerun is authorized."
              exit 0
            fi
            RESOLVED_THREAD_SNAPSHOT="$(jq -cS . <<<"${threads}" \
              | sha256sum | cut -d' ' -f1)"
            [[ "${RESOLVED_THREAD_SNAPSHOT}" =~ ^[0-9a-f]{64}$ ]]
            rerun_reason=resolved-finding
            trigger_occurred_at="${EVIDENCE_COMMENT_CREATED_AT}"
          else
            if ! has_live_write_permission "${GITHUB_ACTOR}"; then
              echo "Dispatch actor lacks current write permission." >&2
              exit 1
            fi
            rerun_reason=manual-delayed-review
          fi

          test "${PR_AUTHOR}" != 'lightning-it-release-automation[bot]'
          test "${PR_AUTHOR}" != 'lightning-it-shared-assets-sync[bot]'
          [[ "${CONTROLLER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REVIEW_ID}" =~ ^[1-9][0-9]*$ ]]

          review_body_is_usable() {
            review_payload="$(cat)"
            review_comment_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/comments?per_page=100")"
            normalized_review_body="$(jq -ers --argjson review_id "${REVIEW_ID}" '
              .[0] as $review | .[1] as $pages |
              if (($review | type) == "object") and ($review | has("body"))
                and (($review.body == null) or (($review.body | type) == "string"))
                and (($pages | type) == "array")
                and (($pages | length) > 0)
                and all($pages[]?; type == "array")
                and all($pages[][]?;
                  (type == "object") and ((.body | type) == "string")
                  and .pull_request_review_id == $review_id)
              then ([($review.body // "")] + [$pages[][]? | .body]
                | map(
                    ascii_downcase
                    | gsub("can[\u0027\u2019]t"; "cannot") | gsub("n[\u0027\u2019]t"; " not")
                    | gsub("\\p{White_Space}"; "")
                  )) as $parts
                | if any($parts[]; length > 0) then ($parts | join("|"))
                  else error("review content is empty") end
              else error("review body or inline comments are malformed")
              end
            ' <(printf '%s\n' "${review_payload}") \
              <(printf '%s\n' "${review_comment_pages}"))"
            case "${normalized_review_body}" in
              *unabletoreviewthispullrequest*|*cannotreviewthispullrequest*|*notabletoreviewthispullrequest*|*nofilestoreview*|*nofileswerereviewed*|*notabletoreviewanyfiles*|*unabletoreviewanyfiles*|*cannotreviewanyfiles*|*quotaexhausted*|*quotaexceeded*|*premiumrequestquota*|*premiumrequestsquota*|*suppressedcomment*|*encounteredanerror*)
                return 1
                ;;
            esac
          }

          bound_review_is_usable() {
            bound_review="$(cat)"
            jq -e \
              --arg head "${HEAD_SHA}" \
              --arg submitted "${REVIEW_SUBMITTED_AT}" \
              --argjson review_id "${REVIEW_ID}" '
                .id == $review_id
                and .commit_id == $head
                and .submitted_at == $submitted
                and (.user.login == "copilot-pull-request-reviewer"
                  or .user.login == "copilot-pull-request-reviewer[bot]")
                and .user.type == "Bot"
                and (.state == "COMMENTED" or .state == "APPROVED")
              ' <<<"${bound_review}" >/dev/null
            review_body_is_usable <<<"${bound_review}"
          }

          review_pages_are_well_formed() {
            jq -e '
              (type == "array") and all(.[]?; type == "array")
              and all(.[][]?;
                (type == "object")
                and ((.id | type) == "number") and (.id > 0)
                and ((.node_id | type) == "string") and (.node_id | length) > 0
                and ((.user | type) == "object")
                and ((.user.login | type) == "string")
                and ((.user.login | length) > 0)
                and (.user.login | test("^[^[:space:]]+$"))
                and ((.commit_id | type) == "string")
                and (.commit_id | test("^[0-9a-f]{40}$"))
                and ((.state | type) == "string")
                and (.state == "PENDING" or .state == "COMMENTED"
                  or .state == "APPROVED" or .state == "CHANGES_REQUESTED"
                  or .state == "DISMISSED")
                and has("body")
                and (.body == null or ((.body | type) == "string")))
            ' >/dev/null
          }

          read_bound_review() {
            for review_attempt in $(seq 1 10); do
              if ! pages="$(gh api --paginate --slurp \
                  "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then
                pages=''
              elif ! review_pages_are_well_formed <<<"${pages}"; then
                echo "REST review collection is malformed; no rerun is authorized." >&2
                return 1
              else
                matches="$(jq -c --arg head "${HEAD_SHA}" '
                  [.[][] | select(.commit_id == $head)
                    | select(.user.login == "copilot-pull-request-reviewer"
                      or .user.login == "copilot-pull-request-reviewer[bot]")]
                  ' <<<"${pages}")"
                count="$(jq 'length' <<<"${matches}")"
                if [ "${count}" -eq 1 ]; then
                  test "$(jq -er '.[0].id' <<<"${matches}")" = "${REVIEW_ID}"
                  gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}"
                  return
                elif [ "${count}" -gt 1 ]; then
                  echo "Multiple current-head Copilot reviews; no rerun is authorized." >&2
                  return 1
                fi
              fi
              if [ "${review_attempt}" -eq 10 ]; then
                echo "The bound Copilot review did not converge in the REST API." >&2
                return 1
              fi
              sleep 3
            done
          }

          review="$(read_bound_review)"
          REVIEW_SUBMITTED_AT="$(jq -er \
            '.submitted_at | select(type == "string" and length > 0)' \
            <<<"${review}")"
          bound_review_is_usable <<<"${review}"
          if [ "${rerun_reason}" = manual-delayed-review ]; then
            trigger_occurred_at="${REVIEW_SUBMITTED_AT}"
          fi
          test -n "${trigger_occurred_at}"
          remediation_run_id=0
          remediation_marker_created_at=''
          scope_marker="<!-- rep60-copilot-rereview-scope/v2 repository=${REPOSITORY} pr=${PR_NUMBER} head=${HEAD_SHA} -->"
          issue_comments="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          marker_comments="$(jq -c \
            --arg issue_url "${GITHUB_API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}" \
            --arg scope "${scope_marker}" '
              [add[]? |
                select(.user.login == "github-actions[bot]"
                  and .user.type == "Bot") |
                select(.issue_url == $issue_url) |
                select(.created_at == .updated_at) |
                select((.body | split("\n"))[0] == $scope)]
            ' <<<"${issue_comments}")"
          marker_count="$(jq 'length' <<<"${marker_comments}")"
          test "${marker_count}" -le 1
          if [ "${marker_count}" -eq 1 ]; then
            test "${PR_AUTHOR}" = litroc
            marker_comment="$(jq -c '.[0]' <<<"${marker_comments}")"
            marker_body="$(jq -er .body <<<"${marker_comment}")"
            remediation_marker_created_at="$(jq -er .created_at \
              <<<"${marker_comment}")"
            evidence_pattern="^<!-- rep60-copilot-rereview-evidence/v2 repository=${REPOSITORY} pr=${PR_NUMBER} base_ref=${PR_BASE_REF} base=${BASE_SHA} head=${HEAD_SHA} run=(?<run>[1-9][0-9]*) controller=(?<controller>[0-9a-f]{40}) round=1 state=consumed -->$"
            marker_evidence="$(jq -er \
              --arg pattern "${evidence_pattern}" \
              --arg scope "${scope_marker}" '
                (split("\n")) as $lines
                | select(($lines | length) == 2 and $lines[0] == $scope)
                | $lines[1] | capture($pattern)
              ' <<<"${marker_body}")"
            remediation_run_id="$(jq -er '.run | tonumber | select(. > 0)' \
              <<<"${marker_evidence}")"
            remediation_controller="$(jq -er .controller \
              <<<"${marker_evidence}")"
            test "${remediation_controller}" = "${BASE_SHA}"
            remediation_run="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${remediation_run_id}")"
            expected_remediation_title="REP-60 Copilot rereview PR #${PR_NUMBER} head ${HEAD_SHA} round 1"
            jq -e \
              --arg actor "${PR_AUTHOR}" \
              --arg branch "${PR_BASE_REF}" \
              --arg controller "${remediation_controller}" \
              --arg repository "${REPOSITORY}" \
              --arg title "${expected_remediation_title}" \
              --argjson run_id "${remediation_run_id}" '
                .id == $run_id
                and .event == "workflow_dispatch"
                and .path == ".github/workflows/codex-copilot-remediation.yml"
                and .name == "Codex Copilot remediation"
                and .display_title == $title
                and .head_branch == $branch
                and .head_sha == $controller
                and .repository.full_name == $repository
                and (.pull_requests | length) == 0
                and .run_attempt == 1
                and .status == "completed"
                and .conclusion == "success"
                and .actor.login == $actor
                and .triggering_actor.login == $actor
              ' <<<"${remediation_run}" >/dev/null
            remediation_created_at="$(jq -er .created_at \
              <<<"${remediation_run}")"
            remediation_updated_at="$(jq -er .updated_at \
              <<<"${remediation_run}")"
            test "$(date -u -d "${remediation_marker_created_at}" +%s)" -ge \
              "$(date -u -d "${remediation_created_at}" +%s)"
            test "$(date -u -d "${remediation_marker_created_at}" +%s)" -le \
              "$(date -u -d "${remediation_updated_at}" +%s)"
            test "$(date -u -d "${REVIEW_SUBMITTED_AT}" +%s)" -ge \
              "$(date -u -d "${remediation_marker_created_at}" +%s)"
            remediation_jobs="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs/${remediation_run_id}/attempts/1/jobs?filter=all&per_page=100")"
            jq -e --arg controller "${remediation_controller}" '
              [.[].jobs[]? |
                select(.name == "continue-after-push") |
                select(.run_attempt == 1 and .head_sha == $controller) |
                select(.status == "completed" and .conclusion == "success") |
                select((.runner_name | type) == "string"
                  and (.runner_name | length) > 0)]
              | length == 1
            ' <<<"${remediation_jobs}" >/dev/null
          fi

          for attempt in $(seq 1 10); do
            response="$(gh api "${runs_url}?event=pull_request_target&head_sha=${HEAD_SHA}&per_page=100")"
            run="$(
              jq -c --arg head_sha "${HEAD_SHA}" --argjson pr "${PR_NUMBER}" '
                [
                  .workflow_runs[]?
                  | select(.head_sha == $head_sha)
                  | select(.path == ".github/workflows/copilot-review.yml")
                  | select(any(.pull_requests[]?; .number == $pr))
                ]
                | sort_by(.run_number)
                | reverse
                | .[0] // empty
              ' <<<"${response}"
            )"

            if [ -n "${run}" ]; then
              producer_run_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${run}")"
              status="$(jq -er '.status | select(type == "string" and length > 0)' <<<"${run}")"
              if [ "${status}" != completed ]; then
                echo "Canonical Copilot gate ${producer_run_id} is ${status}; its polling loop will observe the review event."
                exit 0
              fi
              jq -e \
                --arg author "${PR_AUTHOR}" \
                --arg base_ref "${PR_BASE_REF}" \
                --arg base_sha "${BASE_SHA}" \
                --arg head "${HEAD_SHA}" \
                --arg head_ref "${PR_HEAD_REF}" \
                --arg head_repository "${PR_HEAD_REPOSITORY}" \
                --arg repository "${REPOSITORY}" \
                --argjson pr "${PR_NUMBER}" '
                  .event == "pull_request_target"
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_sha == $head
                  and .head_branch == $head_ref
                  and .repository.full_name == $repository
                  and .head_repository.full_name == $head_repository
                  and (.pull_requests | length) == 1
                  and .pull_requests[0].number == $pr
                  and .pull_requests[0].base.ref == $base_ref
                  and .pull_requests[0].base.sha == $base_sha
                  and .pull_requests[0].head.ref == $head_ref
                  and .pull_requests[0].head.sha == $head
                  and .actor.login == $author
                  and .triggering_actor.login == $author
                ' <<<"${run}" >/dev/null
              break
            fi

            echo "Canonical gate not visible yet (attempt ${attempt}/10)."
            sleep 6
          done

          test -n "${producer_run_id:-}"
          attempt_one_jobs="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${producer_run_id}/attempts/1/jobs?filter=all&per_page=100")"
          request_jobs="$(jq -c '
            [.[].jobs[]? |
              select(.name == "Request Copilot review for current revision") |
              select(.run_attempt == 1 and .status == "completed")]
          ' <<<"${attempt_one_jobs}")"
          test "$(jq 'length' <<<"${request_jobs}")" -eq 1
          request_conclusion="$(jq -er \
            '.[0].conclusion | select(. == "success" or . == "skipped")' \
            <<<"${request_jobs}")"
          verifier_jobs="$(jq -c '
            [.[].jobs[]? |
              select(.name == "Verify current revision policy") |
              select(.run_attempt == 1 and .status == "completed"
                and .conclusion == "failure")]
          ' <<<"${attempt_one_jobs}")"
          test "$(jq 'length' <<<"${verifier_jobs}")" -eq 1
          verifier_job_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' \
            <<<"${verifier_jobs}")"
          first_verifier_completed_at="$(jq -er \
            '.[0].completed_at | select(type == "string" and length > 0)' \
            <<<"${verifier_jobs}")"
          test "$(date -u -d "${trigger_occurred_at}" +%s)" -gt \
            "$(date -u -d "${first_verifier_completed_at}" +%s)"

          timeline="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline?per_page=100")"
          producer_created_at="$(jq -er \
            '.created_at | select(type == "string" and length > 0)' <<<"${run}")"
          request_window_start="${producer_created_at}"
          request_provenance_run_id="${producer_run_id}"
          if [ "${request_conclusion}" = success ]; then
            test "${remediation_run_id}" -eq 0
            expected_request_actor='github-actions[bot]'
          elif [ "${PR_AUTHOR}" != litroc ]; then
            test "${remediation_run_id}" -eq 0
            expected_request_actor="${PR_AUTHOR}"
          else
            test "${remediation_run_id}" -gt 0
            test -n "${remediation_marker_created_at}"
            expected_request_actor='github-actions[bot]'
            request_window_start="${remediation_marker_created_at}"
            request_provenance_run_id="${remediation_run_id}"
            rerun_reason=correction-rereview
          fi
          jq -e \
            --arg actor "${expected_request_actor}" \
            --arg request_window_start "${request_window_start}" \
            --arg review_submitted_at "${REVIEW_SUBMITTED_AT}" '
              [add[]? |
                select(.event == "review_requested") |
                select(.actor.login == $actor) |
                select(.requested_reviewer.login == "Copilot") |
                select(.created_at >= $request_window_start) |
                select(.created_at <= $review_submitted_at)]
              | length == 1
            ' <<<"${timeline}" >/dev/null

          current_review="$(read_bound_review)"
          bound_review_is_usable <<<"${current_review}"
          current_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(labels_sha256_from_pr "${current_pr}")" = "${PR_LABELS_SHA256}"
          test "$(read_metadata_revision)" = "${PR_LAST_EDITED_AT}"
          current_default="$(gh api \
            "repos/${REPOSITORY}/branches/${default_branch}")"
          jq -e --arg head "${CONTROLLER_SHA}" '
            .protected == true and .commit.sha == $head
          ' <<<"${current_default}" >/dev/null
          final_rerun_review_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          review_pages_are_well_formed <<<"${final_rerun_review_pages}"
          final_rerun_current_head_reviews="$(jq -ce --arg head "${HEAD_SHA}" '
            [.[][] | select(.commit_id == $head)
              | select(.user.login == "copilot-pull-request-reviewer"
                or .user.login == "copilot-pull-request-reviewer[bot]")]
            ' <<<"${final_rerun_review_pages}")"
          jq -e --argjson review_id "${REVIEW_ID}" \
            'length == 1 and .[0].id == $review_id' \
            <<<"${final_rerun_current_head_reviews}" >/dev/null
          current_review="$(gh api \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}")"
          bound_review_is_usable <<<"${current_review}"
          if [ "${EVIDENCE_COMMENT_ID}" -gt 0 ] \
            && ! has_live_write_permission "${EVIDENCE_COMMENT_AUTHOR}"; then
            echo "Evidence reply author lost current write permission before verifier rerun." >&2
            exit 1
          fi
          if ! has_live_write_permission "${GITHUB_ACTOR}"; then
            echo "Dispatch actor lost current write permission before verifier rerun." >&2
            exit 1
          fi
          if [ "${EVIDENCE_COMMENT_ID}" -gt 0 ]; then
            final_resolved_threads="$(collect_resolved_threads)"
            final_resolved_snapshot="$(jq -cS . <<<"${final_resolved_threads}" \
              | sha256sum | cut -d' ' -f1)"
            [[ "${final_resolved_snapshot}" =~ ^[0-9a-f]{64}$ ]]
            if [ "${final_resolved_snapshot}" != "${RESOLVED_THREAD_SNAPSHOT}" ]; then
              echo "Resolved review-thread evidence changed before verifier rerun; no rerun is authorized." >&2
              exit 1
            fi
          fi
          gh api --method POST \
            "repos/${REPOSITORY}/actions/jobs/${verifier_job_id}/rerun" >/dev/null
          rerun_observed=false
          for attempt in $(seq 1 30); do
            producer_after="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            if jq -e '
                .run_attempt == 2
                and (.status == "queued"
                  or .status == "in_progress"
                  or .status == "completed")
              ' <<<"${producer_after}" >/dev/null; then
              rerun_observed=true
              break
            fi
            sleep 2
          done
          test "${rerun_observed}" = true
          {
            echo '### Protected verifier-only re-evaluation'
            echo
            echo "- PR: ${PR_NUMBER}"
            echo "- Base: ${BASE_SHA}"
            echo "- Head: ${HEAD_SHA}"
            echo "- Review: ${REVIEW_ID}"
            echo "- Producer run: ${producer_run_id}"
            echo "- Request provenance run: ${request_provenance_run_id}"
            echo "- Reason: ${rerun_reason}"
            echo "- Mutation: verifier job ${verifier_job_id} rerun only"
            echo '- AI request: none'
            echo '- Check mutation: none'
          } >>"${GITHUB_STEP_SUMMARY}"
