# Repository-owned, temporary REP-60 bootstrap controller.
# Remove after the neutral Current revision review ruleset is live.
# yamllint disable rule:truthy rule:line-length
---
name: REP-60 protected bootstrap review alias

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rep60-bootstrap-review-alias-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-protected-alias:
    # Native protected alias. Never add a job-level condition: GitHub reports
    # a skipped required job as success. The main-branch trigger and the live
    # verifier below admit only the exact protected develop promotion.
    name: Successful Copilot review
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify exact protected review and publish legacy alias
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          protected_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${DEFAULT_BRANCH}" = develop
          # GitHub defines pull_request_target's GITHUB_SHA/GITHUB_REF as the
          # current default-branch revision/ref, including for PRs into main.
          test "${WORKFLOW_REF}" = \
            "${REPOSITORY}/.github/workflows/rep60-bootstrap-protected-review-alias.yml@refs/heads/${DEFAULT_BRANCH}"
          test "$(gh api "repos/${REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)" = \
            "${WORKFLOW_SHA}"
          protected_run="$(gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e \
            --arg default_branch "${DEFAULT_BRANCH}" \
            --arg repository "${REPOSITORY}" \
            --arg run_url "${protected_run_url}" \
            --arg sha "${WORKFLOW_SHA}" \
            --argjson attempt "${GITHUB_RUN_ATTEMPT}" '
              .event == "pull_request_target"
              and .name == "REP-60 protected bootstrap review alias"
              and .path == ".github/workflows/rep60-bootstrap-protected-review-alias.yml"
              and .head_branch == $default_branch
              and .head_sha == $sha
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .html_url == $run_url
              and .run_attempt == $attempt
            ' <<<"${protected_run}" >/dev/null

          live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg base_ref "${EVENT_BASE_REF}" \
            --arg head "${EVENT_HEAD}" \
            --arg head_ref "${EVENT_HEAD_REF}" \
            --arg repository "${REPOSITORY}" \
            --arg title "${EVENT_TITLE}" '
              .state == "open"
              and .draft == false
              and .user.login == "litroc"
              and .base.sha == $base
              and .base.ref == $base_ref
              and .base.repo.full_name == $repository
              and .head.sha == $head
              and .head.ref == $head_ref
              and .head.repo.full_name == $repository
              and .title == $title
            ' <<<"${live_pr}" >/dev/null

          test "${EVENT_BASE_REF}" = main
          test "${EVENT_HEAD_REF}" = develop
          test "${EVENT_TITLE}" = 'chore(release): promote develop to main'
          # The protected controller and the promotion head are both the
          # exact live default-branch revision in this bounded path.
          test "${WORKFLOW_SHA}" = "${EVENT_HEAD}"
          test "$(gh api "repos/${REPOSITORY}/branches/develop" --jq .commit.sha)" = "${EVENT_HEAD}"
          test "$(gh api "repos/${REPOSITORY}/branches/main" --jq .commit.sha)" = "${EVENT_BASE}"
          comparison="$(gh api "repos/${REPOSITORY}/compare/${EVENT_BASE}...${EVENT_HEAD}")"
          jq -e \
            --arg base "${EVENT_BASE}" '
              .status == "ahead"
              and .behind_by == 0
              and .ahead_by > 0
              and .merge_base_commit.sha == $base
            ' <<<"${comparison}" >/dev/null

          review_complete=false
          for attempt in $(seq 1 40); do
            reviews="$(
              gh api --paginate --slurp \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100"
            )"
            accepted_reviews="$(
              jq \
                --arg head "${EVENT_HEAD}" '
                  def normalized:
                    ascii_downcase
                    | gsub("wasn[\u0027\u2019]t"; "was not")
                    | gsub("\\s"; "");
                  [
                    .[][]
                    | select(
                        (.user.login == "copilot-pull-request-reviewer[bot]"
                         or .user.login == "copilot-pull-request-reviewer")
                        and .commit_id == $head
                        and (.state == "COMMENTED" or .state == "APPROVED")
                        and ((.body // "") | gsub("\\s"; "") | length > 0)
                        and (((.body // "") | normalized | contains("wasnotabletoreviewanyfiles")) | not)
                        and (((.body // "") | normalized | contains("unabletoreviewthispullrequest")) | not)
                        and (((.body // "") | normalized | contains("quotaexhausted")) | not)
                        and (((.body // "") | normalized | contains("quotaexceeded")) | not)
                      )
                  ] | length
                ' <<<"${reviews}"
            )"
            if [ "${accepted_reviews}" -gt 0 ]; then
              review_complete=true
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              echo "No acceptable Copilot review exists for exact head ${EVENT_HEAD}." >&2
              false
            fi
            sleep 15
          done
          test "${review_complete}" = true

          read -r -d '' thread_query <<'GRAPHQL' || true
          query($owner:String!,$repository:String!,$number:Int!,$after:String) {
            repository(owner:$owner,name:$repository) {
              pullRequest(number:$number) {
                headRefOid
                reviewThreads(first:100,after:$after) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    comments(first:1) { nodes { author { login } } }
                  }
                }
              }
            }
          }
          GRAPHQL

          owner="${REPOSITORY%%/*}"
          repository="${REPOSITORY#*/}"
          after=""
          unresolved=0
          while true; do
            arguments=(
              -f query="${thread_query}"
              -F owner="${owner}"
              -F repository="${repository}"
              -F number="${PR_NUMBER}"
            )
            if [ -n "${after}" ]; then
              arguments+=(-f after="${after}")
            fi
            response="$(gh api graphql "${arguments[@]}")"
            jq -e --arg head "${EVENT_HEAD}" \
              '.data.repository.pullRequest.headRefOid == $head' \
              <<<"${response}" >/dev/null
            page_unresolved="$(
              jq '
                [
                  .data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false)
                  | select(
                      .comments.nodes[0].author.login == "copilot-pull-request-reviewer[bot]"
                      or .comments.nodes[0].author.login == "copilot-pull-request-reviewer"
                    )
                ] | length
              ' <<<"${response}"
            )"
            unresolved=$((unresolved + page_unresolved))
            has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"${response}")"
            if [ "${has_next}" != true ]; then
              break
            fi
            after="$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | select(type == "string" and length > 0)' <<<"${response}")"
          done
          test "${unresolved}" -eq 0

          post_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .draft == false
              and .user.login == "litroc"
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and .head.sha == $head
              and .head.repo.full_name == $repository
            ' <<<"${post_pr}" >/dev/null

          echo "Protected bootstrap alias accepted exact head ${EVENT_HEAD} in run ${protected_run_url}."
