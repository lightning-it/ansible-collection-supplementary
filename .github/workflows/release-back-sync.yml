# yamllint disable rule:truthy
---
name: Back-sync collection release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to back-sync, for example v1.2.3.
        required: true
      release_tag_app_slug:
        description: Exact GitHub App slug validated by the protected publish job.
        required: true
      release_tag_app_id:
        description: Exact GitHub App ID validated by the protected publish job.
        required: true
      release_tag_app_client_id:
        description: Exact GitHub App client ID validated by the protected publish job.
        required: true
      security_evidence_id:
        description: Exact MLX-90 Evidence ID; release automation only.
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-develop-transition-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security-classification:
    name: Classify exact back-sync request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      security-release: ${{ steps.classify.outputs.security_release }}
      security-evidence-id: ${{ steps.classify.outputs.security_evidence_id }}
      security-version: ${{ steps.classify.outputs.security_version }}
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable pre-consumption binding base
        id: binding
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          receipt=changelogs/release-preparation.json
          test -f "$receipt"
          test ! -L "$receipt"
          version="${TAG_INPUT#v}"
          base_sha="$(
            jq -er --arg version "$version" '
              select(.next_version == $version)
              | .base_sha
              | select(test("^[0-9a-f]{40}$"))
            ' "$receipt"
          )"
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
      - name: Checkout immutable pre-consumption Security binding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.binding.outputs.base_sha }}
          path: security-binding-base
          persist-credentials: false
      - name: Verify tag-shaped input and classify before environment selection
        id: classify
        env:
          EVIDENCE_ID: ${{ inputs.security_evidence_id || '' }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG_INPUT" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::A stable semantic v-prefixed release tag is required."
            exit 1
          fi
          python scripts/classify-security-release.py \
            --event-kind version \
            --version "${TAG_INPUT#v}" \
            --evidence-id "$EVIDENCE_ID" \
            --binding-root security-binding-base

  back-sync:
    name: Open release back-sync PR
    needs: security-classification
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.security-classification.outputs.security-release == 'false' ||
       (needs.security-classification.outputs.security-release == 'true' &&
        github.actor == 'lightning-it-release-automation[bot]'))
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{ needs.security-classification.outputs.security-release == 'true' &&
            'mlx90-security-release-prepare' ||
            'ansible-collection-release-prepare' }}

    steps:
      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve release automation App bot identity
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D" 2>/dev/null || printf '{}')"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          if [ "$login" != "${APP_SLUG}[bot]" ] || ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the release automation App bot identity."
            exit 1
          fi
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          token: ${{ steps.release-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Open or update release back-sync PR
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          EXPECTED_TAG_APP_SLUG: ${{ github.event.inputs.release_tag_app_slug }}
          EXPECTED_TAG_APP_ID: ${{ github.event.inputs.release_tag_app_id }}
          EXPECTED_TAG_APP_CLIENT_ID: ${{ github.event.inputs.release_tag_app_client_id }}
          REPO: ${{ github.repository }}
          SECURITY_EVIDENCE_ID: ${{ needs.security-classification.outputs.security-evidence-id }}
          SECURITY_RELEASE: ${{ needs.security-classification.outputs.security-release }}
          SECURITY_VERSION: ${{ needs.security-classification.outputs.security-version }}
          WORKFLOW_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          authenticated_push() {
            GH_TOKEN="$GH_TOKEN" git -c credential.helper= \
              -c 'credential.helper=!gh auth git-credential' \
              push "$@"
          }

          tag="${TAG_INPUT:-}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A semantic v-prefixed release tag is required."
            exit 1
          fi
          [[ "$EXPECTED_TAG_APP_SLUG" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$ ]]
          [[ "$EXPECTED_TAG_APP_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_TAG_APP_CLIENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          test "$EXPECTED_TAG_APP_SLUG" = "lightning-it-release-tag-creator"
          test "$EXPECTED_TAG_APP_ID" = "4344269"
          test "$EXPECTED_TAG_APP_CLIENT_ID" = "Iv23liJnnvOQwajan2Mf"

          if ! git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "develop branch does not exist; skipping release back-sync."
            exit 0
          fi

          git config user.name "${{ steps.release-bot.outputs.login }}"
          git config user.email "${{ steps.release-bot.outputs.email }}"
          git fetch origin main develop

          remote_tag="$(
            git ls-remote --tags origin "refs/tags/${tag}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$remote_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The requested release tag does not exist as an immutable object."
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/${tag}"
          test "$(git cat-file -t FETCH_HEAD)" = tag
          release_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$(git cat-file -t "$release_sha")" = commit
          git merge-base --is-ancestor "$release_sha" origin/main

          tag_payload="$RUNNER_TEMP/release-back-sync-tag.txt"
          git cat-file tag FETCH_HEAD > "$tag_payload"
          tagger_identity="$(
            TAG_PAYLOAD="$tag_payload" RELEASE_SHA="$release_sha" RELEASE_TAG="$tag" \
              python - <<'PY'
          import os
          import re
          from pathlib import Path

          payload = Path(os.environ["TAG_PAYLOAD"]).read_text(encoding="utf-8")
          headers, separator, message = payload.partition("\n\n")
          if not separator:
              raise SystemExit("release tag has no annotation")
          expected = {
              f"object {os.environ['RELEASE_SHA']}",
              "type commit",
              f"tag {os.environ['RELEASE_TAG']}",
          }
          lines = headers.splitlines()
          if not expected.issubset(set(lines)):
              raise SystemExit("release tag identity differs from its resolved commit")
          taggers = [line for line in lines if line.startswith("tagger ")]
          if len(taggers) != 1:
              raise SystemExit("release tag has an unauthorized tagger identity")
          match = re.fullmatch(
              r"tagger (?P<slug>[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)\[bot\] "
              r"<(?P<id>[1-9][0-9]*)\+(?P=slug)\[bot\]@users\.noreply\.github\.com> "
              r"[0-9]+ [+-][0-9]{4}",
              taggers[0],
          )
          if match is None:
              raise SystemExit("release tag has an unauthorized GitHub App tagger identity")
          if message.rstrip("\n") != f"Release {os.environ['RELEASE_TAG']}":
              raise SystemExit("release tag annotation differs")
          print(f"{match.group('slug')}\t{match.group('id')}")
          PY
          )"
          IFS=$'\t' read -r tagger_app_slug tagger_bot_id <<< "$tagger_identity"
          test -n "$tagger_app_slug"
          [[ "$tagger_bot_id" =~ ^[1-9][0-9]*$ ]]
          test "$tagger_app_slug" = "$EXPECTED_TAG_APP_SLUG"

          tagger_bot="$RUNNER_TEMP/release-back-sync-tagger-bot.json"
          gh api "/users/${tagger_app_slug}[bot]" > "$tagger_bot"
          jq -e \
            --argjson bot_id "$tagger_bot_id" \
            --arg login "${tagger_app_slug}[bot]" '
              .id == $bot_id and .login == $login and .type == "Bot"
            ' "$tagger_bot" >/dev/null

          tagged_galaxy="$RUNNER_TEMP/release-back-sync-galaxy.yml"
          git show "${release_sha}:galaxy.yml" > "$tagged_galaxy"
          tagged_version="$(TAGGED_GALAXY="$tagged_galaxy" python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path(os.environ["TAGGED_GALAXY"]).read_text(encoding="utf-8")
          match = re.search(r"(?m)^version:\s*[\"']?([^\s\"']+)", text)
          print(match.group(1) if match else "")
          PY
          )"
          test "$tag" = "v${tagged_version}"
          if [ "$SECURITY_RELEASE" = true ]; then
            test "$WORKFLOW_ACTOR" = 'lightning-it-release-automation[bot]'
            test "$SECURITY_VERSION" = "$tagged_version"
            [[ "$SECURITY_EVIDENCE_ID" =~ ^MLX90-[A-Z0-9][A-Z0-9._-]{2,127}$ ]]
          else
            test "$SECURITY_RELEASE" = false
            test -z "$SECURITY_VERSION"
            test -z "$SECURITY_EVIDENCE_ID"
          fi

          if git merge-base --is-ancestor "$release_sha" origin/develop; then
            echo "develop already contains the tagged release; release back-sync not needed."
            exit 0
          fi

          branch="backsync/release-${tag}-to-develop"
          branch_ref="refs/heads/${branch}"
          remote_branch_sha="$(
            git ls-remote --heads origin "$branch_ref" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [ -n "$remote_branch_sha" ] && \
              ! [[ "$remote_branch_sha" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "::error::Could not resolve a trustworthy back-sync branch lease."
            exit 1
          fi
          title="chore: sync ${tag} release back to develop"
          body="Release back-sync of \`${tag}\` (\`${release_sha}\`) to \`develop\`."$'\n\n'
          body+=$'This PR brings release-generated files, changelog metadata, '
          body+=$'and `galaxy.yml` version changes back to `develop` after '
          body+="\`${tag}\` was published.\n\n"
          body+=$'Merge this PR with a merge commit, not squash or rebase, '
          body+=$'so the exact tagged release becomes an ancestor of `develop`.'
          if [ "$SECURITY_RELEASE" = true ]; then
            body+=$'\n\nEvidence-bound MLX-90 Security back-sync: `'
            body+="${SECURITY_EVIDENCE_ID}"
            body+=$'`; human actions in the successful path: `0`.'
          fi

          git switch -C "$branch" origin/develop
          git merge --no-ff -X ours "$release_sha" \
            -m "chore: sync ${tag} release back to develop"

          release_paths=(
            CHANGELOG.rst
            changelogs/.plugin-cache.yaml
            changelogs/changelog.yaml
            changelogs/release-preparation.json
            galaxy.yml
          )
          if [ "$SECURITY_RELEASE" = true ]; then
            security_metadata=".lit/security-releases/${SECURITY_VERSION}.json"
            security_receipt=".lit/security-release-intakes/${SECURITY_VERSION}.json"
            git cat-file -e "${release_sha}:${security_metadata}"
            git cat-file -e "${release_sha}:${security_receipt}"
            release_paths+=("$security_metadata" "$security_receipt")
          fi
          for path in "${release_paths[@]}"; do
            if git cat-file -e "${release_sha}:${path}" 2>/dev/null; then
              git checkout "$release_sha" -- "$path"
            else
              rm -f "$path"
            fi
          done

          release_base="$(git rev-parse "${release_sha}^1")"
          git diff --name-only --diff-filter=D \
            "$release_base" "$release_sha" -- changelogs/fragments/ \
            | xargs -r rm -f

          git add -A -- "${release_paths[@]}" changelogs/fragments/
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if git diff --quiet origin/develop...HEAD; then
            echo "No release back-sync changes to push."
            exit 0
          fi

          pushed_sha="$(git rev-parse HEAD)"
          if [ -n "$remote_branch_sha" ]; then
            git fetch --no-tags origin "$branch_ref"
            test "$(git rev-parse FETCH_HEAD)" = "$remote_branch_sha"
            git switch --detach "$remote_branch_sha"
            pushed_sha="$remote_branch_sha"
          fi

          current_develop="$(git rev-parse origin/develop)"
          back_sync_policy="$RUNNER_TEMP/release-back-sync-policy"
          test ! -e "$back_sync_policy"
          git worktree add --detach "$back_sync_policy" "$release_sha"
          python "$back_sync_policy/scripts/verify_release_back_sync.py" \
            --root "$GITHUB_WORKSPACE" \
            --develop-tip "$current_develop" \
            --release-sha "$release_sha" \
            --head-sha "$pushed_sha" \
            --tag "$tag" \
            --security-version "$SECURITY_VERSION" \
            --evidence-id "$SECURITY_EVIDENCE_ID"
          git worktree remove "$back_sync_policy"

          if [ -z "$remote_branch_sha" ]; then
            if ! authenticated_push origin "HEAD:${branch_ref}"; then
              echo "::error::Release back-sync branch appeared concurrently; refusing to overwrite it."
              exit 1
            fi
            test "$(git ls-remote origin "$branch_ref" | awk '{print $1}')" = \
              "$pushed_sha"
          else
            echo "Reusing the already verified immutable back-sync head ${pushed_sha}."
          fi

          owned_pulls="$(
            gh api --method GET "repos/${REPO}/pulls" \
              -f state=open \
              -f base=develop \
              -f "head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
              -f per_page=100
          )"
          owned_count="$(jq 'length' <<< "$owned_pulls")"
          if [ "$owned_count" -gt 1 ]; then
            echo "::error::Multiple same-repository back-sync PRs exist."
            exit 1
          fi
          if [ "$owned_count" -eq 0 ]; then
            gh pr create \
                --repo "$REPO" \
                --base develop \
                --head "$branch" \
                --draft \
                --title "$title" \
                --body "$body"
          fi

          owned_pulls="$(
            gh api --method GET "repos/${REPO}/pulls" \
              -f state=open \
              -f base=develop \
              -f "head=${GITHUB_REPOSITORY_OWNER}:${branch}" \
              -f per_page=100
          )"
          test "$(jq 'length' <<< "$owned_pulls")" -eq 1
          jq -e \
            --arg repo "$REPO" \
            --arg branch "$branch" \
            --arg sha "$pushed_sha" '
              .[0].head.repo.full_name == $repo
              and .[0].user.login == "lightning-it-release-automation[bot]"
              and .[0].user.type == "Bot"
              and .[0].head.ref == $branch
              and .[0].head.sha == $sha
              and .[0].base.ref == "develop"
            ' <<< "$owned_pulls" >/dev/null
          existing="$(jq -r '.[0].number' <<< "$owned_pulls")"
          gh pr edit "$existing" \
            --repo "$REPO" \
            --title "$title" \
            --body "$body"
          if [ "$(jq -r '.[0].draft' <<< "$owned_pulls")" = true ]; then
            gh pr ready "$existing" --repo "$REPO"
          fi
          owned_pull="$(gh api "repos/${REPO}/pulls/${existing}")"
          jq -e \
            --arg repo "$REPO" \
            --arg branch "$branch" \
            --arg sha "$pushed_sha" '
              .state == "open"
              and .draft == false
              and .head.repo.full_name == $repo
              and .user.login == "lightning-it-release-automation[bot]"
              and .user.type == "Bot"
              and .head.ref == $branch
              and .head.sha == $sha
              and .base.ref == "develop"
            ' <<<"$owned_pull" >/dev/null
          gh workflow run release-bot-exact-head-review.yml \
            --repo "$REPO" \
            --ref "$(jq -r .base.ref <<<"$owned_pull")" \
            -f "pr_number=${existing}" \
            -f "base_ref=$(jq -r .base.ref <<<"$owned_pull")" \
            -f "expected_base=$(jq -r .base.sha <<<"$owned_pull")" \
            -f "expected_head=$(jq -r .head.sha <<<"$owned_pull")"

          if [ "$SECURITY_RELEASE" = true ]; then
            test "$(jq -er '.[0].user.login' <<< "$owned_pulls")" = \
              'lightning-it-release-automation[bot]'
            test "$(jq -er '.[0].head.sha' <<< "$owned_pulls")" = "$pushed_sha"
            gh pr merge "$existing" \
              --repo "$REPO" \
              --auto --merge --match-head-commit "$pushed_sha"
          fi
