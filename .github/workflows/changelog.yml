# yamllint disable rule:truthy rule:line-length
---
name: Changelog

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Validate changelog policy via devtools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          require_fragment=true
          if [ "$PR_AUTHOR" = "renovate[bot]" ] \
            && [ "$PR_BASE" = "develop" ] \
            && [[ "$PR_HEAD" = renovate/* ]] \
            && jq -e 'index("renovate") != null
              and index("dependencies") != null
              and index("safe-automerge") != null
              and index("breaking-update") == null' \
              >/dev/null <<<"$LABELS_JSON"; then
            require_fragment=false
          elif [ "$PR_AUTHOR" = "lightning-it-release-automation[bot]" ] \
            && [ "$PR_BASE" = "main" ] \
            && [[ "$PR_HEAD" = security-release/MLX90-* ]]; then
            classifier_output="$(mktemp)"
            trap 'rm -f "$classifier_output"' EXIT
            python scripts/classify-security-release.py \
              --event-kind pull_request \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --base-ref "$PR_BASE" \
              --head-ref "$PR_HEAD" \
              --evidence-id "${PR_HEAD#security-release/}" \
              --github-output "$classifier_output"
            if grep -Fxq "security_recovery_receipt=true" "$classifier_output"; then
              require_fragment=false
            fi
          fi

          REQUIRE_FRAGMENT="$require_fragment" bash scripts/devtools-changelog-check.sh
