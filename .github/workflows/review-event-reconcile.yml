# Protected locator only. The existing review/Required-Workflow consumers
# independently authorize every effective mutation.
# yamllint disable rule:truthy rule:line-length
---
name: Reconcile delayed review events

on:
  workflow_run:
    workflows:
      # Managed metadata name and observed dynamic-run display name. Locator only:
      # never use this event's head, payload or artifacts as mutation authority.
      - Copilot
      - Running Copilot Code Review
      - Current revision review gate
      - Protected current-revision evidence verifier
      - Protected dot-github current-revision verifier
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'

permissions:
  actions: write
  checks: read
  issues: read
  contents: read
  pull-requests: read

concurrency:
  group: review-event-reconciliation
  cancel-in-progress: false

env:
  LI219_EVENT_MODE: ${{ (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) && 'enabled' || 'disabled' }}

jobs:
  reconcile:
    if: >-
      vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected immutable controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile native review and producer events
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          DEVTOOLS_IMAGE: quay.io/l-it/ee-wunder-devtools-ubi9:v1.16.1@sha256:c5e8707e825fcddb3e7bbc7592ebdc99a02e6ba9fa2cad71b88bcd5c71bd4d08
        run: |
          set -euo pipefail
          docker run --rm --read-only --network bridge \
            --cap-drop ALL --security-opt no-new-privileges=true \
            --pids-limit 128 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -e LI219_EVENT_MODE -e GH_TOKEN -e GITHUB_REPOSITORY -e GITHUB_REF -e GITHUB_REF_PROTECTED \
            -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace "${DEVTOOLS_IMAGE}" \
            python3 scripts/review-event-reconcile.py
