---
breaking_changes:
  - >-
    Replace the legacy Nginx podman-kube@ unit with the collision-resistant
    `<pod-name>-pod.service` Quadlet; direct kubeplay requires non-systemd mode,
    and managed-systemd mode requires `nginx_deploy_systemd_enabled=true`.
bugfixes:
  - >-
    Accept validated native Quadlet `Network=<name>:ip=<IPv4>` entries without
    admitting other Quadlet options or IPv6 values.
