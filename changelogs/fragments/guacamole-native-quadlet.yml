---
breaking_changes:
  - >-
    Replace the legacy Guacamole wrapper with a collision-resistant
    `<pod-name>-pod.service` Quadlet and fail-closed `guacamole.service`
    takeover.
security_fixes:
  - >-
    Require exact native Quadlet ownership before accepting an existing
    Guacamole service or pod, and restore the verified legacy unit and state
    if native startup or readiness fails.
