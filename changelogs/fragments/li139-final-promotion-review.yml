---
bugfixes:
  - >-
    Reject YAML booleans for the forward proxy listen port, report owned
    disable transitions in check mode, and require same-repository Release App
    identity and the canonical base branch before a release-named pull request
    receives changelog privileges. Generated changelog authorization now runs
    before fragment-exemption labels, protocol readiness uses Ansible's
    configured-or-discovered Python interpreter and complete HTTP headers, and connection
    validation remains redacted. Explicitly configured target Python
    interpreters remain supported, while release, back-sync, and develop-to-main
    promotion privileges are bound to canonical repositories and target branches
    on both pull-request and post-merge push checks; manual and unknown event
    types fail closed.
