---
bugfixes:
  - >-
    keycloak_deploy - select the unique shared private database network for
    managed DNS endpoints without rejecting unrelated PostgreSQL attachments.
  - >-
    keycloak_deploy - reject duplicate captured Pod mapping keys before migration
    parsing and accept rollback target bytes only for files actually writable by
    the transaction, preserving external PostgreSQL manifest changes.
  - >-
    keycloak_deploy and postgres_deploy - compare complete native Pod manifests
    with scalar types preserved, preventing formatting-only follow-on restarts
    while retaining transactional reconciliation for real configuration changes.
  - >-
    keycloak_deploy - preserve all literal IPv4 and IPv6 loopback host bindings
    during native migration while rejecting wildcard and non-loopback exposure.
  - >-
    keycloak_deploy - reject unreconstructable implicit prior network attachments
    before stopping either service during paired migration.
  - >-
    keycloak_deploy - preserve dynamically addressed Keycloak peers on the exact
    database network while retaining a uniquely pinned private PostgreSQL endpoint.
  - >-
    keycloak_deploy - reject unsupported dedicated database unit identities before
    cutover and preserve valid non-static additional network bindings during
    pre-stop, desired-runtime and rollback validation.
  - >-
    keycloak_deploy - add an explicit default-off paired native network transition
    that preserves images and data paths and restores both Keycloak and its
    managed PostgreSQL configuration when cutover readiness fails.
  - >-
    keycloak_deploy - validate all paired rollback targets and their parent
    identities before any restore write, retaining final per-write checks.
  - >-
    keycloak_deploy - accept the exact managed PostgreSQL pod DNS name while
    retaining its declared private network and peer-address binding; reject
    arbitrary external database names.
