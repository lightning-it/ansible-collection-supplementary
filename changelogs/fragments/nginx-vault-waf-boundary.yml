---
breaking_changes:
  - >-
    Make HashiCorp Vault the fail-closed default TLS source of record for
    nginx_config and add an opt-in NGINX-native policy-WAF boundary for TLS
    proxy vhosts.
  - >-
    Reject consumer-supplied forwarding-header overrides, NGINX include or
    multi-statement directives, unsafe upstream targets, and policy-engine
    directives that could bypass the managed proxy/WAF boundary. Existing
    inventories using those formerly accepted inputs must migrate to the
    dedicated role variables.
