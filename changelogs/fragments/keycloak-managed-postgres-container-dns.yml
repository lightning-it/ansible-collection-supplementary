---
bugfixes:
  - >-
    Use the stable PostgreSQL pod DNS alias and private container port while
    retaining the published host endpoint for controller readiness.
  - >-
    Restrict the generated PostgreSQL Pod manifest to its owner because the
    runtime manifest contains the effective database password.
breaking_changes:
  - >-
    Replace legacy Keycloak and PostgreSQL units with collision-resistant
    `<pod-name>-pod.service` Quadlets. Direct kubeplay remains available only
    in explicit non-systemd mode.
