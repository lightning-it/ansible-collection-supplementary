---
bugfixes:
  - >-
    Restrict the generated PostgreSQL Pod manifest to its owner because the
    runtime manifest contains the effective database password.
security_fixes:
  - >-
    Require exact native Quadlet ownership and reject unhandled legacy
    enablement states before Keycloak or PostgreSQL can accept an existing
    service or pod.
  - >-
    Make Keycloak and PostgreSQL legacy-to-Quadlet cutover transactional by
    quiescing failed native controllers and restoring the exact prior service
    state before reporting a deployment failure.
breaking_changes:
  - >-
    Require an explicit PostgreSQL private endpoint and container port for
    bridge-networked Keycloak while retaining the host endpoint for readiness.
  - >-
    Replace legacy Keycloak and PostgreSQL units with collision-resistant
    `<pod-name>-pod.service` Quadlets. Direct kubeplay remains available only
    in explicit non-systemd mode.
  - >-
    Reject `keycloak_destroy_execute=true` and `postgres_destroy_execute=true`
    for systemd-managed deployments until native Quadlet teardown is supported;
    keep destructive teardown disabled or use a reviewed non-systemd lifecycle.
