---
- name: Import nginx_deploy prechecks
  ansible.builtin.import_role:
    name: nginx_deploy
    tasks_from: assert
  tags: always

- name: Ensure nginx_config variables are valid
  ansible.builtin.assert:
    that:
      - nginx_config_vhosts_effective is sequence
      - nginx_config_vhosts_effective is not string
      - nginx_config_service_vhosts_enabled is boolean
      - nginx_config_service_vhosts is sequence
      - nginx_config_service_vhosts is not string
      - nginx_config_service_vhosts_extra is sequence
      - nginx_config_service_vhosts_extra is not string
      - nginx_config_remove_default is boolean
      - nginx_config_conf_d_dir | default('', true) | trim | length > 0
      - nginx_config_vhost_mode | default('', true) | trim | length > 0
      - nginx_config_http_listen_port | int > 0
      - nginx_config_tls_listen_port | int > 0
      - nginx_config_tls_certificate | default('', true) | trim | length > 0
      - nginx_config_tls_certificate_key | default('', true) | trim | length > 0
      - nginx_config_tls_certificate_host_path | default('', true) | trim | length > 0
      - nginx_config_tls_certificate_key_host_path | default('', true) | trim | length > 0
      - nginx_config_tls_source in ['vault', 'file', 'selfsigned']
      - nginx_config_tls_certificate_file_source is string
      - nginx_config_tls_certificate_key_file_source is string
      - nginx_config_tls_file_remote_src is boolean
      - nginx_config_tls_self_signed_days | int > 0
      - nginx_config_tls_common_name | default('', true) | trim | length > 0
      - nginx_config_tls_no_log is boolean
      - nginx_config_vault_address is string
      - nginx_config_vault_validate_certs is boolean
      - nginx_config_vault_kv_mount | default('', true) | trim | length > 0
      - nginx_config_vault_kv_path | default('', true) | trim | length > 0
      - nginx_config_vault_pki_path is string
      - nginx_config_vault_pki_role is string
      - nginx_config_vault_issue_missing is boolean
      - nginx_config_vault_allow_local_fallback is boolean
      - nginx_config_vault_token is string
      - nginx_config_vault_role_id is string
      - nginx_config_vault_secret_id is string
      - nginx_config_vault_use_token is boolean
      - nginx_config_vault_auth_ok is boolean
      - nginx_config_vault_auth_method in ['token', 'approle']
      - nginx_config_vault_cert_common_name | default('', true) | trim | length > 0
      - nginx_config_vault_cert_alt_names is sequence
      - nginx_config_vault_cert_alt_names is not string
      - nginx_config_waf_enabled is boolean
      - nginx_config_waf_server_directives is sequence
      - nginx_config_waf_server_directives is not string
      - nginx_config_waf_location_directives is sequence
      - nginx_config_waf_location_directives is not string
      - nginx_config_proxy_default_directives is sequence
      - nginx_config_proxy_default_directives is not string
      - nginx_config_proxy_http_external_port | string is match('^[0-9]+$')
      - nginx_config_proxy_http_external_port | int > 0
      - nginx_config_proxy_http_external_port | int <= 65535
      - nginx_config_proxy_tls_external_port | string is match('^[0-9]+$')
      - nginx_config_proxy_tls_external_port | int > 0
      - nginx_config_proxy_tls_external_port | int <= 65535
      - >-
        nginx_config_proxy_required_directives == [
          'proxy_set_header Host $server_name',
          'proxy_set_header X-Real-IP $remote_addr',
          'proxy_set_header X-Forwarded-For $remote_addr',
          'proxy_set_header X-Forwarded-Host $server_name',
          'proxy_set_header X-Forwarded-Proto $scheme',
          'proxy_set_header X-Forwarded-Prefix ""',
          'proxy_set_header X-Original-Forwarded-For ""',
          'proxy_set_header Forwarded ""'
        ]
      - nginx_config_test is boolean
    fail_msg: "nginx_config variables are missing or invalid."
    quiet: true
  tags: always

- name: Ensure enabled WAF policy contains server and location controls
  ansible.builtin.assert:
    that:
      - nginx_config_waf_server_directives | length > 0
      - nginx_config_waf_location_directives | length > 0
      - >-
        nginx_config_waf_server_directives
        | select('string')
        | map('trim')
        | reject('equalto', '')
        | list
        | length == nginx_config_waf_server_directives | length
      - >-
        nginx_config_waf_server_directives
        | reject('match', '^(?![ \t]*["'']?(?i:include)["'']?(?:[ \t]|$))[^\\\r\n;{}]*(;)?$')
        | list | length == 0
      - >-
        nginx_config_waf_location_directives
        | select('string')
        | map('trim')
        | reject('equalto', '')
        | list
        | length == nginx_config_waf_location_directives | length
    fail_msg: >-
      nginx_config_waf_enabled=true requires non-empty string directives for
      both the TLS server boundary and every proxied location.
    quiet: true
  when:
    - nginx_config_waf_enabled | bool
  tags: always

- name: Reject reserved proxy identity headers in WAF location directives
  ansible.builtin.assert:
    that:
      - >-
        item | trim | lower
        is not match(
          '^[\"'']?proxy_set_header[\"'']?[ \t]+[\"'']?'
          ~ '(host|x-real-ip|x-forwarded-for|x-forwarded-host|x-forwarded-port|'
          ~ 'x-forwarded-proto|x-forwarded-prefix|x-original-forwarded-for|forwarded)'
          ~ '[\"'']?[ \t]+'
        )
      - item | trim is match('^(?!["'']?(?i:include)["'']?(?:[ \t]|$))[^\\\r\n;{}]*(;)?$')
    fail_msg: >-
      WAF location directives must not set reserved proxy identity headers.
      Those headers are owned exclusively by nginx_config_proxy_required_directives.
    quiet: true
  loop: "{{ nginx_config_waf_location_directives }}"
  loop_control:
    label: "{{ item | regex_replace('[\r\n].*$', '') }}"
  when:
    - nginx_config_waf_enabled | bool
  tags: always

- name: Reject multi-statement default proxy directives
  ansible.builtin.assert:
    that:
      - item is string
      - item | trim | length > 0
      - item | trim is match('^(?!["'']?(?i:include)["'']?(?:[ \t]|$))[^\\\r\n;{}]*(;)?$')
    fail_msg: >-
      Proxy directives must contain exactly one NGINX statement and must not
      contain embedded newlines or additional semicolons.
    quiet: true
  loop: "{{ nginx_config_proxy_default_directives }}"
  loop_control:
    label: "{{ item | string | regex_replace('[\r\n].*$', '') }}"
  tags: always

- name: Reject multi-statement vhost proxy directives
  ansible.builtin.assert:
    that:
      - (item.proxy_directives | default([])) is sequence
      - (item.proxy_directives | default([])) is not string
      - >-
        item.proxy_directives | default([])
        | select('string') | list | length
        == item.proxy_directives | default([]) | length
      - >-
        item.proxy_directives | default([])
        | reject('match', '^(?![ \t]*["'']?(?i:include)["'']?(?:[ \t]|$))[^\\\r\n;{}]*(;)?$') | list | length == 0
    fail_msg: >-
      Vhost proxy directives must each contain exactly one NGINX statement
      and must not contain embedded newlines or additional semicolons.
    quiet: true
  loop: "{{ nginx_config_vhosts_effective }}"
  loop_control:
    label: "{{ item.name | default('') }}"
  tags: always

- name: Reject multi-statement location proxy directives
  ansible.builtin.assert:
    that:
      - (item.1.directives | default([])) is sequence
      - (item.1.directives | default([])) is not string
      - >-
        item.1.directives | default([])
        | select('string') | list | length
        == item.1.directives | default([]) | length
      - >-
        item.1.directives | default([])
        | reject('match', '^(?![ \t]*["'']?(?i:include)["'']?(?:[ \t]|$))[^\\\r\n;{}]*(;)?$') | list | length == 0
    fail_msg: >-
      Location proxy directives must each contain exactly one NGINX statement
      and must not contain embedded newlines or additional semicolons.
    quiet: true
  loop: "{{ nginx_config_vhosts_effective | subelements('locations', skip_missing=True) }}"
  loop_control:
    label: >-
      {{ item.0.name | default('') }}:{{ item.1.path | default('/') }}
  tags: always

- name: Ensure Vault PKI issue inputs are present when enabled
  ansible.builtin.assert:
    that:
      - nginx_config_vault_pki_path | default('', true) | trim | length > 0
      - nginx_config_vault_pki_role | default('', true) | trim | length > 0
    fail_msg: >-
      nginx_config_vault_issue_missing=true requires a non-empty Vault PKI
      issue path and role. Disable issuance only when a complete certificate,
      private key, chain, and identity metadata already exist in Vault KV.
    quiet: true
  when:
    - not nginx_deploy_skip_config | bool
    - nginx_config_has_force_https_vhosts | bool
    - nginx_config_tls_source == 'vault'
    - nginx_config_vault_issue_missing | bool
  tags: always

- name: Reject block-form proxy-vhost extra directives
  ansible.builtin.assert:
    that:
      - item.1 is string
      - item.1 is match('(?ims)^(?!.*(?:^|\n)[ \t]*["'']?include["'']?(?:[ \t]|$))[^{}\\]*$')
    fail_msg: >-
      Proxy-vhost extra directives must not contain NGINX block
      delimiters. Custom location blocks would bypass the generated proxy
      location safeguards and required forwarded-header boundary.
    quiet: true
  loop: "{{ nginx_config_vhosts_effective | subelements('extra_directives', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name | default('') }}"
  when:
    - >-
      item.0.upstream_url | default('', true) | trim | length > 0
      or item.0.locations | default([]) | length > 0
  tags: always

- name: Ensure Vault TLS inputs are present when source=vault
  ansible.builtin.assert:
    that:
      - nginx_config_vault_address | default('', true) | trim | length > 0
      - nginx_config_vault_auth_ok | bool
    fail_msg: >-
      nginx_config_tls_source=vault requires Vault address and auth.
      Provide nginx_config_vault_address plus token or AppRole credentials.
    quiet: true
  when:
    - nginx_config_has_force_https_vhosts | bool
    - nginx_config_tls_source == 'vault'
  tags: always

- name: Ensure file TLS inputs are complete when source=file
  ansible.builtin.assert:
    that:
      - >-
        (
          nginx_config_tls_certificate_file_source | default('', true) | trim | length == 0
          and nginx_config_tls_certificate_key_file_source | default('', true) | trim | length == 0
        )
        or
        (
          nginx_config_tls_certificate_file_source | default('', true) | trim | length > 0
          and nginx_config_tls_certificate_key_file_source | default('', true) | trim | length > 0
        )
    fail_msg: >-
      nginx_config_tls_source=file requires both
      nginx_config_tls_certificate_file_source and
      nginx_config_tls_certificate_key_file_source, or neither when the
      certificate and key already exist at the nginx host paths.
    quiet: true
  when:
    - nginx_config_has_force_https_vhosts | bool
    - nginx_config_tls_source == 'file'
  tags: always

- name: Ensure nginx vhost definitions are valid
  ansible.builtin.assert:
    that:
      - item.name | default('', true) | trim | length > 0
      - item.server_name | default('_', true) | trim | length > 0
      - (item.extra_directives | default([])) is sequence
      - (item.extra_directives | default([])) is not string
      - >-
        item.extra_directives | default([])
        | select('string') | list | length
        == item.extra_directives | default([]) | length
      - (item.force_https | default(false) | bool) or (item.listen_port | default(nginx_deploy_listen_port) | int > 0)
      - >-
        item.proxy_external_port is not defined
        or item.proxy_external_port | string is match('^[0-9]+$')
      - >-
        item.proxy_external_port is not defined
        or (
          item.proxy_external_port | int > 0
          and item.proxy_external_port | int <= 65535
        )
      - >-
        (not (item.force_https | default(false) | bool))
        or (item.upstream_url | default('', true) | trim | length > 0)
    fail_msg: "Each nginx vhost entry must define valid name/server_name and HTTPS proxy inputs when force_https=true."
    quiet: true
  loop: "{{ nginx_config_vhosts_effective }}"
  loop_control:
    label: "{{ item.name | default('') }}"
  tags: always
