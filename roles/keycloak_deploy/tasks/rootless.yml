---
- name: Validate rootless Keycloak configuration
  ansible.builtin.assert:
    that:
      - keycloak_deploy_systemd_scope == 'user'
      - keycloak_deploy_manage_postgres | bool
      - keycloak_deploy_hostname is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$')
      - keycloak_deploy_db_name is match('^[A-Za-z0-9_]+$')
      - keycloak_deploy_db_user is match('^[A-Za-z0-9_]+$')
      - keycloak_deploy_admin_user is match('^[A-Za-z0-9_.@-]+$')
      - keycloak_deploy_manage_systemd | bool
      - keycloak_deploy_systemd_enabled | bool
      - keycloak_deploy_proxy_headers == 'xforwarded'
      - keycloak_deploy_proxy_trusted_addresses | length > 0
      - not keycloak_deploy_generate_secrets | bool
      - not keycloak_deploy_store_generated_secrets | bool
      - keycloak_deploy_db_password | length >= 16
      - keycloak_deploy_admin_password | length >= 16
      - keycloak_deploy_admin_password is not search('[\r\n]')
      - keycloak_deploy_db_password is not search('[\r\n]')
      - keycloak_deploy_rootless_user != 'root'
      - keycloak_deploy_rootless_home is match('^/')
      - keycloak_deploy_host_data_dir is match('^/')
      - keycloak_deploy_postgres_data_dir is match('^/')
      - keycloak_deploy_rootless_network is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - keycloak_deploy_run_user_uid | int > 0
      - keycloak_deploy_port | int == 8080
      - keycloak_deploy_management_port | int > 0
      - keycloak_deploy_management_port | int <= 65535
    quiet: true
  no_log: true
  tags: always

- name: Resolve the prepared rootless account
  ansible.builtin.getent:
    database: passwd
    key: "{{ keycloak_deploy_rootless_user }}"
  tags: always

- name: Record rootless runtime directory
  ansible.builtin.set_fact:
    keycloak_deploy_rootless_uid: "{{ ansible_facts.getent_passwd[keycloak_deploy_rootless_user][1] }}"
    keycloak_deploy_rootless_quadlet_dir: "{{ keycloak_deploy_rootless_home }}/.config/containers/systemd"
  tags: always

- name: Verify prepared persistent directories
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ keycloak_deploy_host_data_dir }}"
    - "{{ keycloak_deploy_postgres_data_dir }}"
    - "{{ keycloak_deploy_config_dir }}"
  register: keycloak_deploy_rootless_paths

- name: Require host preparation before rootless deployment
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
    fail_msg: Prepare the service account and persistent paths before deployment.
  loop: "{{ keycloak_deploy_rootless_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require a genuinely unprivileged runtime account
  ansible.builtin.assert:
    that: keycloak_deploy_rootless_uid | int > 0
    quiet: true

- name: Locate incompatible legacy rootless container units
  ansible.builtin.stat:
    path: "{{ keycloak_deploy_rootless_quadlet_dir }}/{{ item }}.container"
  loop: [keycloak, postgres]
  register: keycloak_deploy_rootless_legacy

- name: Require an exclusive kube lifecycle owner
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: Existing experimental container units require a separately planned transition before kube deployment.
  loop: "{{ keycloak_deploy_rootless_legacy.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Deploy rootless services through the shared kube lifecycle
  become: true
  become_user: "{{ keycloak_deploy_rootless_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ keycloak_deploy_rootless_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ keycloak_deploy_rootless_uid }}/bus"
  when:
    - not keycloak_deploy_skip_runtime | bool
    - not keycloak_deploy_skip_deploy | bool
  block:
    - name: Require an available rootless user manager
      ansible.builtin.command:
        argv: [systemctl, --user, show-environment]
      changed_when: false
      no_log: true

    - name: Create private Quadlet configuration directory
      ansible.builtin.file:
        path: "{{ keycloak_deploy_rootless_quadlet_dir }}"
        state: directory
        mode: '0755'

    - name: Render the private network definition
      ansible.builtin.template:
        src: rootless-keycloak-private.network.j2
        dest: "{{ keycloak_deploy_rootless_quadlet_dir }}/{{ keycloak_deploy_rootless_network }}.network"
        mode: '0600'
      when: not ansible_check_mode

    - name: Render private PostgreSQL and Keycloak Kubernetes manifests
      ansible.builtin.template:
        src: "rootless-{{ item }}-pod.yml.j2"
        dest: "{{ keycloak_deploy_config_dir }}/{{ item }}-rootless-pod.yml"
        mode: '0600'
      loop: [postgres, keycloak]
      no_log: true
      diff: false

    - name: Reconcile the managed PostgreSQL kube runtime
      ansible.builtin.include_tasks: rootless-postgres.yml
      when: not ansible_check_mode

    - name: Reconcile the Keycloak kube runtime
      ansible.builtin.include_tasks: rootless-keycloak.yml
      when: not ansible_check_mode
