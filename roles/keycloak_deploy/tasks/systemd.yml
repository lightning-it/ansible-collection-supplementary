---
- name: Manage Keycloak systemd unit
  when:
    - keycloak_deploy_manage_systemd | bool
    - (ansible_service_mgr | default(ansible_facts.service_mgr | default(''))) == 'systemd'
    - not ansible_check_mode
  tags:
    - systemd
  block:
    - name: Resolve the exact legacy Podman kube unit identity
      ansible.builtin.command:
        argv:
          - systemd-escape
          - "{{ keycloak_deploy_pod_manifest_path }}"
      register: keycloak_deploy_legacy_systemd_name
      changed_when: false

    - name: Inspect the exact legacy Keycloak unit activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "podman-kube@{{ keycloak_deploy_legacy_systemd_name.stdout }}.service"
      register: keycloak_deploy_legacy_systemd_active
      changed_when: false
      failed_when: false

    - name: Inspect the exact legacy Keycloak unit enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "podman-kube@{{ keycloak_deploy_legacy_systemd_name.stdout }}.service"
      register: keycloak_deploy_legacy_systemd_enabled
      changed_when: false
      failed_when: false

    - name: Inspect the exact native Keycloak unit activity
      ansible.builtin.command:
        argv: >-
          {{ ['systemctl']
             + (['--user'] if keycloak_deploy_systemd_scope == 'user' else [])
             + ['is-active', keycloak_deploy_systemd_unit_name ~ '.service'] }}
      register: keycloak_deploy_native_systemd_active
      changed_when: false
      failed_when: false

    - name: Inspect the exact native Keycloak unit enablement
      ansible.builtin.command:
        argv: >-
          {{ ['systemctl']
             + (['--user'] if keycloak_deploy_systemd_scope == 'user' else [])
             + ['is-enabled', keycloak_deploy_systemd_unit_name ~ '.service'] }}
      register: keycloak_deploy_native_systemd_enabled
      changed_when: false
      failed_when: false

    - name: Inspect the desired native Keycloak Quadlet file
      ansible.builtin.stat:
        path: "{{ keycloak_deploy_quadlet_dir }}/{{ keycloak_deploy_systemd_unit_name }}.kube"
        follow: false
      register: keycloak_deploy_native_quadlet_file

    - name: Read the desired native Keycloak Quadlet file
      ansible.builtin.slurp:
        path: "{{ keycloak_deploy_quadlet_dir }}/{{ keycloak_deploy_systemd_unit_name }}.kube"
      register: keycloak_deploy_native_quadlet_read
      when:
        - keycloak_deploy_native_quadlet_file.stat.exists | default(false)
        - keycloak_deploy_native_quadlet_file.stat.isreg | default(false)
        - not (keycloak_deploy_native_quadlet_file.stat.islnk | default(false))

    - name: Refuse unknown Keycloak lifecycle states
      ansible.builtin.assert:
        that:
          - keycloak_deploy_legacy_systemd_active.rc in [0, 1, 3, 4]
          - >-
            keycloak_deploy_legacy_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
          - keycloak_deploy_legacy_systemd_enabled.rc in [0, 1, 3, 4]
          - >-
            keycloak_deploy_legacy_systemd_enabled.stdout | trim
            in ['enabled', 'disabled', 'not-found']
          - keycloak_deploy_native_systemd_active.rc in [0, 3, 4]
          - >-
            keycloak_deploy_native_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
          - keycloak_deploy_native_systemd_enabled.rc in [0, 1, 3, 4]
          - >-
            keycloak_deploy_native_systemd_enabled.stdout | trim
            in ['enabled', 'disabled', 'generated', 'not-found']
          - >-
            not (
              keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
              and keycloak_deploy_native_systemd_active.stdout | trim == 'active'
            )
        fail_msg: >-
          Unable to prove the exact Keycloak legacy/native lifecycle state;
          refusing Quadlet takeover.
        quiet: true

    - name: Refuse unproven drift in an existing native Keycloak Quadlet
      ansible.builtin.assert:
        that:
          - keycloak_deploy_native_quadlet_file.stat.exists | default(false)
          - keycloak_deploy_native_quadlet_file.stat.isreg | default(false)
          - not (keycloak_deploy_native_quadlet_file.stat.islnk | default(false))
          - keycloak_deploy_native_quadlet_read.content | default('') | length > 0
          - >-
            (
              keycloak_deploy_native_quadlet_read.content
              | default('') | b64decode
            ).splitlines()
            | reject('equalto', '') | list
            == (
              [
                '[Unit]',
                'Description=' ~ keycloak_deploy_systemd_description,
                'After=network-online.target',
                'Wants=network-online.target',
                '[Kube]',
                'Yaml=' ~ keycloak_deploy_pod_manifest_path
              ]
              + (
                keycloak_deploy_networks
                | map('regex_replace', '^(.*)$', 'Network=\\1') | list
              )
              + ['[Install]', 'WantedBy=multi-user.target']
            )
          - >-
            (
              keycloak_deploy_systemd_enabled | bool
              and keycloak_deploy_native_systemd_enabled.stdout | trim
              in ['enabled', 'generated']
            )
            or (
              not (keycloak_deploy_systemd_enabled | bool)
              and keycloak_deploy_native_systemd_enabled.stdout | trim == 'disabled'
            )
        fail_msg: >-
          The existing native Keycloak Quadlet cannot be proven role-owned
          with the requested manifest, networks, description, and enablement.
          Refusing to collide with or take over an administrator-owned unit.
        quiet: true
      when: >-
        keycloak_deploy_native_quadlet_file.stat.exists | default(false)
        or keycloak_deploy_native_systemd_enabled.stdout | trim != 'not-found'
        or keycloak_deploy_native_systemd_active.stdout | trim != 'unknown'

    - name: Refuse unmanaged Keycloak pod; remove it first
      ansible.builtin.command:
        argv: [podman, pod, exists, "{{ keycloak_deploy_pod_name }}"]
      register: keycloak_deploy_existing_pod
      changed_when: false
      failed_when: >-
        keycloak_deploy_existing_pod.rc not in [0, 1]
        or (keycloak_deploy_existing_pod.rc == 0
        and keycloak_deploy_legacy_systemd_active.stdout | trim != 'active'
        and keycloak_deploy_native_systemd_active.stdout | trim != 'active')

    - name: Stage the native Keycloak Quadlet before legacy shutdown
      ansible.builtin.include_role:
        name: lit.foundational.podman_systemd
      vars:
        podman_systemd_action: stopped
        podman_systemd_unit_name: "{{ keycloak_deploy_systemd_unit_name }}"
        podman_systemd_description: "{{ keycloak_deploy_systemd_description }}"
        podman_systemd_manifest_path: "{{ keycloak_deploy_pod_manifest_path }}"
        podman_systemd_scope: "{{ keycloak_deploy_systemd_scope }}"
        podman_systemd_quadlet_dir: "{{ keycloak_deploy_quadlet_dir }}"
        podman_systemd_enabled: false
        podman_systemd_networks: "{{ keycloak_deploy_networks }}"
      when: >-
        keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
        or keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'

    - name: Stop and disable the exact legacy Keycloak unit before Quadlet takeover
      ansible.builtin.systemd:
        name: "podman-kube@{{ keycloak_deploy_legacy_systemd_name.stdout }}.service"
        state: stopped
        enabled: false
      when: >-
        keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
        or keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'

    - name: Manage the native Keycloak Quadlet service
      ansible.builtin.include_role:
        name: lit.foundational.podman_systemd
      vars:
        podman_systemd_action: >-
          {{
            'restarted'
            if (
              keycloak_deploy_kubeplay_remove | default(false) | bool
              or keycloak_deploy_kubeplay_run | default(false) | bool
              or keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
              or keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'
            )
            else 'present'
          }}
        podman_systemd_unit_name: "{{ keycloak_deploy_systemd_unit_name }}"
        podman_systemd_description: "{{ keycloak_deploy_systemd_description }}"
        podman_systemd_manifest_path: "{{ keycloak_deploy_pod_manifest_path }}"
        podman_systemd_scope: "{{ keycloak_deploy_systemd_scope }}"
        podman_systemd_quadlet_dir: "{{ keycloak_deploy_quadlet_dir }}"
        podman_systemd_enabled: "{{ keycloak_deploy_systemd_enabled }}"
        podman_systemd_networks: "{{ keycloak_deploy_networks }}"

    - name: Wait until Keycloak health endpoint is reachable
      ansible.builtin.uri:
        url: "{{ keycloak_deploy_health_url_effective }}"
        method: GET
        validate_certs: "{{ keycloak_deploy_validate_certs }}"
      register: keycloak_deploy_health
      until: keycloak_deploy_health.status == 200
      retries: 30
      delay: 5
      changed_when: false
      failed_when: keycloak_deploy_health is failed or keycloak_deploy_health.status != 200

    - name: Wait until Keycloak liveness endpoint is reachable
      ansible.builtin.uri:
        url: "{{ keycloak_deploy_liveness_url_effective }}"
        method: GET
        validate_certs: "{{ keycloak_deploy_validate_certs }}"
      register: keycloak_deploy_liveness
      until: keycloak_deploy_liveness.status == 200
      retries: 30
      delay: 5
      changed_when: false
      failed_when: keycloak_deploy_liveness is failed or keycloak_deploy_liveness.status != 200
