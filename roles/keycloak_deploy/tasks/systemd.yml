---
- name: Manage Keycloak systemd unit
  when:
    - keycloak_deploy_manage_systemd | bool
    - (ansible_service_mgr | default(ansible_facts.service_mgr | default(''))) == 'systemd'
    - not ansible_check_mode
  tags:
    - systemd
  block:
    - name: Resolve the exact legacy Podman kube unit identity
      ansible.builtin.command:
        argv:
          - systemd-escape
          - "{{ keycloak_deploy_pod_manifest_path }}"
      register: keycloak_deploy_legacy_systemd_name
      changed_when: false

    - name: Inspect the exact legacy Keycloak unit activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "podman-kube@{{ keycloak_deploy_legacy_systemd_name.stdout }}.service"
      register: keycloak_deploy_legacy_systemd_active
      changed_when: false
      failed_when: false

    - name: Inspect the exact legacy Keycloak unit enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "podman-kube@{{ keycloak_deploy_legacy_systemd_name.stdout }}.service"
      register: keycloak_deploy_legacy_systemd_enabled
      changed_when: false
      failed_when: false

    - name: Inspect the exact native Keycloak unit activity
      ansible.builtin.command:
        argv: >-
          {{ ['systemctl']
             + (['--user'] if keycloak_deploy_systemd_scope == 'user' else [])
             + ['is-active', keycloak_deploy_systemd_unit_name ~ '.service'] }}
      register: keycloak_deploy_native_systemd_active
      changed_when: false
      failed_when: false

    - name: Inspect the exact native Keycloak unit enablement
      ansible.builtin.command:
        argv: >-
          {{ ['systemctl']
             + (['--user'] if keycloak_deploy_systemd_scope == 'user' else [])
             + ['is-enabled', keycloak_deploy_systemd_unit_name ~ '.service'] }}
      register: keycloak_deploy_native_systemd_enabled
      changed_when: false
      failed_when: false

    - name: Resolve the loaded native Keycloak unit fragment
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ keycloak_deploy_systemd_unit_name }}.service"
          - --property=FragmentPath
          - --value
      register: keycloak_deploy_native_fragment_path
      changed_when: false
      failed_when: false

    - name: Resolve loaded native Keycloak unit drop-ins
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ keycloak_deploy_systemd_unit_name }}.service"
          - --property=DropInPaths
          - --value
      register: keycloak_deploy_native_drop_in_paths
      changed_when: false
      failed_when: false

    - name: Inspect the desired native Keycloak Quadlet file
      ansible.builtin.stat:
        path: "{{ keycloak_deploy_quadlet_dir }}/{{ keycloak_deploy_systemd_unit_name }}.kube"
        follow: false
      register: keycloak_deploy_native_quadlet_file

    - name: Read the desired native Keycloak Quadlet file
      ansible.builtin.slurp:
        src: "{{ keycloak_deploy_quadlet_dir }}/{{ keycloak_deploy_systemd_unit_name }}.kube"
      register: keycloak_deploy_native_quadlet_read
      when:
        - keycloak_deploy_native_quadlet_file.stat.exists | default(false)
        - keycloak_deploy_native_quadlet_file.stat.isreg | default(false)
        - not (keycloak_deploy_native_quadlet_file.stat.islnk | default(false))

    - name: Inspect the pre-transaction Keycloak Pod manifest
      ansible.builtin.stat:
        path: "{{ keycloak_deploy_pod_manifest_path }}"
        follow: false
      register: keycloak_deploy_original_manifest_file

    - name: Refuse an unsafe Keycloak Pod manifest before rendering
      ansible.builtin.assert:
        that:
          - not (keycloak_deploy_original_manifest_file.stat.islnk | default(false))
          - keycloak_deploy_original_manifest_file.stat.isreg | default(false)
        fail_msg: >-
          The Keycloak Pod manifest exists but is not a regular file. Refusing
          to follow or replace it during transactional Quadlet cutover.
        quiet: true
      when: keycloak_deploy_original_manifest_file.stat.exists | default(false)

    - name: Read the pre-transaction Keycloak Pod manifest
      ansible.builtin.slurp:
        src: "{{ keycloak_deploy_pod_manifest_path }}"
      register: keycloak_deploy_original_manifest_read
      no_log: true
      when:
        - keycloak_deploy_original_manifest_file.stat.exists | default(false)
        - keycloak_deploy_original_manifest_file.stat.isreg | default(false)
        - not (keycloak_deploy_original_manifest_file.stat.islnk | default(false))

    - name: Refuse unknown Keycloak lifecycle states
      ansible.builtin.assert:
        that:
          - keycloak_deploy_legacy_systemd_active.rc in [0, 1, 3, 4]
          - >-
            keycloak_deploy_legacy_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
          - keycloak_deploy_legacy_systemd_active.stdout | trim != 'failed'
          - keycloak_deploy_legacy_systemd_enabled.rc in [0, 1, 3, 4]
          - >-
            keycloak_deploy_legacy_systemd_enabled.stdout | trim
            in ['enabled', 'disabled', 'not-found']
          - keycloak_deploy_native_systemd_active.rc in [0, 3, 4]
          - >-
            keycloak_deploy_native_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
          - keycloak_deploy_native_systemd_active.stdout | trim != 'failed'
          - keycloak_deploy_native_systemd_enabled.rc in [0, 1, 3, 4]
          - >-
            keycloak_deploy_native_systemd_enabled.stdout | trim
            in ['enabled', 'disabled', 'generated', 'not-found']
          - >-
            not (
              keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
              and keycloak_deploy_native_systemd_active.stdout | trim == 'active'
            )
        fail_msg: >-
          Unable to prove the exact Keycloak legacy/native lifecycle state;
          refusing Quadlet takeover.
        quiet: true

    - name: Refuse unproven drift in an existing native Keycloak Quadlet
      ansible.builtin.assert:
        that:
          - keycloak_deploy_native_quadlet_file.stat.exists | default(false)
          - keycloak_deploy_native_quadlet_file.stat.isreg | default(false)
          - not (keycloak_deploy_native_quadlet_file.stat.islnk | default(false))
          - keycloak_deploy_native_quadlet_file.stat.mode | default('') == '0644'
          - keycloak_deploy_native_quadlet_file.stat.pw_name | default('') == 'root'
          - keycloak_deploy_native_quadlet_file.stat.gr_name | default('') == 'root'
          - keycloak_deploy_native_quadlet_read.content | default('') | length > 0
          - keycloak_deploy_native_drop_in_paths.rc == 0
          - keycloak_deploy_native_drop_in_paths.stdout | trim == ''
          - >-
            (
              keycloak_deploy_native_systemd_active.stdout | trim == 'unknown'
              and keycloak_deploy_native_systemd_enabled.stdout | trim == 'not-found'
              and keycloak_deploy_native_fragment_path.stdout | trim == ''
            )
            or (
              keycloak_deploy_native_fragment_path.rc == 0
              and keycloak_deploy_native_fragment_path.stdout | trim
              is match(
                '^/run/systemd/generator(?:\\.early|\\.late)?/'
                ~ (keycloak_deploy_systemd_unit_name | regex_escape)
                ~ '\\.service\\Z'
              )
            )
          - >-
            (
              keycloak_deploy_native_quadlet_read.content
              | default('') | b64decode
            ).splitlines()
            | reject('equalto', '') | list
            == (
              [
                '[Unit]',
                'Description=' ~ keycloak_deploy_systemd_description,
                'After=network-online.target',
                'Wants=network-online.target',
                '[Kube]',
                'Yaml=' ~ keycloak_deploy_pod_manifest_path
              ]
              + (
                keycloak_deploy_networks
                | map('regex_replace', '^(.*)$', 'Network=\\1') | list
              )
              + ['[Install]', 'WantedBy=multi-user.target']
            )
          - >-
            (
              keycloak_deploy_systemd_enabled | bool
              and keycloak_deploy_native_systemd_enabled.stdout | trim
              in ['enabled', 'generated']
            )
            or (
              not (keycloak_deploy_systemd_enabled | bool)
              and keycloak_deploy_native_systemd_enabled.stdout | trim == 'disabled'
            )
        fail_msg: >-
          The existing native Keycloak Quadlet cannot be proven role-owned
          with the requested manifest, networks, description, and enablement.
          Refusing to collide with or take over an administrator-owned unit.
        quiet: true
      when: >-
        keycloak_deploy_native_quadlet_file.stat.exists | default(false)
        or keycloak_deploy_native_systemd_enabled.stdout | trim != 'not-found'
        or keycloak_deploy_native_systemd_active.stdout | trim in ['active', 'failed']

    - name: Refuse unmanaged Keycloak pod; remove it first
      ansible.builtin.command:
        argv: [podman, pod, exists, "{{ keycloak_deploy_pod_name }}"]
      register: keycloak_deploy_existing_pod
      changed_when: false
      failed_when: >-
        keycloak_deploy_existing_pod.rc not in [0, 1]
        or (keycloak_deploy_existing_pod.rc == 0
        and keycloak_deploy_legacy_systemd_active.stdout | trim != 'active'
        and keycloak_deploy_native_systemd_active.stdout | trim != 'active')

    - name: Cut over to native Keycloak Quadlet with rollback
      block:
        - name: Render the transactional Keycloak Pod manifest
          ansible.builtin.template:
            src: keycloak-pod.yml.j2
            dest: "{{ keycloak_deploy_pod_manifest_path }}"
            owner: root
            group: root
            mode: '0600'
          register: keycloak_deploy_manifest_render
          no_log: true

        - name: Stage the native Keycloak Quadlet before lifecycle mutation
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: stopped
            podman_systemd_unit_name: "{{ keycloak_deploy_systemd_unit_name }}"
            podman_systemd_description: "{{ keycloak_deploy_systemd_description }}"
            podman_systemd_manifest_path: "{{ keycloak_deploy_pod_manifest_path }}"
            podman_systemd_scope: "{{ keycloak_deploy_systemd_scope }}"
            podman_systemd_quadlet_dir: "{{ keycloak_deploy_quadlet_dir }}"
            podman_systemd_enabled: false
            podman_systemd_networks: "{{ keycloak_deploy_networks }}"
          when: not (keycloak_deploy_native_quadlet_file.stat.exists | default(false))

        - name: Reinspect the staged native Keycloak Quadlet
          ansible.builtin.stat:
            path: "{{ keycloak_deploy_quadlet_dir }}/{{ keycloak_deploy_systemd_unit_name }}.kube"
            follow: false
          register: keycloak_deploy_staged_quadlet_file
          when: not (keycloak_deploy_native_quadlet_file.stat.exists | default(false))

        - name: Resolve the staged native Keycloak unit fragment
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - "{{ keycloak_deploy_systemd_unit_name }}.service"
              - --property=FragmentPath
              - --value
          register: keycloak_deploy_staged_fragment_path
          changed_when: false
          failed_when: false
          when: not (keycloak_deploy_native_quadlet_file.stat.exists | default(false))

        - name: Resolve staged native Keycloak unit drop-ins
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - "{{ keycloak_deploy_systemd_unit_name }}.service"
              - --property=DropInPaths
              - --value
          register: keycloak_deploy_staged_drop_in_paths
          changed_when: false
          failed_when: false
          when: not (keycloak_deploy_native_quadlet_file.stat.exists | default(false))

        - name: Require the staged native Keycloak Quadlet provenance boundary
          ansible.builtin.assert:
            that:
              - keycloak_deploy_staged_quadlet_file.stat.isreg | default(false)
              - not (keycloak_deploy_staged_quadlet_file.stat.islnk | default(false))
              - keycloak_deploy_staged_quadlet_file.stat.mode | default('') == '0644'
              - keycloak_deploy_staged_quadlet_file.stat.pw_name | default('') == 'root'
              - keycloak_deploy_staged_quadlet_file.stat.gr_name | default('') == 'root'
              - keycloak_deploy_staged_fragment_path.rc == 0
              - keycloak_deploy_staged_drop_in_paths.rc == 0
              - keycloak_deploy_staged_drop_in_paths.stdout | trim == ''
              - >-
                keycloak_deploy_staged_fragment_path.stdout | trim
                is match(
                  '^/run/systemd/generator(?:\\.early|\\.late)?/'
                  ~ (keycloak_deploy_systemd_unit_name | regex_escape)
                  ~ '\\.service\\Z'
                )
            fail_msg: >-
              The staged Keycloak controller is not a root-owned mode-0644
              Quadlet with the expected generated systemd fragment; refusing
              lifecycle mutation.
            quiet: true
          when: not (keycloak_deploy_native_quadlet_file.stat.exists | default(false))

        - name: Stop and disable the exact legacy Keycloak unit before Quadlet takeover
          ansible.builtin.systemd:
            name: "podman-kube@{{ keycloak_deploy_legacy_systemd_name.stdout }}.service"
            state: stopped
            enabled: false
          when: >-
            keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
            or keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'

        - name: Manage the native Keycloak Quadlet service
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: >-
              {{
                'restarted'
                if (
                  keycloak_deploy_manifest_render.changed | default(false) | bool
                  or keycloak_deploy_kubeplay_remove | default(false) | bool
                  or keycloak_deploy_kubeplay_run | default(false) | bool
                  or keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
                  or keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'
                )
                else 'present'
              }}
            podman_systemd_unit_name: "{{ keycloak_deploy_systemd_unit_name }}"
            podman_systemd_description: "{{ keycloak_deploy_systemd_description }}"
            podman_systemd_manifest_path: "{{ keycloak_deploy_pod_manifest_path }}"
            podman_systemd_scope: "{{ keycloak_deploy_systemd_scope }}"
            podman_systemd_quadlet_dir: "{{ keycloak_deploy_quadlet_dir }}"
            podman_systemd_enabled: "{{ keycloak_deploy_systemd_enabled }}"
            podman_systemd_networks: "{{ keycloak_deploy_networks }}"

        - name: Wait until Keycloak health endpoint is reachable
          ansible.builtin.uri:
            url: "{{ keycloak_deploy_health_url_effective }}"
            method: GET
            validate_certs: "{{ keycloak_deploy_validate_certs }}"
          register: keycloak_deploy_health
          until: keycloak_deploy_health.status == 200
          retries: 30
          delay: 5
          changed_when: false
          failed_when: keycloak_deploy_health is failed or keycloak_deploy_health.status != 200

        - name: Wait until Keycloak liveness endpoint is reachable
          ansible.builtin.uri:
            url: "{{ keycloak_deploy_liveness_url_effective }}"
            method: GET
            validate_certs: "{{ keycloak_deploy_validate_certs }}"
          register: keycloak_deploy_liveness
          until: keycloak_deploy_liveness.status == 200
          retries: 30
          delay: 5
          changed_when: false
          failed_when: keycloak_deploy_liveness is failed or keycloak_deploy_liveness.status != 200

        - name: Inspect the transactional Keycloak database endpoint
          ansible.builtin.command:
            argv:
              - podman
              - container
              - inspect
              - "{{ keycloak_deploy_pod_name }}-{{ keycloak_deploy_container_name }}"
              - --format
              - "{{ '{{json .Config.Env}}' }}"
          register: keycloak_deploy_runtime_environment
          changed_when: false
          no_log: true

        - name: Require the desired database endpoint before committing Keycloak takeover
          ansible.builtin.assert:
            that:
              - >-
                ('KC_DB_URL_HOST=' ~ keycloak_deploy_db_host)
                in (keycloak_deploy_runtime_environment.stdout | from_json)
              - >-
                ('KC_DB_URL_PORT=' ~ keycloak_deploy_db_port | string)
                in (keycloak_deploy_runtime_environment.stdout | from_json)
            fail_msg: >-
              The active Keycloak pod did not consume the desired database
              endpoint; rolling back the native controller.
            quiet: true
          no_log: true
      rescue:
        - name: Capture the original native Keycloak takeover failure
          ansible.builtin.set_fact:
            keycloak_deploy_takeover_failure_message: >-
              {{ ansible_failed_result.msg | default('unknown takeover failure') }}
            keycloak_deploy_cleanup_failure_message: ""
            keycloak_deploy_manifest_restore_failure_message: ""
            keycloak_deploy_native_restore_failure_message: ""
            keycloak_deploy_native_quiescence_failure_message: ""
            keycloak_deploy_legacy_restore_failure_message: ""
            keycloak_deploy_native_quiescence_proven: false

        - name: Attempt failed native Keycloak cleanup without blocking restoration
          block:
            - name: Remove the transaction-created native Keycloak Quadlet
              ansible.builtin.include_role:
                name: lit.foundational.podman_systemd
              vars:
                podman_systemd_action: absent
                podman_systemd_unit_name: "{{ keycloak_deploy_systemd_unit_name }}"
                podman_systemd_description: "{{ keycloak_deploy_systemd_description }}"
                podman_systemd_manifest_path: "{{ keycloak_deploy_pod_manifest_path }}"
                podman_systemd_scope: "{{ keycloak_deploy_systemd_scope }}"
                podman_systemd_quadlet_dir: "{{ keycloak_deploy_quadlet_dir }}"
                podman_systemd_enabled: false
                podman_systemd_networks: "{{ keycloak_deploy_networks }}"
              when: not (keycloak_deploy_native_quadlet_file.stat.exists | default(false))

          rescue:
            - name: Capture failed native Keycloak cleanup
              ansible.builtin.set_fact:
                keycloak_deploy_cleanup_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown cleanup failure') }}

        - name: Attempt exact Keycloak Pod manifest restoration
          block:
            - name: Restore the exact pre-transaction Keycloak Pod manifest
              ansible.builtin.copy:
                dest: "{{ keycloak_deploy_pod_manifest_path }}"
                content: "{{ keycloak_deploy_original_manifest_read.content | b64decode }}"
                owner: "{{ keycloak_deploy_original_manifest_file.stat.uid }}"
                group: "{{ keycloak_deploy_original_manifest_file.stat.gid }}"
                mode: "{{ keycloak_deploy_original_manifest_file.stat.mode }}"
              no_log: true
              when: keycloak_deploy_original_manifest_file.stat.exists | default(false)

            - name: Remove a transaction-created Keycloak Pod manifest
              ansible.builtin.file:
                path: "{{ keycloak_deploy_pod_manifest_path }}"
                state: absent
              when: not (keycloak_deploy_original_manifest_file.stat.exists | default(false))
          rescue:
            - name: Capture failed Keycloak Pod manifest restoration
              ansible.builtin.set_fact:
                keycloak_deploy_manifest_restore_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown manifest restoration failure') }}

        - name: Attempt pre-existing native Keycloak service-state restoration
          block:
            - name: Restore enabled or disabled native Keycloak service state after failure
              ansible.builtin.systemd:
                name: "{{ keycloak_deploy_systemd_unit_name }}.service"
                state: >-
                  {{ 'restarted' if keycloak_deploy_native_systemd_active.stdout | trim == 'active' else 'stopped' }}
                enabled: >-
                  {{ keycloak_deploy_native_systemd_enabled.stdout | trim == 'enabled' }}
                scope: "{{ keycloak_deploy_systemd_scope }}"
              when: keycloak_deploy_native_systemd_enabled.stdout | trim in ['enabled', 'disabled']

            - name: Restore generated native Keycloak service state after failure
              ansible.builtin.systemd:
                name: "{{ keycloak_deploy_systemd_unit_name }}.service"
                state: >-
                  {{ 'restarted' if keycloak_deploy_native_systemd_active.stdout | trim == 'active' else 'stopped' }}
                scope: "{{ keycloak_deploy_systemd_scope }}"
              when: keycloak_deploy_native_systemd_enabled.stdout | trim == 'generated'
          rescue:
            - name: Capture failed pre-existing native Keycloak restoration
              ansible.builtin.set_fact:
                keycloak_deploy_native_restore_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown native restoration failure') }}

        - name: Prove the failed native Keycloak controller is inactive
          when: >-
            keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
            or keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'
          block:
            - name: Inspect native Keycloak activity after failed cleanup
              ansible.builtin.command:
                argv: >-
                  {{ ['systemctl']
                     + (['--user'] if keycloak_deploy_systemd_scope == 'user' else [])
                     + ['is-active', keycloak_deploy_systemd_unit_name ~ '.service'] }}
              register: keycloak_deploy_native_activity_after_cleanup
              changed_when: false
              failed_when: false

            - name: Require native Keycloak inactivity before legacy restoration
              ansible.builtin.assert:
                that:
                  - keycloak_deploy_native_activity_after_cleanup.rc in [3, 4]
                  - >-
                    keycloak_deploy_native_activity_after_cleanup.stdout | trim
                    in ['inactive', 'failed', 'unknown']
                fail_msg: >-
                  The failed native Keycloak controller is not proven inactive;
                  refusing to start the legacy controller in parallel.
                quiet: true

            - name: Record proven native Keycloak inactivity
              ansible.builtin.set_fact:
                keycloak_deploy_native_quiescence_proven: true
          rescue:
            - name: Capture unproven native Keycloak inactivity
              ansible.builtin.set_fact:
                keycloak_deploy_native_quiescence_failure_message: >-
                  {{ ansible_failed_result.msg | default('native controller inactivity is unproven') }}

        - name: Attempt exact legacy Keycloak restoration after failed takeover
          block:
            - name: Restore the exact legacy Keycloak service state
              ansible.builtin.systemd:
                name: "podman-kube@{{ keycloak_deploy_legacy_systemd_name.stdout }}.service"
                state: >-
                  {{ 'started' if keycloak_deploy_legacy_systemd_active.stdout | trim == 'active' else 'stopped' }}
                enabled: >-
                  {{ keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled' }}
              when:
                - keycloak_deploy_native_quiescence_proven | bool
                - >-
                  keycloak_deploy_legacy_systemd_active.stdout | trim == 'active'
                  or keycloak_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'
          rescue:
            - name: Capture failed legacy Keycloak restoration
              ansible.builtin.set_fact:
                keycloak_deploy_legacy_restore_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown legacy restoration failure') }}

        - name: Report failed native Keycloak takeover after rollback
          ansible.builtin.fail:
            msg: >-
              Native Keycloak Quadlet takeover failed:
              {{ keycloak_deploy_takeover_failure_message }}.
              Cleanup failure:
              {{ keycloak_deploy_cleanup_failure_message | default('') | default('none', true) }}.
              Manifest restoration failure:
              {{ keycloak_deploy_manifest_restore_failure_message | default('') | default('none', true) }}.
              Native restoration failure:
              {{ keycloak_deploy_native_restore_failure_message | default('') | default('none', true) }}.
              Native quiescence failure:
              {{ keycloak_deploy_native_quiescence_failure_message | default('') | default('none', true) }}.
              Legacy restoration failure:
              {{ keycloak_deploy_legacy_restore_failure_message | default('') | default('none', true) }}.
