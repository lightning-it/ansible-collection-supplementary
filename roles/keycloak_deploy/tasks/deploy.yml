---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  when: ansible_os_family in ['RedHat', 'Debian']

- name: Skip Keycloak runtime deployment in check mode
  ansible.builtin.debug:
    msg: "Keycloak runtime deployment skipped in check mode."
  when:
    - ansible_check_mode
    - not keycloak_deploy_skip_runtime | bool
    - not keycloak_deploy_skip_deploy | bool
  tags: always

- name: Deploy Keycloak runtime
  when:
    - not keycloak_deploy_skip_runtime | bool
    - not keycloak_deploy_skip_deploy | bool
    - not ansible_check_mode
  block:
    - name: Jointly migrate existing native Keycloak and database networks
      ansible.builtin.include_tasks: native_network_migration.yml
      when: keycloak_deploy_native_network_migration | bool

    - name: Ensure required packages are installed
      ansible.builtin.include_tasks: install_packages.yml
      when: keycloak_deploy_install_packages | bool
      tags:
        - install

    - name: Prepare explicitly pinned Keycloak outbound certificate trust
      ansible.builtin.include_tasks: certificate_trust.yml
      when: keycloak_deploy_trust_ca_certificate | length > 0

    - name: Deploy Keycloak Pod
      ansible.builtin.include_tasks: deploy_pod.yml
      tags:
        - deployment

    - name: Install systemd unit for Keycloak Pod
      ansible.builtin.include_tasks: systemd.yml
      when: keycloak_deploy_manage_systemd | bool
      tags:
        - systemd

    - name: Inspect the effective Keycloak environment
      ansible.builtin.command:
        argv:
          - podman
          - container
          - inspect
          - "{{ keycloak_deploy_pod_name }}-{{ keycloak_deploy_container_name }}"
          - --format
          - "{{ '{{json .Config.Env}}' }}"
      register: keycloak_deploy_runtime_environment
      changed_when: false
      no_log: true
      when: not keycloak_deploy_manage_systemd | bool
      tags:
        - deployment

    - name: Require the desired database endpoint in the active Keycloak pod
      ansible.builtin.assert:
        that:
          - >-
            ('KC_DB_URL_HOST=' ~ keycloak_deploy_db_host)
            in (keycloak_deploy_runtime_environment.stdout | from_json)
          - >-
            ('KC_DB_URL_PORT=' ~ keycloak_deploy_db_port | string)
            in (keycloak_deploy_runtime_environment.stdout | from_json)
        fail_msg: >-
          The active Keycloak pod did not consume the desired database endpoint.
        quiet: true
      no_log: true
      when: not keycloak_deploy_manage_systemd | bool
      tags:
        - deployment

    - name: Validate managed database DNS from the non-systemd Keycloak container
      ansible.builtin.include_tasks: validate_database_dns.yml
      vars:
        keycloak_deploy_database_dns_probe_container: >-
          {{ keycloak_deploy_pod_name }}-{{ keycloak_deploy_container_name }}
      when:
        - not keycloak_deploy_manage_systemd | bool
        - keycloak_deploy_manage_postgres | bool
        - not keycloak_deploy_host_network | bool
        - not keycloak_deploy_postgres_host_network | bool
        - not keycloak_deploy_db_host is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
      tags:
        - deployment

    - name: Wait until Keycloak health endpoint is reachable (non-systemd)
      ansible.builtin.uri:
        url: "{{ keycloak_deploy_health_url_effective }}"
        method: GET
        validate_certs: "{{ keycloak_deploy_validate_certs }}"
      register: keycloak_deploy_health
      until: keycloak_deploy_health.status == 200
      retries: 30
      delay: 5
      changed_when: false
      failed_when: keycloak_deploy_health is failed or keycloak_deploy_health.status != 200
      when: not keycloak_deploy_manage_systemd | bool
      tags:
        - deployment
        - api

    - name: Wait until Keycloak liveness endpoint is reachable (non-systemd)
      ansible.builtin.uri:
        url: "{{ keycloak_deploy_liveness_url_effective }}"
        method: GET
        validate_certs: "{{ keycloak_deploy_validate_certs }}"
      register: keycloak_deploy_liveness
      until: keycloak_deploy_liveness.status == 200
      retries: 30
      delay: 5
      changed_when: false
      failed_when: keycloak_deploy_liveness is failed or keycloak_deploy_liveness.status != 200
      when: not keycloak_deploy_manage_systemd | bool
      tags:
        - deployment
        - api
