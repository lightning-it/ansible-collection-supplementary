---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  when: keycloak_deploy_systemd_scope != 'user'
  tags: always

- name: Deploy rootless Keycloak runtime
  ansible.builtin.include_tasks: rootless.yml
  when: keycloak_deploy_systemd_scope == 'user'

- name: Deploy Keycloak runtime
  ansible.builtin.include_tasks: deploy.yml
  when: keycloak_deploy_systemd_scope != 'user'
