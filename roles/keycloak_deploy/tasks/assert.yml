---
- name: Ensure core Keycloak deploy variables are valid
  ansible.builtin.assert:
    that:
      - keycloak_deploy_pod_name | default('', true) | trim | length > 0
      - keycloak_deploy_pod_manifest_path | default('', true) | trim | length > 0
      - keycloak_deploy_image | default('', true) | trim | length > 0
      - keycloak_deploy_manage_postgres is boolean
      - keycloak_deploy_postgres_image | default('', true) | trim | length > 0
      - keycloak_deploy_postgres_pod_name | default('', true) | trim | length > 0
      - keycloak_deploy_postgres_pod_manifest_path | default('', true) | trim | length > 0
      - keycloak_deploy_postgres_container_name | default('', true) | trim | length > 0
      - keycloak_deploy_host_data_dir | default('', true) | trim | length > 0
      - keycloak_deploy_postgres_data_dir | default('', true) | trim | length > 0
      - keycloak_deploy_config_dir | default('', true) | trim | length > 0
      - keycloak_deploy_secrets_file | default('', true) | trim | length > 0
      - keycloak_deploy_container_data_dir | default('', true) | trim | length > 0
      - keycloak_deploy_container_postgres_data_dir | default('', true) | trim | length > 0
      - keycloak_deploy_db_vendor in ['postgres']
      - keycloak_deploy_db_name | default('', true) | trim | length > 0
      - keycloak_deploy_db_user | default('', true) | trim | length > 0
      - keycloak_deploy_db_host | default('', true) | trim | length > 0
      - >-
        keycloak_deploy_host_network | bool or
        keycloak_deploy_db_host | trim not in ['127.0.0.1', '::1', 'localhost']
      - keycloak_deploy_db_wait_host | default('', true) | trim | length > 0
      - keycloak_deploy_db_port | int > 0
      - keycloak_deploy_postgres_port | int > 0
      - keycloak_deploy_postgres_container_port | int > 0
      - keycloak_deploy_postgres_container_port | int <= 65535
      - >-
        not keycloak_deploy_manage_postgres | bool
        or keycloak_deploy_postgres_container_port | int == 5432
      - keycloak_deploy_db_wait_port | int > 0
      - keycloak_deploy_postgres_wait_timeout | int > 0
      - keycloak_deploy_postgres_wait_delay | int >= 0
      - keycloak_deploy_prestart_health_timeout | int > 0
      - keycloak_deploy_port | int > 0
      - keycloak_deploy_management_port | int > 0
      - keycloak_deploy_management_port | int != keycloak_deploy_port | int
      - keycloak_deploy_host_ip | default('', true) | trim | length > 0
      - keycloak_deploy_host_network is boolean
      - keycloak_deploy_networks is sequence
      - keycloak_deploy_networks is not string
      - >-
        keycloak_deploy_networks | select('string') | list | length
        == keycloak_deploy_networks | length
      - >-
        keycloak_deploy_networks | map('trim') | reject('equalto', '') | list | length
        == keycloak_deploy_networks | length
      - >-
        keycloak_deploy_networks
        | select(
            'match',
            '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}'
            ~ '(?::ip=[0-9]{1,3}(?:[.][0-9]{1,3}){3})?$'
          )
        | list | length == keycloak_deploy_networks | length
      - keycloak_deploy_postgres_networks is sequence
      - keycloak_deploy_postgres_networks is not string
      - >-
        keycloak_deploy_postgres_networks | select('string') | list | length
        == keycloak_deploy_postgres_networks | length
      - >-
        keycloak_deploy_postgres_networks | map('trim') | reject('equalto', '') | list | length
        == keycloak_deploy_postgres_networks | length
      - >-
        keycloak_deploy_postgres_networks
        | select(
            'match',
            '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}'
            ~ '(?::ip=[0-9]{1,3}(?:[.][0-9]{1,3}){3})?$'
          )
        | list | length == keycloak_deploy_postgres_networks | length
      - >-
        not keycloak_deploy_manage_postgres | bool
        or keycloak_deploy_postgres_host_network | bool
        or keycloak_deploy_host_network | bool
        or (
          (
            keycloak_deploy_networks | length == 0
            and keycloak_deploy_postgres_networks | length == 0
          )
          or (
            keycloak_deploy_networks
            | map('regex_replace', ':.*$', '')
            | list
            | intersect(
                keycloak_deploy_postgres_networks
                | map('regex_replace', ':.*$', '')
                | list
              )
            | length > 0
          )
        )
      - keycloak_deploy_postgres_host_ip | default('', true) | trim | length > 0
      - keycloak_deploy_postgres_host_network is boolean
      - keycloak_deploy_admin_user | default('', true) | trim | length > 0
      - keycloak_deploy_start_command in ['start', 'start-dev']
      - keycloak_deploy_run_user_uid | default('', true) | trim | length > 0
      - keycloak_deploy_run_user_gid | default('', true) | trim | length > 0
      - keycloak_deploy_extra_start_args is sequence
      - keycloak_deploy_extra_start_args is not string
      - >-
        keycloak_deploy_extra_start_args | select('string') | list | length
        == keycloak_deploy_extra_start_args | length
      - >-
        keycloak_deploy_extra_start_args
        | select(
            'match',
            '^--(?:db(?:$|[-=])|proxy(?:$|[-=])|hostname(?:$|[-=])'
            ~ '|http(?:$|[-=])|health-enabled(?:$|=)|bootstrap-admin-)'
          )
        | list | length == 0
      - keycloak_deploy_proxy_headers in ['', 'forwarded', 'xforwarded']
      - >-
        keycloak_deploy_proxy_headers | trim | length == 0
        or keycloak_deploy_manage_systemd | bool
      - >-
        keycloak_deploy_proxy_headers | trim | length == 0
        or (
          not (keycloak_deploy_host_network | bool)
          and
          keycloak_deploy_host_ip | trim in ['127.0.0.1', '::1']
          and keycloak_deploy_networks | length > 0
        )
      - keycloak_deploy_proxy_trusted_addresses is sequence
      - keycloak_deploy_proxy_trusted_addresses is not string
      - >-
        keycloak_deploy_proxy_trusted_addresses | select('string') | list | length
        == keycloak_deploy_proxy_trusted_addresses | length
      - >-
        keycloak_deploy_proxy_headers | trim | length == 0 or
        keycloak_deploy_proxy_trusted_addresses | length > 0
      - >-
        keycloak_deploy_proxy_trusted_addresses
        | map('trim')
        | reject('equalto', '')
        | list
        | length
        == keycloak_deploy_proxy_trusted_addresses | length
      - keycloak_deploy_install_packages is boolean
      - keycloak_deploy_manage_systemd is boolean
      - >-
        not keycloak_deploy_manage_postgres | bool
        or keycloak_deploy_host_network | bool
        or keycloak_deploy_postgres_host_network | bool
        or keycloak_deploy_manage_systemd | bool
      - >-
        not keycloak_deploy_manage_systemd | bool
        or keycloak_deploy_skip_runtime | bool
        or keycloak_deploy_skip_deploy | bool
        or (
          ansible_service_mgr
          | default(ansible_facts.get('service_mgr', ''), true)
        ) == 'systemd'
      - >-
        not (keycloak_deploy_manage_systemd | bool)
        or (
          keycloak_deploy_systemd_unit_name is string
          and keycloak_deploy_systemd_unit_name | length <= 240
          and keycloak_deploy_systemd_unit_name
          is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        )
      - >-
        not (keycloak_deploy_manage_systemd | bool)
        or (
          keycloak_deploy_systemd_description is string
          and keycloak_deploy_systemd_description | trim | length > 0
          and '\n' not in keycloak_deploy_systemd_description
          and '\r' not in keycloak_deploy_systemd_description
        )
      - >-
        not (keycloak_deploy_manage_systemd | bool)
        or keycloak_deploy_systemd_scope == 'system'
      - keycloak_deploy_quadlet_dir is string
      - keycloak_deploy_quadlet_dir == '/etc/containers/systemd'
      - keycloak_deploy_systemd_enabled is boolean
      - >-
        not (
          keycloak_deploy_manage_postgres | bool
          and keycloak_deploy_manage_systemd | bool
        )
        or keycloak_deploy_systemd_enabled | bool
      - keycloak_deploy_skip_runtime is boolean
      - keycloak_deploy_skip_deploy is boolean
      - keycloak_deploy_generate_secrets is boolean
      - keycloak_deploy_store_generated_secrets is boolean
      - keycloak_deploy_validate_certs is boolean
      - keycloak_deploy_generated_db_password_length | int >= 16
      - keycloak_deploy_generated_admin_password_length | int >= 16
      - keycloak_deploy_env_extra is mapping
      - keycloak_deploy_trust_ca_certificate is string
      - keycloak_deploy_trust_ca_sha256 is string
      - >-
        keycloak_deploy_trust_ca_certificate | length == 0 or (
          keycloak_deploy_trust_ca_certificate is search('-----BEGIN CERTIFICATE-----')
          and keycloak_deploy_trust_ca_certificate is search('-----END CERTIFICATE-----')
          and 'PRIVATE KEY' not in keycloak_deploy_trust_ca_certificate
          and keycloak_deploy_trust_ca_sha256 is match('^(?:[a-f0-9]{2}:){31}[a-f0-9]{2}$')
          and 'KC_TRUSTSTORE_PATHS' not in keycloak_deploy_env_extra
        )
      - >-
        keycloak_deploy_env_extra.keys()
        | select(
            'match',
            '^(KC_DB($|_)|KC_PROXY_|KEYCLOAK_ADMIN|KC_(HEALTH_ENABLED|HTTP_(ENABLED|RELATIVE_PATH)|HOSTNAME)$)'
          )
        | list | length == 0
    fail_msg: "Keycloak deploy variables are missing or invalid."
  tags: always

- name: Validate managed PostgreSQL native unit identity
  ansible.builtin.assert:
    that:
      - keycloak_deploy_postgres_systemd_unit_name is string
      - keycloak_deploy_postgres_systemd_unit_name | length <= 240
      - keycloak_deploy_postgres_systemd_unit_name is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
    quiet: true
    fail_msg: Managed PostgreSQL requires a native unit identity accepted by its deployment role.
  when:
    - keycloak_deploy_manage_postgres | bool
    - keycloak_deploy_manage_systemd | bool
  tags: always

- name: Validate explicit coupled native migration scope
  ansible.builtin.assert:
    that:
      - keycloak_deploy_native_network_migration is boolean
      - keycloak_deploy_native_previous_networks is mapping
      - keycloak_deploy_native_network_runtime_names is mapping
      - >-
        not keycloak_deploy_native_network_migration or
        (keycloak_deploy_manage_postgres and keycloak_deploy_manage_systemd
        and keycloak_deploy_systemd_scope == 'system' and keycloak_deploy_systemd_enabled
        and not keycloak_deploy_host_network and not keycloak_deploy_postgres_host_network
        and keycloak_deploy_native_previous_networks.keys() | sort == ['keycloak', 'postgres'])
    fail_msg: Coupled migration requires explicit prior bindings and two managed native system services.
    quiet: true
  tags: always

- name: Validate static IPv4 addresses in Keycloak Quadlet network entries
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.get('python', {}).get('executable', '/usr/bin/python3') }}"
      - -c
      - >-
        import ipaddress,sys; address=ipaddress.ip_address(sys.argv[1]);
        sys.exit(0 if address.version == 4 else 1)
      - "{{ item.split(':ip=', 1)[1] }}"
  loop: "{{ keycloak_deploy_networks + keycloak_deploy_postgres_networks }}"
  loop_control:
    label: "{{ item.split(':ip=', 1)[0] }}"
  changed_when: false
  check_mode: false
  when: "':ip=' in item"
  tags: always

- name: Validate the managed private PostgreSQL endpoint
  ansible.builtin.assert:
    that:
      - >-
        keycloak_deploy_db_host | lit.supplementary.keycloak_private_database_endpoint_valid(
          keycloak_deploy_networks, keycloak_deploy_postgres_networks,
          keycloak_deploy_postgres_pod_name, keycloak_deploy_postgres_container_name)
    quiet: true
    fail_msg: Managed PostgreSQL requires its exact pod/container DNS name or a bound private shared-network address.
  when:
    - keycloak_deploy_manage_postgres | bool
    - not keycloak_deploy_host_network | bool
    - not keycloak_deploy_postgres_host_network | bool
  tags: always

- name: Validate trusted Keycloak proxy address syntax
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.get('python', {}).get('executable', '/usr/bin/python3') }}"
      - -c
      - "import ipaddress, sys; ipaddress.ip_network(sys.argv[1], strict=False)"
      - "{{ item }}"
  loop: "{{ keycloak_deploy_proxy_trusted_addresses }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  check_mode: false
  tags: always
