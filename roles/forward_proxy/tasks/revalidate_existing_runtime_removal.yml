---
- name: Reinspect the owned Quadlet at the runtime removal boundary
  ansible.builtin.stat:
    path: "{{ forward_proxy_quadlet_path }}"
    follow: false
    checksum_algorithm: sha256
  register: forward_proxy_existing_runtime_removal_quadlet

- name: Reinspect the existing Podman pod at the removal boundary
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - pod
      - inspect
      - --format
      - >-
        {{ '{{.Id}}|{{ index .Labels "io.lightning-it.owner" }}' }}
      - "{{ forward_proxy_unit_name }}"
  register: forward_proxy_existing_runtime_removal_pod
  changed_when: false
  failed_when: forward_proxy_existing_runtime_removal_pod.rc != 0
  check_mode: false

- name: Reinspect the existing systemd fragment at the removal boundary
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - --system
      - show
      - "{{ forward_proxy_unit_name }}.service"
      - --property=FragmentPath
      - --value
  register: forward_proxy_existing_runtime_removal_unit
  changed_when: false
  failed_when: forward_proxy_existing_runtime_removal_unit.rc != 0
  check_mode: false

- name: Require the exact captured existing runtime before removal
  ansible.builtin.assert:
    that:
      - >-
        forward_proxy_existing_runtime_removal_authorization_internal | default({})
        == {
          'authorized': true,
          'unit_name': forward_proxy_unit_name,
          'quadlet_path': forward_proxy_quadlet_path,
          'quadlet_checksum': forward_proxy_existing_runtime_removal_quadlet.stat.checksum,
          'pod_id': (forward_proxy_existing_runtime_removal_pod.stdout | trim).split('|')[0],
          'owner_label': (forward_proxy_existing_runtime_removal_pod.stdout | trim).split('|')[1],
          'unit_fragment_path': forward_proxy_existing_runtime_removal_unit.stdout | trim
        }
      - forward_proxy_existing_runtime_removal_quadlet.stat.isreg | default(false)
      - not forward_proxy_existing_runtime_removal_quadlet.stat.islnk | default(false)
      - forward_proxy_existing_runtime_removal_quadlet.stat.mode == '0644'
      - forward_proxy_existing_runtime_removal_quadlet.stat.pw_name | default('') == 'root'
      - forward_proxy_existing_runtime_removal_quadlet.stat.gr_name | default('') == 'root'
      - >-
        (forward_proxy_existing_runtime_removal_pod.stdout | trim).split('|')[0]
        is match('^[a-f0-9]{12,64}\Z')
      - >-
        (forward_proxy_existing_runtime_removal_pod.stdout | trim).split('|')[1]
        == 'lit.supplementary.forward_proxy'
      - >-
        forward_proxy_existing_runtime_removal_unit.stdout | trim
        is match(
          '^/run/systemd/generator(?:\\.early|\\.late)?/'
          ~ (forward_proxy_unit_name | regex_escape)
          ~ '\\.service\\Z'
        )
    fail_msg: >-
      The existing runtime no longer matches the captured Quadlet checksum, Pod
      ID, and systemd fragment. Leave it intact for operator recovery.
