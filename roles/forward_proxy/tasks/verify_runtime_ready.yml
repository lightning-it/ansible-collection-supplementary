---
- name: Verify the managed Squid Pod is running
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - pod
      - ps
      - --filter
      - "name=^{{ forward_proxy_unit_name }}$"
      - --filter
      - status=running
      - --format
      - "{{ '{{.Name}}' }}"
  register: forward_proxy_running_pod
  changed_when: false
  failed_when: forward_proxy_running_pod.stdout_lines != [forward_proxy_unit_name]
  check_mode: false

- name: Wait for the local Squid listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ forward_proxy_port }}"
    state: started
    timeout: "{{ forward_proxy_readiness_timeout }}"
  check_mode: false
