---
- name: Inspect the forward proxy managed-state marker
  ansible.builtin.stat:
    path: "{{ forward_proxy_state_marker_path }}"
    follow: false
  register: forward_proxy_state_marker

- name: Validate the forward proxy managed-state marker file type
  ansible.builtin.assert:
    that:
      - forward_proxy_state_marker.stat.isreg | default(false)
      - not forward_proxy_state_marker.stat.islnk | default(false)
      - forward_proxy_state_marker.stat.mode == '0600'
      - >-
        forward_proxy_state_marker.stat.pw_name | default('') == forward_proxy_file_owner | string
        or forward_proxy_state_marker.stat.uid | string == forward_proxy_file_owner | string
      - >-
        forward_proxy_state_marker.stat.gr_name | default('') == forward_proxy_file_group | string
        or forward_proxy_state_marker.stat.gid | string == forward_proxy_file_group | string
    fail_msg: "The forward proxy state marker must be a regular non-symlink file."
  when: forward_proxy_state_marker.stat.exists

- name: Initialize the check-mode forward proxy directory plan
  ansible.builtin.set_fact:
    forward_proxy_planned_directories_internal: []

- name: Create and revalidate every trusted forward proxy parent boundary
  ansible.builtin.include_tasks: ensure_directory.yml
  loop: "{{ forward_proxy_trusted_parent_paths }}"
  loop_control:
    loop_var: forward_proxy_directory_path
  vars:
    forward_proxy_directory_creation_allowed: >-
      {{
        forward_proxy_enabled | bool
        and (
          (
            forward_proxy_file_owner in ['root', '0']
            and forward_proxy_file_group in ['root', '0']
          )
          or forward_proxy_directory_path == forward_proxy_render_root
          or forward_proxy_directory_path.startswith(forward_proxy_render_root.rstrip('/') ~ '/')
        )
      }}
  when:
    - forward_proxy_enabled | bool or forward_proxy_state_marker.stat.exists
    - >-
      forward_proxy_directory_path in forward_proxy_managed_directories_internal
      or (
        forward_proxy_managed_directories_internal
        | select(
            'match',
            '^' ~ (forward_proxy_directory_path | regex_escape) ~ '/'
          )
        | list | length > 0
      )
      or (
        forward_proxy_manage_runtime | bool
        and (
          forward_proxy_directory_path == forward_proxy_quadlet_dir
          or forward_proxy_quadlet_dir.startswith(forward_proxy_directory_path.rstrip('/') ~ '/')
        )
      )

- name: Capture every trusted proxy directory identity for this transaction
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ forward_proxy_trusted_parent_paths }}"
  register: forward_proxy_trusted_parent_identity_stats
  when:
    - forward_proxy_enabled | bool or forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Initialize trusted proxy directory identity bindings
  ansible.builtin.set_fact:
    forward_proxy_trusted_parent_identity_map_internal: {}
  when: not ansible_check_mode

- name: Bind trusted proxy directory devices and inodes to this transaction
  ansible.builtin.set_fact:
    forward_proxy_trusted_parent_identity_map_internal: >-
      {{
        forward_proxy_trusted_parent_identity_map_internal
        | combine(
            {
              item.item: {
                'device': item.stat.dev,
                'inode': item.stat.inode
              }
            }
          )
      }}
  loop: "{{ forward_proxy_trusted_parent_identity_stats.results | default([]) }}"
  when:
    - not ansible_check_mode
    - item.stat.isdir | default(false)

- name: Inspect unowned forward proxy target paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: >-
    {{
      forward_proxy_managed_paths_internal
      + [forward_proxy_quadlet_path]
      + [forward_proxy_state_marker_path]
    }}
  register: forward_proxy_unowned_target_stats
  when: not forward_proxy_state_marker.stat.exists

- name: Refuse to adopt unowned forward proxy target paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists
      - not item.stat.islnk | default(false)
    fail_msg: >-
      A forward proxy target already exists without the exact role ownership
      marker. Stop before overwriting a potentially foreign file.
  loop: "{{ forward_proxy_unowned_target_stats.results | default([]) }}"
  when: not forward_proxy_state_marker.stat.exists

- name: Read the forward proxy managed-state marker
  ansible.builtin.slurp:
    src: "{{ forward_proxy_state_marker_path }}"
  register: forward_proxy_state_marker_content
  when: forward_proxy_state_marker.stat.exists

- name: Decode the previous forward proxy managed state
  ansible.builtin.set_fact:
    forward_proxy_previous_state_manifest: >-
      {{ forward_proxy_state_marker_content.content | b64decode | from_json }}
  when: forward_proxy_state_marker.stat.exists

- name: Initialize empty previous forward proxy state
  ansible.builtin.set_fact:
    forward_proxy_previous_state_manifest: {}
  when: not forward_proxy_state_marker.stat.exists

- name: Validate the exact previous forward proxy ownership manifest
  ansible.builtin.assert:
    that:
      - forward_proxy_previous_state_manifest is mapping
      - >-
        forward_proxy_previous_state_manifest.keys() | list | sort
        == [
          'managed_checksums',
          'managed_modes',
          'managed_paths',
          'owner',
          'quadlet_checksum',
          'quadlet_path',
          'runtime_managed',
          'schema',
          'unit_name'
        ]
      - forward_proxy_previous_state_manifest.schema == 'lit.supplementary.forward_proxy.managed-state/v4'
      - forward_proxy_previous_state_manifest.owner == 'lit.supplementary.forward_proxy'
      - forward_proxy_previous_state_manifest.unit_name == forward_proxy_unit_name
      - forward_proxy_previous_state_manifest.quadlet_path == forward_proxy_quadlet_path
      - >-
        (
          forward_proxy_previous_state_manifest.runtime_managed | bool
          and forward_proxy_previous_state_manifest.quadlet_checksum
            is match('^[a-f0-9]{64}\Z')
        )
        or (
          not forward_proxy_previous_state_manifest.runtime_managed | bool
          and forward_proxy_previous_state_manifest.quadlet_checksum == ''
        )
      - forward_proxy_previous_state_manifest.runtime_managed is boolean
      - forward_proxy_previous_state_manifest.managed_paths is sequence
      - forward_proxy_previous_state_manifest.managed_paths is not string
      - forward_proxy_previous_state_manifest.managed_checksums is sequence
      - forward_proxy_previous_state_manifest.managed_checksums is not string
      - forward_proxy_previous_state_manifest.managed_modes is sequence
      - forward_proxy_previous_state_manifest.managed_modes is not string
      - >-
        forward_proxy_previous_state_manifest.managed_checksums | length
        == forward_proxy_previous_state_manifest.managed_paths | length
      - >-
        forward_proxy_previous_state_manifest.managed_modes | length
        == forward_proxy_previous_state_manifest.managed_paths | length
      - >-
        forward_proxy_previous_state_manifest.managed_modes
        == forward_proxy_managed_modes_internal
      - >-
        forward_proxy_previous_state_manifest.managed_checksums
        | reject('match', '^[a-f0-9]{64}\Z') | list | length == 0
      - >-
        forward_proxy_previous_state_manifest.managed_paths | unique | list | length
        == forward_proxy_previous_state_manifest.managed_paths | length
      - >-
        forward_proxy_managed_paths_internal
        | difference(forward_proxy_previous_state_manifest.managed_paths)
        | length == 0
      - >-
        forward_proxy_previous_state_manifest.managed_paths
        | difference(forward_proxy_managed_paths_internal) | length == 0
    fail_msg: >-
      Existing forward proxy state is not the exact role-owned manifest for
      this unit, runtime mode, and path set. Stop before removing or replacing
      any file.
  when: forward_proxy_state_marker.stat.exists

- name: Require the declared Quadlet parent chain before runtime removal
  ansible.builtin.assert:
    that:
      - forward_proxy_quadlet_dir in forward_proxy_trusted_parent_paths
    fail_msg: >-
      Removing a previously managed runtime requires the exact Quadlet
      directory and its ordered canonical parent chain.
  when:
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not forward_proxy_manage_runtime | bool

- name: Revalidate the Quadlet parent chain before runtime removal
  ansible.builtin.include_tasks: ensure_directory.yml
  loop: "{{ forward_proxy_trusted_parent_paths }}"
  loop_control:
    loop_var: forward_proxy_directory_path
  vars:
    forward_proxy_directory_creation_allowed: false
  when:
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not forward_proxy_manage_runtime | bool
    - >-
      forward_proxy_directory_path == forward_proxy_quadlet_dir
      or forward_proxy_quadlet_dir.startswith(forward_proxy_directory_path.rstrip('/') ~ '/')

- name: Inspect the render-only Quadlet ownership boundary
  ansible.builtin.stat:
    path: "{{ forward_proxy_quadlet_path }}"
    follow: false
  register: forward_proxy_render_only_quadlet_stat
  when:
    - forward_proxy_manage_runtime | bool
    - forward_proxy_state_marker.stat.exists
    - not forward_proxy_previous_state_manifest.runtime_managed | bool

- name: Refuse to adopt a foreign Quadlet during runtime activation
  ansible.builtin.assert:
    that:
      - not forward_proxy_render_only_quadlet_stat.stat.exists
      - not forward_proxy_render_only_quadlet_stat.stat.islnk | default(false)
    fail_msg: >-
      A Quadlet exists without checksum-bound runtime ownership. Stop before
      enabling, updating, or rolling back the managed proxy runtime.
  when:
    - forward_proxy_manage_runtime | bool
    - forward_proxy_state_marker.stat.exists
    - not forward_proxy_previous_state_manifest.runtime_managed | bool

- name: Inspect previously managed forward proxy files
  ansible.builtin.stat:
    path: "{{ item.0.0 }}"
    follow: false
    checksum_algorithm: sha256
  loop: >-
    {{
      forward_proxy_previous_state_manifest.managed_paths
      | zip(forward_proxy_previous_state_manifest.managed_checksums)
      | zip(forward_proxy_previous_state_manifest.managed_modes)
      | list
    }}
  register: forward_proxy_previous_asset_stats
  when: forward_proxy_state_marker.stat.exists

- name: Verify previously managed forward proxy file ownership
  ansible.builtin.assert:
    that:
      - >-
        (
          not forward_proxy_enabled | bool
          and not item.stat.exists
          and not item.stat.islnk | default(false)
        )
        or (
          item.stat.exists
          and (
            item.stat.isreg | default(false)
            and not item.stat.islnk | default(false)
            and item.stat.checksum == item.item.0.1
            and item.stat.mode == item.item.1
            and (
              item.stat.pw_name | default('') == forward_proxy_file_owner | string
              or item.stat.uid | string == forward_proxy_file_owner | string
            )
            and (
              item.stat.gr_name | default('') == forward_proxy_file_group | string
              or item.stat.gid | string == forward_proxy_file_group | string
            )
          )
        )
    fail_msg: >-
      A previously managed proxy path changed type or content. Stop before
      overwriting or deleting it.
  loop: "{{ forward_proxy_previous_asset_stats.results | default([]) }}"

- name: Preserve previously managed forward proxy file content
  ansible.builtin.slurp:
    src: "{{ item.item.0.0 }}"
  loop: "{{ forward_proxy_previous_asset_stats.results | default([]) }}"
  when: item.stat.exists
  register: forward_proxy_previous_asset_contents

- name: Inspect the previously managed forward proxy Quadlet
  ansible.builtin.stat:
    path: "{{ forward_proxy_previous_state_manifest.quadlet_path }}"
    follow: false
    checksum_algorithm: sha256
  register: forward_proxy_previous_quadlet_stat
  when:
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.quadlet_checksum | length > 0

- name: Verify the previously managed forward proxy Quadlet identity
  ansible.builtin.assert:
    that:
      - >-
        (
          not forward_proxy_enabled | bool
          and not forward_proxy_previous_quadlet_stat.stat.exists
          and not forward_proxy_previous_quadlet_stat.stat.islnk | default(false)
        )
        or (
          forward_proxy_previous_quadlet_stat.stat.exists
          and (
            forward_proxy_previous_quadlet_stat.stat.isreg | default(false)
            and not forward_proxy_previous_quadlet_stat.stat.islnk | default(false)
            and forward_proxy_previous_quadlet_stat.stat.checksum
              == forward_proxy_previous_state_manifest.quadlet_checksum
            and forward_proxy_previous_quadlet_stat.stat.mode == '0644'
            and forward_proxy_previous_quadlet_stat.stat.pw_name | default('') == 'root'
            and forward_proxy_previous_quadlet_stat.stat.gr_name | default('') == 'root'
          )
        )
    fail_msg: >-
      The delegated Quadlet changed type or content. Stop before removing or
      replacing a potentially foreign unit.
  when:
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.quadlet_checksum | length > 0

- name: Preserve the previously managed forward proxy Quadlet
  ansible.builtin.slurp:
    src: "{{ forward_proxy_previous_state_manifest.quadlet_path }}"
  register: forward_proxy_previous_quadlet_content
  when:
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_previous_quadlet_stat.stat.exists

- name: Capture the existing runtime identity before any runtime mutation
  ansible.builtin.include_tasks: capture_existing_runtime_removal.yml
  when:
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - >-
      forward_proxy_enabled | bool
      or forward_proxy_previous_quadlet_stat.stat.exists
    - not ansible_check_mode

- name: Require owned Quadlet evidence before runtime removal
  ansible.builtin.assert:
    that:
      - forward_proxy_previous_state_manifest.quadlet_checksum is match('^[a-f0-9]{64}\Z')
    fail_msg: "Runtime removal requires the exact previously recorded Quadlet checksum."
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_state_marker.stat.exists

- name: Revalidate the existing runtime at the disabled-state removal boundary
  ansible.builtin.include_tasks: revalidate_existing_runtime_removal.yml
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_previous_quadlet_stat.stat.exists
    - not ansible_check_mode

- name: Remove a previously managed forward proxy runtime when disabled
  ansible.builtin.include_role:
    name: lit.foundational.podman_systemd
  vars:
    podman_systemd_action: absent
    podman_systemd_unit_name: "{{ forward_proxy_unit_name }}"
    podman_systemd_description: LIT Squid forward proxy
    podman_systemd_manifest_path: "{{ forward_proxy_pod_manifest_path }}"
    podman_systemd_scope: "{{ forward_proxy_systemd_scope }}"
    podman_systemd_quadlet_dir: "{{ forward_proxy_quadlet_dir }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_previous_quadlet_stat.stat.exists
    - not ansible_check_mode

- name: Prove the disabled runtime is absent before deleting owned state
  ansible.builtin.include_tasks: verify_runtime_absent.yml
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode

- name: Revalidate managed parent chains before disabled-state deletion
  ansible.builtin.include_tasks: ensure_directory.yml
  loop: "{{ forward_proxy_trusted_parent_paths }}"
  loop_control:
    loop_var: forward_proxy_directory_path
  vars:
    forward_proxy_directory_creation_allowed: false
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode
    - >-
      forward_proxy_directory_path in forward_proxy_managed_directories_internal
      or forward_proxy_managed_directories_internal
        | select('match', '^' ~ (forward_proxy_directory_path | regex_escape) ~ '/')
        | list | length > 0

- name: Reinspect managed files before disabled-state deletion
  ansible.builtin.stat:
    path: "{{ item.0.0 }}"
    follow: false
    checksum_algorithm: sha256
  loop: >-
    {{
      forward_proxy_previous_state_manifest.managed_paths
      | zip(forward_proxy_previous_state_manifest.managed_checksums)
      | zip(forward_proxy_previous_state_manifest.managed_modes)
      | list
    }}
  register: forward_proxy_disabled_asset_stats
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Revalidate exact managed files before disabled-state deletion
  ansible.builtin.assert:
    that:
      - >-
        (
          not item.stat.exists
          and not item.stat.islnk | default(false)
        )
        or (
          item.stat.isreg | default(false)
          and not item.stat.islnk | default(false)
          and item.stat.checksum == item.item.0.1
          and item.stat.mode == item.item.1
          and (
            item.stat.pw_name | default('') == forward_proxy_file_owner | string
            or item.stat.uid | string == forward_proxy_file_owner | string
          )
          and (
            item.stat.gr_name | default('') == forward_proxy_file_group | string
            or item.stat.gid | string == forward_proxy_file_group | string
          )
        )
    fail_msg: >-
      A managed proxy file changed after runtime removal. Stop before deleting
      through a stale or foreign boundary.
  loop: "{{ forward_proxy_disabled_asset_stats.results | default([]) }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Reinspect the state marker before disabled-state deletion
  ansible.builtin.stat:
    path: "{{ forward_proxy_state_marker_path }}"
    follow: false
    checksum_algorithm: sha256
  register: forward_proxy_disabled_state_marker
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Revalidate the state marker before disabled-state deletion
  ansible.builtin.assert:
    that:
      - forward_proxy_disabled_state_marker.stat.isreg | default(false)
      - not forward_proxy_disabled_state_marker.stat.islnk | default(false)
      - forward_proxy_disabled_state_marker.stat.mode == '0600'
      - >-
        forward_proxy_disabled_state_marker.stat.pw_name | default('')
          == forward_proxy_file_owner | string
        or forward_proxy_disabled_state_marker.stat.uid | string
          == forward_proxy_file_owner | string
      - >-
        forward_proxy_disabled_state_marker.stat.gr_name | default('')
          == forward_proxy_file_group | string
        or forward_proxy_disabled_state_marker.stat.gid | string
          == forward_proxy_file_group | string
      - >-
        forward_proxy_disabled_state_marker.stat.checksum
        == (forward_proxy_state_marker_content.content | b64decode | hash('sha256'))
    fail_msg: >-
      The ownership marker changed after runtime removal. Stop before deleting
      ownership evidence through a stale boundary.
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Remove each managed file at its exact disabled-state mutation boundary
  ansible.builtin.include_tasks: remove_owned_file.yml
  loop: "{{ forward_proxy_disabled_asset_stats.results | default([]) }}"
  loop_control:
    loop_var: forward_proxy_removal_entry
  vars:
    forward_proxy_removal_path: "{{ forward_proxy_removal_entry.item.0.0 }}"
    forward_proxy_removal_checksum: "{{ forward_proxy_removal_entry.stat.checksum | default('') }}"
    forward_proxy_removal_mode: "{{ forward_proxy_removal_entry.item.1 }}"
    forward_proxy_removal_owner: "{{ forward_proxy_file_owner }}"
    forward_proxy_removal_group: "{{ forward_proxy_file_group }}"
    forward_proxy_removal_allow_absent: true
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Reinspect every managed file after disabled-state unlink
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ forward_proxy_previous_state_manifest.managed_paths | default([]) }}"
  register: forward_proxy_disabled_asset_absence
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Prove every managed file is absent before deleting ownership evidence
  ansible.builtin.assert:
    that:
      - not item.stat.exists
      - not item.stat.islnk | default(false)
    fail_msg: >-
      A managed path was recreated after its verified unlink. Preserve the
      ownership marker and stop for operator recovery.
  loop: "{{ forward_proxy_disabled_asset_absence.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Remove the ownership marker at its exact disabled-state mutation boundary
  ansible.builtin.include_tasks: remove_owned_file.yml
  vars:
    forward_proxy_removal_path: "{{ forward_proxy_state_marker_path }}"
    forward_proxy_removal_checksum: "{{ forward_proxy_disabled_state_marker.stat.checksum }}"
    forward_proxy_removal_mode: "0600"
    forward_proxy_removal_owner: "{{ forward_proxy_file_owner }}"
    forward_proxy_removal_group: "{{ forward_proxy_file_group }}"
    forward_proxy_removal_allow_absent: false
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - not ansible_check_mode

- name: Apply the enabled forward proxy state
  ansible.builtin.include_tasks: enabled.yml
  when: forward_proxy_enabled | bool
