---
- name: Inspect the removed forward proxy systemd unit load state
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - --system
      - show
      - "{{ forward_proxy_unit_name }}.service"
      - --property=LoadState
      - --value
  register: forward_proxy_runtime_systemd_load_state
  changed_when: false
  failed_when: >-
    forward_proxy_runtime_systemd_load_state.rc != 0
    or (forward_proxy_runtime_systemd_load_state.stdout | trim) != 'not-found'
  check_mode: false

- name: Inspect installed forward proxy systemd unit files
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - --system
      - list-unit-files
      - "{{ forward_proxy_unit_name }}.service"
      - --no-legend
      - --no-pager
  register: forward_proxy_runtime_systemd_unit_files
  changed_when: false
  failed_when: forward_proxy_runtime_systemd_unit_files.rc != 0
  check_mode: false

- name: Prove the forward proxy systemd unit was removed
  ansible.builtin.assert:
    that:
      - (forward_proxy_runtime_systemd_load_state.stdout | trim) == 'not-found'
      - forward_proxy_runtime_systemd_unit_files.stdout_lines | length == 0
    fail_msg: >-
      Runtime removal left a loaded or installed systemd unit. Stop before
      deleting ownership evidence.

- name: Verify the forward proxy Podman pod is absent
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - pod
      - exists
      - "{{ forward_proxy_unit_name }}"
  register: forward_proxy_runtime_pod_absence
  changed_when: false
  failed_when: forward_proxy_runtime_pod_absence.rc != 1
  check_mode: false

- name: Inspect the removed forward proxy Quadlet
  ansible.builtin.stat:
    path: "{{ forward_proxy_quadlet_path }}"
    follow: false
  register: forward_proxy_runtime_quadlet_absence
  check_mode: false

- name: Verify the forward proxy Quadlet is absent
  ansible.builtin.assert:
    that:
      - not forward_proxy_runtime_quadlet_absence.stat.exists
      - not forward_proxy_runtime_quadlet_absence.stat.islnk | default(false)
    fail_msg: >-
      The forward proxy runtime removal left its managed Quadlet or a dangling
      symlink behind. Stop before recording an absent or render-only state.
