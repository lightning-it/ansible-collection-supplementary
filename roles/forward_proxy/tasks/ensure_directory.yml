---
- name: Inspect the immediate parent of the trusted proxy directory
  ansible.builtin.stat:
    path: "{{ forward_proxy_directory_path | dirname }}"
    follow: false
  register: forward_proxy_directory_parent

- name: Require a real immediate parent before touching the proxy directory
  ansible.builtin.assert:
    that:
      - >-
        (
          forward_proxy_directory_parent.stat.exists
          and forward_proxy_directory_parent.stat.isdir | default(false)
          and not forward_proxy_directory_parent.stat.islnk | default(false)
        )
        or (
          ansible_check_mode
          and forward_proxy_directory_path | dirname
            in forward_proxy_planned_directories_internal
        )
    fail_msg: >-
      Every trusted proxy directory requires an existing non-symlink immediate
      parent. Parent chains must be complete and ordered before child paths.

- name: Inspect the trusted proxy directory before creation
  ansible.builtin.stat:
    path: "{{ forward_proxy_directory_path }}"
    follow: false
  register: forward_proxy_directory_before

- name: Refuse an absent anchor or unsafe existing proxy directory
  ansible.builtin.assert:
    that:
      - >-
        forward_proxy_directory_path | dirname in forward_proxy_trusted_parent_paths
        or forward_proxy_directory_before.stat.exists
      - >-
        forward_proxy_directory_creation_allowed | bool
        or forward_proxy_directory_before.stat.exists
      - >-
        not forward_proxy_directory_before.stat.exists
        or (
          forward_proxy_directory_before.stat.isdir | default(false)
          and not forward_proxy_directory_before.stat.islnk | default(false)
          and (
            forward_proxy_directory_before.stat.mode is match('^0[0-7][0145][0145]\Z')
            or (
              forward_proxy_directory_path == '/tmp'
              and forward_proxy_directory_before.stat.mode == '1777'
              and forward_proxy_directory_before.stat.uid == 0
              and forward_proxy_directory_before.stat.gid == 0
            )
          )
          and (
            forward_proxy_directory_before.stat.uid == 0
            or forward_proxy_directory_before.stat.pw_name | default('')
              == forward_proxy_file_owner | string
            or forward_proxy_directory_before.stat.uid | string
              == forward_proxy_file_owner | string
          )
          and (
            forward_proxy_directory_before.stat.gid == 0
            or forward_proxy_directory_before.stat.gr_name | default('')
              == forward_proxy_file_group | string
            or forward_proxy_directory_before.stat.gid | string
              == forward_proxy_file_group | string
          )
        )
    fail_msg: >-
      A trusted proxy directory anchor is absent or an existing directory has
      an unsafe type, owner, group, or mode.

- name: Create one validated forward proxy directory component
  ansible.builtin.file:
    path: "{{ forward_proxy_directory_path }}"
    state: directory
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0755"
  when:
    - forward_proxy_directory_creation_allowed | bool
    - forward_proxy_directory_path | dirname in forward_proxy_trusted_parent_paths
    - not forward_proxy_directory_before.stat.exists

- name: Carry the planned forward proxy directory through check mode
  ansible.builtin.set_fact:
    forward_proxy_planned_directories_internal: >-
      {{
        forward_proxy_planned_directories_internal
        + [forward_proxy_directory_path]
      }}
  when:
    - ansible_check_mode
    - forward_proxy_directory_creation_allowed | bool
    - not forward_proxy_directory_before.stat.exists

- name: Reinspect the trusted proxy directory before privileged writes
  ansible.builtin.stat:
    path: "{{ forward_proxy_directory_path }}"
    follow: false
  register: forward_proxy_directory_after
  when: >-
    not ansible_check_mode
    or forward_proxy_directory_before.stat.exists

- name: Resolve the trusted proxy directory without following hidden ancestors
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - "{{ forward_proxy_directory_path }}"
  register: forward_proxy_directory_realpath
  changed_when: false
  check_mode: false
  when: >-
    not ansible_check_mode
    or forward_proxy_directory_before.stat.exists

- name: Require the exact canonical proxy directory boundary
  ansible.builtin.assert:
    that:
      - forward_proxy_directory_after.stat.isdir | default(false)
      - not forward_proxy_directory_after.stat.islnk | default(false)
      - forward_proxy_directory_realpath.stdout == forward_proxy_directory_path
    fail_msg: >-
      A trusted proxy directory or one of its ancestors is a symlink or resolves
      outside its exact configured path.
  when: >-
    not ansible_check_mode
    or forward_proxy_directory_before.stat.exists
