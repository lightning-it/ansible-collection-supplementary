---
- name: Revalidate a captured active runtime before existing-state rollback
  ansible.builtin.include_tasks: revalidate_active_runtime_identity.yml
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_manage_runtime | bool
    - forward_proxy_active_runtime_identity_internal | length > 0
    - not ansible_check_mode

- name: Revalidate the original runtime if activation failed before recapture
  ansible.builtin.include_tasks: revalidate_existing_runtime_removal.yml
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_manage_runtime | bool
    - forward_proxy_active_runtime_identity_internal | length == 0
    - not ansible_check_mode

- name: Revalidate the exact newly created runtime before existing-state rollback
  ansible.builtin.include_tasks: revalidate_new_runtime_removal.yml
  when:
    - forward_proxy_manage_runtime | bool
    - not forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_new_runtime_removal_authorization_internal.authorized | default(false) | bool
    - not ansible_check_mode

- name: Prove runtime absence when activation failed before identity capture
  ansible.builtin.include_tasks: verify_runtime_absent.yml
  when:
    - forward_proxy_manage_runtime | bool
    - not forward_proxy_previous_state_manifest.runtime_managed | bool
    - not forward_proxy_new_runtime_removal_authorization_internal.authorized | default(false) | bool
    - not ansible_check_mode

- name: Record safe runtime absence before restoring render-only state
  ansible.builtin.set_fact:
    forward_proxy_runtime_absence_verified_internal: true
  when:
    - forward_proxy_manage_runtime | bool
    - not forward_proxy_previous_state_manifest.runtime_managed | bool
    - not forward_proxy_new_runtime_removal_authorization_internal.authorized | default(false) | bool
    - not ansible_check_mode

- name: Require rollback authorization or proven absence before restoring render-only state
  ansible.builtin.assert:
    that:
      - >-
        forward_proxy_new_runtime_removal_authorization_internal.authorized | default(false) | bool
        or forward_proxy_runtime_absence_verified_internal | bool
    fail_msg: >-
      Runtime activation failed before its exact removal identity was captured.
      Runtime absence also could not be proven. Leave runtime and files intact
      for operator recovery.
  when:
    - forward_proxy_manage_runtime | bool
    - not forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode

- name: Remove a newly introduced forward proxy runtime
  ansible.builtin.include_role:
    name: lit.foundational.podman_systemd
  vars:
    podman_systemd_action: absent
    podman_systemd_unit_name: "{{ forward_proxy_unit_name }}"
    podman_systemd_description: LIT Squid forward proxy
    podman_systemd_manifest_path: "{{ forward_proxy_pod_manifest_path }}"
    podman_systemd_scope: "{{ forward_proxy_systemd_scope }}"
    podman_systemd_quadlet_dir: "{{ forward_proxy_quadlet_dir }}"
  when:
    - forward_proxy_manage_runtime | bool
    - not forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_new_runtime_removal_authorization_internal.authorized | default(false) | bool
    - not ansible_check_mode

- name: Prove the failed newly introduced runtime is absent before restoration
  ansible.builtin.include_tasks: verify_runtime_absent.yml
  when:
    - forward_proxy_manage_runtime | bool
    - not forward_proxy_previous_state_manifest.runtime_managed | bool
    - forward_proxy_new_runtime_removal_authorization_internal.authorized | default(false) | bool
    - not ansible_check_mode

- name: Revalidate trusted proxy directories before existing-state rollback
  ansible.builtin.include_tasks: ensure_directory.yml
  loop: "{{ forward_proxy_trusted_parent_paths }}"
  loop_control:
    loop_var: forward_proxy_directory_path
  vars:
    forward_proxy_directory_creation_allowed: false
  when:
    - not ansible_check_mode
    - >-
      forward_proxy_directory_path in forward_proxy_managed_directories_internal
      or forward_proxy_managed_directories_internal
        | select('match', '^' ~ (forward_proxy_directory_path | regex_escape) ~ '/')
        | list | length > 0
      or (
        forward_proxy_previous_state_manifest.runtime_managed | bool
        and (
          forward_proxy_directory_path == forward_proxy_quadlet_dir
          or forward_proxy_quadlet_dir.startswith(
            forward_proxy_directory_path.rstrip('/') ~ '/'
          )
        )
      )

- name: Reinspect existing-state rollback destinations
  ansible.builtin.stat:
    path: "{{ item.0 }}"
    follow: false
    checksum_algorithm: sha256
  loop: >-
    {{
      (forward_proxy_previous_state_manifest.managed_paths
        | zip(forward_proxy_previous_state_manifest.managed_modes) | list)
      + [[forward_proxy_state_marker_path, '0600']]
      + (
          [[forward_proxy_previous_state_manifest.quadlet_path, '0644']]
          if forward_proxy_previous_state_manifest.runtime_managed | bool
          else []
        )
    }}
  register: forward_proxy_existing_rollback_target_stats
  when: not ansible_check_mode

- name: Require safe existing-state rollback destinations
  ansible.builtin.assert:
    that:
      - >-
        (
          item.item.0 == forward_proxy_previous_state_manifest.quadlet_path
          and not forward_proxy_manage_runtime | bool
          and not item.stat.exists
          and not item.stat.islnk | default(false)
        )
        or (
          item.stat.isreg | default(false)
          and not item.stat.islnk | default(false)
          and item.stat.mode == item.item.1
          and (
            (
              item.item.0 in forward_proxy_previous_state_manifest.managed_paths
              and item.stat.checksum
                in [
                  dict(
                    forward_proxy_previous_state_manifest.managed_paths
                    | zip(forward_proxy_previous_state_manifest.managed_checksums)
                  )[item.item.0],
                  (
                    forward_proxy_squid_config_transaction_stat.stat.checksum | default('')
                    if item.item.0 == forward_proxy_config_path
                    else forward_proxy_pod_manifest_transaction_stat.stat.checksum | default('')
                  )
                ]
            )
            or (
              item.item.0 == forward_proxy_state_marker_path
              and (
                item.stat.checksum
                  == (forward_proxy_state_marker_content.content | b64decode | hash('sha256'))
                or (
                  forward_proxy_state_marker_payload_internal is defined
                  and item.stat.checksum
                    == (forward_proxy_state_marker_payload_internal | hash('sha256'))
                )
              )
            )
            or (
              item.item.0 == forward_proxy_previous_state_manifest.quadlet_path
              and item.stat.checksum
                in [
                  forward_proxy_previous_state_manifest.quadlet_checksum,
                  forward_proxy_quadlet_stat.stat.checksum | default('')
                ]
            )
          )
        )
      - >-
        (
          item.item.0 == forward_proxy_previous_state_manifest.quadlet_path
          and (
            (
              not forward_proxy_manage_runtime | bool
              and not item.stat.exists
              and not item.stat.islnk | default(false)
            )
            or (
              item.stat.pw_name | default('') == 'root'
              and item.stat.gr_name | default('') == 'root'
            )
          )
        )
        or (
          item.item.0 != forward_proxy_previous_state_manifest.quadlet_path
          and (
            item.stat.pw_name | default('') == forward_proxy_file_owner | string
            or item.stat.uid | string == forward_proxy_file_owner | string
          )
          and (
            item.stat.gr_name | default('') == forward_proxy_file_group | string
            or item.stat.gid | string == forward_proxy_file_group | string
          )
        )
    fail_msg: >-
      A rollback destination changed type, owner, group, or mode after the
      failed transition. Stop without restoring through a foreign boundary.
  loop: "{{ forward_proxy_existing_rollback_target_stats.results | default([]) }}"
  when: not ansible_check_mode

- name: Restore previous forward proxy managed files
  ansible.builtin.include_tasks: restore_managed_file.yml
  loop: >-
    {{
      forward_proxy_previous_asset_contents.results
      | zip(
          forward_proxy_previous_state_manifest.managed_modes,
          forward_proxy_previous_state_manifest.managed_checksums
        )
      | list
    }}
  loop_control:
    loop_var: forward_proxy_restore_entry

- name: Reinspect the previous Quadlet at its rollback mutation boundary
  ansible.builtin.stat:
    path: "{{ forward_proxy_previous_state_manifest.quadlet_path }}"
    follow: false
    checksum_algorithm: sha256
  register: forward_proxy_restore_quadlet_boundary
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode

- name: Require the previous or failed-transaction Quadlet before restoration
  ansible.builtin.assert:
    that:
      - forward_proxy_restore_quadlet_boundary.stat.isreg | default(false)
      - not forward_proxy_restore_quadlet_boundary.stat.islnk | default(false)
      - forward_proxy_restore_quadlet_boundary.stat.mode == '0644'
      - forward_proxy_restore_quadlet_boundary.stat.pw_name | default('') == 'root'
      - forward_proxy_restore_quadlet_boundary.stat.gr_name | default('') == 'root'
      - >-
        forward_proxy_restore_quadlet_boundary.stat.checksum
        in [
          forward_proxy_previous_state_manifest.quadlet_checksum,
          forward_proxy_quadlet_stat.stat.checksum | default('')
        ]
    fail_msg: >-
      The Quadlet changed outside the previous or failed transaction. Leave it
      untouched for operator recovery.
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode

- name: Restore the previous managed forward proxy Quadlet
  ansible.builtin.copy:
    content: "{{ forward_proxy_previous_quadlet_content.content | b64decode }}"
    dest: "{{ forward_proxy_previous_state_manifest.quadlet_path }}"
    owner: root
    group: root
    mode: "0644"
    follow: false
    unsafe_writes: false
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode

- name: Reinspect the ownership marker at its rollback mutation boundary
  ansible.builtin.stat:
    path: "{{ forward_proxy_state_marker_path }}"
    follow: false
    checksum_algorithm: sha256
  register: forward_proxy_restore_marker_boundary
  when: not ansible_check_mode

- name: Require the previous or failed-transaction marker before restoration
  ansible.builtin.assert:
    that:
      - forward_proxy_restore_marker_boundary.stat.isreg | default(false)
      - not forward_proxy_restore_marker_boundary.stat.islnk | default(false)
      - forward_proxy_restore_marker_boundary.stat.mode == '0600'
      - >-
        forward_proxy_restore_marker_boundary.stat.pw_name | default('')
          == forward_proxy_file_owner | string
        or forward_proxy_restore_marker_boundary.stat.uid | string
          == forward_proxy_file_owner | string
      - >-
        forward_proxy_restore_marker_boundary.stat.gr_name | default('')
          == forward_proxy_file_group | string
        or forward_proxy_restore_marker_boundary.stat.gid | string
          == forward_proxy_file_group | string
      - >-
        forward_proxy_restore_marker_boundary.stat.checksum
          == (forward_proxy_state_marker_content.content | b64decode | hash('sha256'))
        or (
          forward_proxy_state_marker_payload_internal is defined
          and forward_proxy_restore_marker_boundary.stat.checksum
            == (forward_proxy_state_marker_payload_internal | hash('sha256'))
        )
    fail_msg: >-
      The ownership marker changed outside the previous or failed transaction.
      Leave it untouched for operator recovery.
  when: not ansible_check_mode

- name: Restore the previous forward proxy ownership marker
  ansible.builtin.copy:
    content: "{{ forward_proxy_state_marker_content.content | b64decode }}"
    dest: "{{ forward_proxy_state_marker_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0600"
    follow: false
    unsafe_writes: false
  no_log: true

- name: Restart the restored previous forward proxy runtime
  ansible.builtin.include_role:
    name: lit.foundational.podman_systemd
  vars:
    podman_systemd_action: restarted
    podman_systemd_unit_name: "{{ forward_proxy_unit_name }}"
    podman_systemd_description: LIT Squid forward proxy
    podman_systemd_manifest_path: "{{ forward_proxy_pod_manifest_path }}"
    podman_systemd_scope: "{{ forward_proxy_systemd_scope }}"
    podman_systemd_quadlet_dir: "{{ forward_proxy_quadlet_dir }}"
    podman_systemd_enabled: true
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode

- name: Capture the restored runtime identity after rollback
  ansible.builtin.include_tasks: capture_active_runtime_identity.yml
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode

- name: Prove the restored previous forward proxy runtime is ready
  ansible.builtin.include_tasks: verify_runtime_ready.yml
  when:
    - forward_proxy_previous_state_manifest.runtime_managed | bool
    - not ansible_check_mode
