---
- name: Validate Vault Raft snapshot action
  ansible.builtin.assert:
    that:
      - vault_raft_snapshot_action is string
      - vault_raft_snapshot_action in ['none', 'backup', 'restore_drill']
    fail_msg: "vault_raft_snapshot_action must be none, backup, or restore_drill."
    quiet: true

- name: Validate active Vault Raft snapshot inputs
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - vault_raft_snapshot_api_url is match('^https://[^/]+$')
      - vault_raft_snapshot_health_url == vault_raft_snapshot_api_url ~ '/v1/sys/health'
      - vault_raft_snapshot_api_delegate_to == 'localhost'
      - vault_raft_snapshot_validate_certs is sameas true
      - vault_raft_snapshot_controller_ca_cert_path is match('^/')
      - vault_raft_snapshot_timeout is integer
      - vault_raft_snapshot_timeout | int > 0
      - vault_raft_snapshot_auth_mount_point is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - vault_raft_snapshot_role_id is match('^[^\r\n]{16,4096}$')
      - vault_raft_snapshot_secret_id is match('^[^\r\n]{16,4096}$')
      - vault_raft_snapshot_controller_escrow_root_path is match('^/')
      - vault_raft_snapshot_controller_document_path is match('^/')
      - vault_raft_snapshot_document_schema_version is integer
      - vault_raft_snapshot_document_schema_version | int == 1
      - >-
        vault_raft_snapshot_document_subject
        is match('^[a-z0-9][a-z0-9._-]{2,255}$')
      - vault_raft_snapshot_max_raw_bytes is integer
      - vault_raft_snapshot_max_raw_bytes | int > 0
      - vault_raft_snapshot_max_raw_bytes | int <= 134217728
      - vault_raft_snapshot_verification_kv_paths is sequence
      - vault_raft_snapshot_verification_kv_paths is not string
      - vault_raft_snapshot_verification_kv_paths | length > 0
      - >-
        vault_raft_snapshot_image
        is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
      - lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE') | length > 0
      - lookup('ansible.builtin.env', 'VAULT_ADDR') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_TOKEN') | length == 0
      - lookup('ansible.builtin.env', 'VAULT_SKIP_VERIFY') | length == 0
    fail_msg: >-
      Vault Raft snapshot escrow requires exact HTTPS, scoped AppRole auth,
      immutable controller ciphertext, a digest-pinned image, an isolated /run
      restore target, and no exported Vault credentials.
    quiet: true
  when: vault_raft_snapshot_action != 'none'
  no_log: true

- name: Validate Vault Raft snapshot KV verification paths
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.keys() | list | sort == ['mount_point', 'path']
      - item.mount_point is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - item.path is match('^[^/].*[^/]$')
    fail_msg: "Every Raft snapshot KV verification path must be exact and relative."
    quiet: true
  loop: "{{ vault_raft_snapshot_verification_kv_paths }}"
  when: vault_raft_snapshot_action != 'none'
  no_log: true

- name: Require exact production unseal material for a restore drill
  ansible.builtin.assert:
    that:
      - vault_raft_snapshot_target_ca_cert_path is match('^/')
      - vault_raft_snapshot_production_cert_dir is match('^/')
      - vault_raft_snapshot_restore_bind_address == '127.0.0.1'
      - vault_raft_snapshot_restore_tls_hostname == 'localhost'
      - vault_raft_snapshot_restore_api_port | int > 1024
      - vault_raft_snapshot_restore_api_port | int <= 65535
      - vault_raft_snapshot_restore_cluster_port | int > 1024
      - vault_raft_snapshot_restore_cluster_port | int <= 65535
      - >-
        vault_raft_snapshot_restore_api_port | int
        != vault_raft_snapshot_restore_cluster_port | int
      - >-
        vault_raft_snapshot_restore_work_root_owner | string
        is match('^(root|[0-9]+)$')
      - >-
        vault_raft_snapshot_restore_work_root_group | string
        is match('^(root|[0-9]+)$')
      - vault_raft_snapshot_restore_test_mode is boolean
      - >-
        (
          vault_raft_snapshot_restore_test_mode is sameas false
          and vault_raft_snapshot_restore_test_root | length == 0
          and vault_raft_snapshot_restore_work_root
          is match('^/run/[A-Za-z0-9._-]+$')
          and (vault_raft_snapshot_restore_work_root_owner | string) == 'root'
          and (vault_raft_snapshot_restore_work_root_group | string) == 'root'
        )
        or
        (
          vault_raft_snapshot_restore_test_mode is sameas true
          and vault_raft_snapshot_restore_work_root
          is match('^/tmp/[A-Za-z0-9._/-]+$')
          and vault_raft_snapshot_restore_test_root
              is match('^/tmp/[A-Za-z0-9._/-]+$')
          and vault_raft_snapshot_restore_work_root.startswith(
            vault_raft_snapshot_restore_test_root ~ '/'
          )
          and '..' not in vault_raft_snapshot_restore_test_root.split('/')
          and '..' not in vault_raft_snapshot_restore_work_root.split('/')
          and (vault_raft_snapshot_restore_work_root_owner | string)
              is match('^[0-9]+$')
          and (vault_raft_snapshot_restore_work_root_group | string)
              is match('^[0-9]+$')
        )
      - vault_raft_snapshot_restore_container_name is match('^[A-Za-z0-9][A-Za-z0-9._-]+$')
      - vault_raft_snapshot_restore_node_id is match('^[A-Za-z0-9][A-Za-z0-9._-]+$')
      - vault_raft_snapshot_restore_timeout is integer
      - >-
        vault_raft_snapshot_restore_timeout | int
        > vault_raft_snapshot_timeout | int
      - vault_raft_snapshot_restore_timeout | int <= 3600
      - >-
        vault_raft_snapshot_expected_ciphertext_sha256
        is match('^[0-9a-f]{64}$')
      - vault_raft_snapshot_restore_unseal_keys is sequence
      - vault_raft_snapshot_restore_unseal_keys is not string
      - vault_raft_snapshot_restore_key_threshold is integer
      - vault_raft_snapshot_restore_key_threshold | int > 0
      - >-
        vault_raft_snapshot_restore_unseal_keys | length
        >= vault_raft_snapshot_restore_key_threshold | int
      - >-
        vault_raft_snapshot_restore_unseal_keys | unique | length
        == vault_raft_snapshot_restore_unseal_keys | length
    fail_msg: >-
      Restore drill requires the literal localhost TLS identity, loopback-only
      ports, a root-owned /run production work root or explicit unprivileged
      local test root, a bounded timeout, unique unseal keys, and the exact
      positive threshold.
    quiet: true
  when: vault_raft_snapshot_action == 'restore_drill'
  no_log: true

- name: Inspect private Vault Raft restore test root
  ansible.builtin.stat:
    path: "{{ vault_raft_snapshot_restore_test_root }}"
    follow: false
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: _vault_raft_snapshot_restore_test_root_stat
  changed_when: false
  when:
    - vault_raft_snapshot_action == 'restore_drill'
    - vault_raft_snapshot_restore_test_mode | bool
  no_log: true

- name: Resolve private Vault Raft restore test paths
  ansible.builtin.command:
    argv:
      - realpath
      - "{{ item.option }}"
      - "{{ item.path }}"
  loop:
    - option: --canonicalize-existing
      path: "{{ vault_raft_snapshot_restore_test_root }}"
    - option: --canonicalize-missing
      path: "{{ vault_raft_snapshot_restore_work_root }}"
  register: _vault_raft_snapshot_restore_test_realpaths
  changed_when: false
  check_mode: false
  when:
    - vault_raft_snapshot_action == 'restore_drill'
    - vault_raft_snapshot_restore_test_mode | bool
  no_log: true

- name: Read effective Vault Raft restore test controller identity
  ansible.builtin.command:
    argv:
      - id
      - -u
  register: _vault_raft_snapshot_restore_test_controller_identity
  changed_when: false
  check_mode: false
  when:
    - vault_raft_snapshot_action == 'restore_drill'
    - vault_raft_snapshot_restore_test_mode | bool
  no_log: true

- name: Require private unprivileged local Vault Raft restore test paths
  ansible.builtin.assert:
    that:
      - ansible_connection == 'local'
      - inventory_hostname in ['localhost', '127.0.0.1']
      - vault_raft_snapshot_api_delegate_to == 'localhost'
      - _vault_raft_snapshot_restore_test_controller_identity.stdout | int > 0
      - _vault_raft_snapshot_restore_test_root_stat.stat.isdir | default(false)
      - not (_vault_raft_snapshot_restore_test_root_stat.stat.islnk | default(false))
      - >-
        _vault_raft_snapshot_restore_test_root_stat.stat.uid | int
        == _vault_raft_snapshot_restore_test_controller_identity.stdout | int
      - _vault_raft_snapshot_restore_test_root_stat.stat.mode == '0700'
      - _vault_raft_snapshot_restore_test_realpaths.results | length == 2
      - >-
        _vault_raft_snapshot_restore_test_realpaths.results[0].stdout
        == vault_raft_snapshot_restore_test_root
      - >-
        _vault_raft_snapshot_restore_test_realpaths.results[1].stdout.startswith(
          _vault_raft_snapshot_restore_test_realpaths.results[0].stdout ~ '/'
        )
      - >-
        _vault_raft_snapshot_restore_test_realpaths.results[1].stdout
        == vault_raft_snapshot_restore_work_root
    fail_msg: >-
      Vault Raft test ownership requires a non-root local controller and a
      real owner-only non-symlink root containing the canonical work path.
    quiet: true
  when:
    - vault_raft_snapshot_action == 'restore_drill'
    - vault_raft_snapshot_restore_test_mode | bool
  no_log: true
