---
- name: Validate pinned Guacamole Java CA before materialization
  ansible.builtin.import_tasks: java_trust_validate.yml

- name: Prepare the Guacamole Java trust directory
  ansible.builtin.file:
    path: "{{ guacamole_deploy_base_dir }}/java-trust/{{ guacamole_deploy_java_ca_sha256 | replace(':', '') }}"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "0755"

- name: Inspect existing public CA for a write-free preview
  ansible.builtin.stat:
    path: >-
      {{ guacamole_deploy_base_dir }}/java-trust/{{ guacamole_deploy_java_ca_sha256
      | replace(':', '') }}/issuer-ca.pem
    follow: false
    checksum_algorithm: sha1
  register: guacamole_deploy_java_ca_preview
  when: ansible_check_mode

- name: Report public CA content and custody drift without creating files
  ansible.builtin.debug:
    msg: Public CA materialization would be reconciled.
  changed_when: >-
    not guacamole_deploy_java_ca_preview.stat.exists
    or guacamole_deploy_java_ca_preview.stat.checksum
      | default('') != guacamole_deploy_java_ca_certificate | hash('sha1')
    or guacamole_deploy_java_ca_preview.stat.uid | default(-1) != 0
    or guacamole_deploy_java_ca_preview.stat.gid | default(-1) != 0
    or guacamole_deploy_java_ca_preview.stat.mode | default('') != '0644'
  when: ansible_check_mode

- name: Materialize only the reviewed public Guacamole CA
  ansible.builtin.copy:
    content: "{{ guacamole_deploy_java_ca_certificate }}"
    dest: >-
      {{ guacamole_deploy_base_dir }}/java-trust/{{ guacamole_deploy_java_ca_sha256
      | replace(':', '') }}/issuer-ca.pem
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode
