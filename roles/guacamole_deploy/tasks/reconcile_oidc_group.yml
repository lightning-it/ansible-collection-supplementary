---
- name: Reconcile exact OIDC group connection read permissions
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - -i
      - "{{ guacamole_deploy_pod_name }}-postgres"
      - psql
      - --quiet
      - --tuples-only
      - --no-align
      - -v
      - ON_ERROR_STOP=1
      - -v
      - "oidc_group_name={{ guacamole_deploy_oidc_group.name }}"
      - -v
      - >-
        oidc_connection_names_json={{ guacamole_deploy_oidc_group.connection_names | to_json }}
      - -U
      - "{{ guacamole_deploy_db_user }}"
      - -d
      - "{{ guacamole_deploy_db_name }}"
    stdin: |
      BEGIN;
      CREATE TEMPORARY TABLE lit_oidc_group_input (
        group_name text NOT NULL,
        connection_names jsonb NOT NULL
      ) ON COMMIT DROP;
      INSERT INTO lit_oidc_group_input (group_name, connection_names)
      VALUES (:'oidc_group_name', :'oidc_connection_names_json'::jsonb);
      DO $reconcile$
      DECLARE
        group_name text;
        connection_names jsonb;
        affected integer := 0;
        step_affected integer := 0;
      BEGIN
        SELECT input.group_name, input.connection_names
        INTO STRICT group_name, connection_names
        FROM lit_oidc_group_input AS input;

        IF jsonb_typeof(connection_names) <> 'array' THEN
          RAISE EXCEPTION 'OIDC connection authorization must be a JSON array';
        END IF;

        IF (
          SELECT count(*)
          FROM guacamole_connection
          WHERE connection_name IN (
            SELECT jsonb_array_elements_text(connection_names)
          )
        ) <> jsonb_array_length(connection_names) THEN
          RAISE EXCEPTION 'OIDC group references an unknown Guacamole connection';
        END IF;

        INSERT INTO guacamole_entity (name, type)
        SELECT group_name, 'USER_GROUP'
        WHERE NOT EXISTS (
          SELECT 1
          FROM guacamole_entity
          WHERE name = group_name AND type = 'USER_GROUP'
        )
        ON CONFLICT DO NOTHING;
        GET DIAGNOSTICS step_affected = ROW_COUNT;
        affected := affected + step_affected;

        INSERT INTO guacamole_user_group (entity_id, disabled)
        SELECT entity_id, false
        FROM guacamole_entity
        WHERE name = group_name AND type = 'USER_GROUP'
        ON CONFLICT DO NOTHING;
        GET DIAGNOSTICS step_affected = ROW_COUNT;
        affected := affected + step_affected;

        UPDATE guacamole_user_group AS user_group
        SET disabled = false
        FROM guacamole_entity AS entity
        WHERE user_group.entity_id = entity.entity_id
          AND entity.name = group_name
          AND entity.type = 'USER_GROUP'
          AND user_group.disabled IS DISTINCT FROM false;
        GET DIAGNOSTICS step_affected = ROW_COUNT;
        affected := affected + step_affected;

        DELETE FROM guacamole_connection_permission AS permission
        USING guacamole_entity AS entity
        WHERE permission.entity_id = entity.entity_id
          AND entity.name = group_name
          AND entity.type = 'USER_GROUP'
          AND (
            permission.permission <> 'READ'
            OR NOT EXISTS (
              SELECT 1
              FROM guacamole_connection AS connection
              WHERE connection.connection_id = permission.connection_id
                AND connection.connection_name IN (
                  SELECT jsonb_array_elements_text(connection_names)
                )
            )
          );
        GET DIAGNOSTICS step_affected = ROW_COUNT;
        affected := affected + step_affected;

        INSERT INTO guacamole_connection_permission (
          entity_id,
          connection_id,
          permission
        )
        SELECT entity.entity_id, connection.connection_id, 'READ'
        FROM guacamole_entity AS entity
        JOIN guacamole_connection AS connection
          ON connection.connection_name IN (
            SELECT jsonb_array_elements_text(connection_names)
          )
        WHERE entity.name = group_name
          AND entity.type = 'USER_GROUP'
        ON CONFLICT DO NOTHING;
        GET DIAGNOSTICS step_affected = ROW_COUNT;
        affected := affected + step_affected;

        UPDATE lit_oidc_group_input
        SET connection_names = jsonb_build_object('changed_count', affected);
      END
      $reconcile$;
      SELECT connection_names ->> 'changed_count'
      FROM lit_oidc_group_input;
      COMMIT;
  register: guacamole_deploy_oidc_group_reconcile
  changed_when: >-
    guacamole_deploy_oidc_group_reconcile.stdout_lines
    | default([])
    | select('match', '^[1-9][0-9]*$')
    | list
    | length
    > 0
  no_log: true
