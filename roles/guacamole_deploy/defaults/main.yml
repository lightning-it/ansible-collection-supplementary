---
guacamole_deploy_pod_name: "guacamole"
guacamole_deploy_manifest_path: "/etc/podman/pods/guacamole.yml"
guacamole_deploy_image: >-
  docker.io/guacamole/guacamole:1.6.0@sha256:50484043eadd8d9562053940c0ed523dbddaf9086c370127b2f4acabb8bddddc
guacamole_deploy_guacd_image: >-
  docker.io/guacamole/guacd:1.6.0@sha256:f39258e35244b6bf79bc6ac4e60eee176aea6f6a5adb13e8c3090e48df8ae515
guacamole_deploy_postgres_image: >-
  docker.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
guacamole_deploy_host_ip: "127.0.0.1"
guacamole_deploy_port: 8082
# Optional exact attachment to a pre-existing Podman network. Both values must
# be set together; the empty default retains Podman's normal allocation.
guacamole_deploy_network_name: ""
guacamole_deploy_network_ipv4: ""
# Optional per-container override of Podman's inherited proxy bypass list.
# This lets server-side OIDC/JWKS traffic use the site forward proxy while
# preserving only explicitly declared direct destinations such as loopback.
guacamole_deploy_proxy_url: ""
guacamole_deploy_no_proxy: []
# Optional public CA, pinned by its DER SHA-256 fingerprint. The init container
# extends the image's default Java truststore; TLS/hostname checks stay enabled.
guacamole_deploy_java_ca_certificate: ""
guacamole_deploy_java_ca_sha256: ""
guacamole_deploy_guacd_ca_certificate: ""
guacamole_deploy_guacd_ca_sha256: ""
guacamole_deploy_guacd_stock_ca_bundle: /etc/ssl/certs/ca-certificates.crt
guacamole_deploy_host_aliases: []
guacamole_deploy_base_dir: "/srv/guacamole"
guacamole_deploy_db_name: "guacamole"
guacamole_deploy_db_user: "guacamole"
guacamole_deploy_breakglass_user: "guacadmin"
guacamole_deploy_secrets: {}
guacamole_deploy_oidc_enabled: false
guacamole_deploy_oidc_authorization_endpoint: ""
guacamole_deploy_oidc_jwks_endpoint: ""
guacamole_deploy_oidc_issuer: ""
guacamole_deploy_oidc_client_id: "guacamole"
guacamole_deploy_oidc_redirect_uri: ""
# Apache Guacamole 1.6.0 ConfigurationService.DEFAULT_USERNAME_CLAIM_TYPE is
# "email". Preserve that upstream identity mapping unless explicitly migrated.
guacamole_deploy_oidc_username_claim_type: "email"
guacamole_deploy_oidc_groups_claim_type: "groups"
# Preserve the upstream request unless the consumer explicitly restricts claims.
guacamole_deploy_oidc_scope: "openid email profile"
guacamole_deploy_oidc_group_connections: []
guacamole_deploy_api_session_timeout_minutes: 60
guacamole_deploy_health_url: "http://{{ guacamole_deploy_host_ip }}:{{ guacamole_deploy_port }}/guacamole/"
guacamole_deploy_api_url: "http://{{ guacamole_deploy_host_ip }}:{{ guacamole_deploy_port }}/guacamole/api"
guacamole_deploy_connections: []
guacamole_deploy_validate_certs: true
guacamole_deploy_install_packages: true
guacamole_deploy_manage_systemd: true
guacamole_deploy_skip_runtime: false
guacamole_deploy_systemd_unit_name: "{{ guacamole_deploy_pod_name }}-pod"
guacamole_deploy_systemd_description: "Apache Guacamole container service"
guacamole_deploy_systemd_scope: system
guacamole_deploy_quadlet_dir: /etc/containers/systemd
guacamole_deploy_systemd_enabled: true
guacamole_deploy_legacy_systemd_unit_path: >-
  /etc/systemd/system/guacamole.service
guacamole_deploy_quadlet_networks: >-
  {{
    [
      guacamole_deploy_network_name
      ~ ':ip='
      ~ guacamole_deploy_network_ipv4
    ]
    if (
      guacamole_deploy_network_name | length > 0
      and guacamole_deploy_network_ipv4 | length > 0
    )
    else []
  }}
