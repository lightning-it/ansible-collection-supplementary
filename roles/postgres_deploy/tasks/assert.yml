---
- name: Ensure core PostgreSQL deploy variables are valid
  ansible.builtin.assert:
    that:
      - postgres_deploy_pod_name | default('', true) | trim | length > 0
      - postgres_deploy_pod_manifest_path | default('', true) | trim | length > 0
      - postgres_deploy_image | default('', true) | trim | length > 0
      - postgres_deploy_container_name | default('', true) | trim | length > 0
      - postgres_deploy_host_data_dir | default('', true) | trim | length > 0
      - postgres_deploy_config_dir | default('', true) | trim | length > 0
      - postgres_deploy_secrets_file | default('', true) | trim | length > 0
      - postgres_deploy_container_data_dir | default('', true) | trim | length > 0
      - postgres_deploy_db_name | default('', true) | trim | length > 0
      - postgres_deploy_db_user | default('', true) | trim | length > 0
      - postgres_deploy_port | int > 0
      - postgres_deploy_container_port | int == 5432
      - postgres_deploy_host_ip | default('', true) | trim | length > 0
      - postgres_deploy_host_network is boolean
      - postgres_deploy_networks is sequence
      - postgres_deploy_networks is not string
      - >-
        postgres_deploy_networks | select('string') | list | length
        == postgres_deploy_networks | length
      - >-
        postgres_deploy_networks | map('trim') | reject('equalto', '') | list | length
        == postgres_deploy_networks | length
      - >-
        postgres_deploy_networks
        | select(
            'match',
            '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}'
            ~ '(?::ip=[0-9]{1,3}(?:[.][0-9]{1,3}){3})?$'
          )
        | list | length == postgres_deploy_networks | length
      - postgres_deploy_install_packages is boolean
      - postgres_deploy_manage_systemd is boolean
      - >-
        not postgres_deploy_manage_systemd | bool
        or postgres_deploy_skip_runtime | bool
        or postgres_deploy_skip_deploy | bool
        or (
          ansible_service_mgr
          | default(ansible_facts.get('service_mgr', ''), true)
        ) == 'systemd'
      - >-
        not (postgres_deploy_manage_systemd | bool)
        or (
          postgres_deploy_systemd_unit_name is string
          and postgres_deploy_systemd_unit_name | length <= 240
          and postgres_deploy_systemd_unit_name
          is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        )
      - >-
        not (postgres_deploy_manage_systemd | bool)
        or (
          postgres_deploy_systemd_description is string
          and postgres_deploy_systemd_description | trim | length > 0
          and '\n' not in postgres_deploy_systemd_description
          and '\r' not in postgres_deploy_systemd_description
        )
      - >-
        not (postgres_deploy_manage_systemd | bool)
        or postgres_deploy_systemd_scope == 'system'
      - postgres_deploy_quadlet_dir is string
      - postgres_deploy_quadlet_dir == '/etc/containers/systemd'
      - postgres_deploy_systemd_enabled is boolean
      - not postgres_deploy_manage_systemd | bool or postgres_deploy_systemd_enabled | bool
      - postgres_deploy_readiness_retries is integer
      - postgres_deploy_readiness_retries is not boolean
      - postgres_deploy_readiness_retries >= 1
      - postgres_deploy_readiness_retries <= 60
      - postgres_deploy_readiness_delay is integer
      - postgres_deploy_readiness_delay is not boolean
      - postgres_deploy_readiness_delay >= 0
      - postgres_deploy_readiness_delay <= 30
      - postgres_deploy_skip_runtime is boolean
      - postgres_deploy_skip_deploy is boolean
      - postgres_deploy_generate_password is boolean
      - postgres_deploy_store_generated_password is boolean
      - postgres_deploy_generated_password_length | int >= 16
    fail_msg: "PostgreSQL deploy variables are missing or invalid."
  tags: always

- name: Validate static IPv4 addresses in PostgreSQL Quadlet network entries
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.get('python', {}).get('executable', '/usr/bin/python3') }}"
      - -c
      - >-
        import ipaddress,sys; address=ipaddress.ip_address(sys.argv[1]);
        sys.exit(0 if address.version == 4 else 1)
      - "{{ item.split(':ip=', 1)[1] }}"
  loop: "{{ postgres_deploy_networks }}"
  loop_control:
    label: "{{ item.split(':ip=', 1)[0] }}"
  changed_when: false
  check_mode: false
  when: "':ip=' in item"
  tags: always
