---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always
  run_once: true

- name: Read the existing secret bundle before generation
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_secret_bundle_address }}"
    engine_mount_point: "{{ vault_secret_bundle_kv_mount }}"
    path: "{{ vault_secret_bundle_kv_path }}"
    validate_certs: "{{ vault_secret_bundle_validate_certs }}"
    ca_cert: "{{ vault_secret_bundle_ca_cert if (vault_secret_bundle_ca_cert | trim | length > 0) else omit }}"
    namespace: "{{ vault_secret_bundle_namespace if (vault_secret_bundle_namespace | trim | length > 0) else omit }}"
    mount_point: "{{ vault_secret_bundle_auth_mount_point }}"
    auth_method: "{{ 'token' if (vault_secret_bundle_token | trim | length > 0) else 'approle' }}"
    token: "{{ vault_secret_bundle_token if (vault_secret_bundle_token | trim | length > 0) else omit }}"
    role_id: "{{ vault_secret_bundle_role_id if (vault_secret_bundle_token | trim | length == 0) else omit }}"
    secret_id: "{{ vault_secret_bundle_secret_id if (vault_secret_bundle_token | trim | length == 0) else omit }}"
  register: vault_secret_bundle_read
  failed_when: >-
    (vault_secret_bundle_read.failed | default(false)) and
    (vault_secret_bundle_read.status | default(0) | int != 404) and
    ('Invalid or missing path' not in (vault_secret_bundle_read.msg | default(''))) and
    ('InvalidPath' not in (vault_secret_bundle_read.msg | default(''))) and
    ('secret not found' not in (vault_secret_bundle_read.msg | default('') | lower)) and
    ('path not found' not in (vault_secret_bundle_read.msg | default('') | lower))
  no_log: true
  run_once: true

- name: Start the effective secret bundle with existing and static values
  ansible.builtin.set_fact:
    vault_secret_bundle_effective: >-
      {{ ((vault_secret_bundle_read.data | default({})).data | default({}))
         | combine(vault_secret_bundle_static_data) }}
  changed_when: false
  no_log: true
  run_once: true

- name: Preflight all observed keypairs before generating any bundle material
  ansible.builtin.include_tasks: keypair_preflight.yml
  loop: "{{ vault_secret_bundle_ssh_keypairs }}"
  loop_control:
    loop_var: vault_secret_bundle_keypair
  run_once: true
  no_log: true

- name: Generate only missing secret bundle values
  ansible.builtin.set_fact:
    vault_secret_bundle_effective: >-
      {{ vault_secret_bundle_effective | combine({
           item.name: (
             vault_secret_bundle_effective[item.name]
             if (vault_secret_bundle_effective[item.name] | default('', true) | string | length > 0)
             else lookup(
               'ansible.builtin.password',
               '/dev/null length=' ~ (item.length | default(40) | int | string)
               ~ ' chars=' ~ (item.chars | default('ascii_letters,digits'))
             )
           )
         }) }}
  loop: "{{ vault_secret_bundle_items }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  no_log: true
  run_once: true
  when: vault_secret_bundle_generate_missing | bool

- name: Reject incomplete read-only secret bundles
  ansible.builtin.assert:
    that:
      - vault_secret_bundle_effective[item.name] | default('', true) | string | length > 0
    fail_msg: "The requested Vault field is absent and generation is disabled."
    quiet: true
  loop: "{{ vault_secret_bundle_items }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  run_once: true
  when: not vault_secret_bundle_generate_missing | bool

- name: Resolve declared SSH keypairs without a persistent plaintext fallback
  ansible.builtin.include_tasks: ssh_keypair.yml
  loop: "{{ vault_secret_bundle_ssh_keypairs }}"
  loop_control:
    loop_var: vault_secret_bundle_keypair
  run_once: true
  no_log: true

- name: Persist the complete secret bundle in Vault
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_secret_bundle_address }}"
    engine_mount_point: "{{ vault_secret_bundle_kv_mount }}"
    path: "{{ vault_secret_bundle_kv_path }}"
    validate_certs: "{{ vault_secret_bundle_validate_certs }}"
    ca_cert: "{{ vault_secret_bundle_ca_cert if (vault_secret_bundle_ca_cert | trim | length > 0) else omit }}"
    namespace: "{{ vault_secret_bundle_namespace if (vault_secret_bundle_namespace | trim | length > 0) else omit }}"
    mount_point: "{{ vault_secret_bundle_auth_mount_point }}"
    auth_method: "{{ 'token' if (vault_secret_bundle_token | trim | length > 0) else 'approle' }}"
    token: "{{ vault_secret_bundle_token if (vault_secret_bundle_token | trim | length > 0) else omit }}"
    role_id: "{{ vault_secret_bundle_role_id if (vault_secret_bundle_token | trim | length == 0) else omit }}"
    secret_id: "{{ vault_secret_bundle_secret_id if (vault_secret_bundle_token | trim | length == 0) else omit }}"
    data: "{{ vault_secret_bundle_effective }}"
    cas: "{{ vault_secret_bundle_read.metadata.version | default(0) | int }}"
  no_log: true
  run_once: true
  when: >-
    vault_secret_bundle_generate_missing | bool and
    ((vault_secret_bundle_read.data | default({})).data | default({}))
    != vault_secret_bundle_effective

- name: Publish the in-memory secret bundle to the caller
  ansible.builtin.set_fact:
    vault_secret_bundle_result: "{{ vault_secret_bundle_effective }}"
  changed_when: false
  no_log: true
  run_once: true
