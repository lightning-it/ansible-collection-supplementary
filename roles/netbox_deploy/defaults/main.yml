---
netbox_deploy_pod_name: "netbox"
netbox_deploy_manifest_path: "/etc/podman/pods/netbox.yml"
netbox_deploy_image: >-
  docker.io/netboxcommunity/netbox:v4.6-5.0.2@sha256:5ee780bdc63b5a5f7ad5073e05e265f74d1a1c52ca0057facc9e4279fcfdb8cc
netbox_deploy_postgres_image: >-
  docker.io/library/postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
netbox_deploy_valkey_image: >-
  docker.io/valkey/valkey:9.2-alpine@sha256:48dc9d22ed984d9599e0d5823726053b0b426a86cff534f6bf1bd3dfb951f33e
netbox_deploy_host_ip: "127.0.0.1"
netbox_deploy_port: 8081
netbox_deploy_base_dir: "/srv/netbox"
netbox_deploy_config_path: "{{ netbox_deploy_base_dir }}/config/goal07-sso.py"
netbox_deploy_db_name: "netbox"
netbox_deploy_db_user: "netbox"
netbox_deploy_superuser_name: "breakglass"
netbox_deploy_superuser_email: "breakglass@example.invalid"
netbox_deploy_allowed_hosts: "localhost 127.0.0.1 [::1]"
netbox_deploy_secrets: {}
netbox_deploy_oidc_enabled: false
netbox_deploy_oidc_key: "netbox"
netbox_deploy_oidc_url: ""
netbox_deploy_oidc_username_claim: "email"
netbox_deploy_health_url: "http://{{ netbox_deploy_host_ip }}:{{ netbox_deploy_port }}/login/"
netbox_deploy_validate_certs: true
netbox_deploy_install_packages: true
netbox_deploy_manage_systemd: true
netbox_deploy_skip_runtime: false
