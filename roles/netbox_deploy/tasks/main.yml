---
- name: Validate NetBox deployment contract
  ansible.builtin.assert:
    that:
      - netbox_deploy_host_ip | trim | length > 0
      - netbox_deploy_port | int > 0
      - netbox_deploy_image is search('@sha256:')
      - netbox_deploy_postgres_image is search('@sha256:')
      - netbox_deploy_valkey_image is search('@sha256:')
      - netbox_deploy_allowed_hosts | trim | length > 0
      - netbox_deploy_allowed_hosts | trim != '*'
      - netbox_deploy_superuser_email is search('@')
      - netbox_deploy_secrets.db_password | default('', true) | length >= 16
      - netbox_deploy_secrets.redis_password | default('', true) | length >= 16
      - netbox_deploy_secrets.redis_cache_password | default('', true) | length >= 16
      - netbox_deploy_secrets.secret_key | default('', true) | length >= 50
      - netbox_deploy_secrets.superuser_password | default('', true) | length >= 16
      - netbox_deploy_secrets.superuser_api_token | default('', true) | length == 40
      - not netbox_deploy_oidc_enabled | bool or netbox_deploy_oidc_url | trim | length > 0
      - >-
        not netbox_deploy_oidc_enabled | bool or
        netbox_deploy_secrets.oidc_client_secret | default('', true) | length >= 16
    fail_msg: >-
      NetBox requires immutable images, restricted allowed hosts, complete
      Vault secrets, and an OIDC issuer when SSO is enabled.
  no_log: true

- name: Install the Podman runtime for NetBox
  ansible.builtin.package:
    name: podman
    state: present
  when: netbox_deploy_install_packages | bool

- name: Create NetBox persistent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ netbox_deploy_base_dir }}", owner: root, group: root, mode: "0750"}
    - {path: "{{ netbox_deploy_base_dir }}/postgres", owner: "999", group: "999", mode: "0700"}
    - {path: "{{ netbox_deploy_base_dir }}/redis", owner: "999", group: "999", mode: "0700"}
    - {path: "{{ netbox_deploy_base_dir }}/redis-cache", owner: "999", group: "999", mode: "0700"}
    - {path: "{{ netbox_deploy_config_path | dirname }}", owner: "1000", group: "1000", mode: "0750"}
    - {path: "{{ netbox_deploy_base_dir }}/media", owner: "1000", group: "1000", mode: "0750"}
    - {path: "{{ netbox_deploy_base_dir }}/reports", owner: "1000", group: "1000", mode: "0750"}
    - {path: "{{ netbox_deploy_base_dir }}/scripts", owner: "1000", group: "1000", mode: "0750"}
    - {path: "{{ netbox_deploy_manifest_path | dirname }}", owner: root, group: root, mode: "0755"}

- name: Render the private NetBox SSO configuration
  ansible.builtin.template:
    src: netbox-sso.py.j2
    dest: "{{ netbox_deploy_config_path }}"
    owner: "1000"
    group: "1000"
    mode: "0600"
  no_log: true
  notify: Restart NetBox
  when: netbox_deploy_oidc_enabled | bool

- name: Remove disabled NetBox SSO configuration
  ansible.builtin.file:
    path: "{{ netbox_deploy_config_path }}"
    state: absent
  notify: Restart NetBox
  when: not netbox_deploy_oidc_enabled | bool

- name: Render the private NetBox pod manifest
  ansible.builtin.template:
    src: netbox-pod.yml.j2
    dest: "{{ netbox_deploy_manifest_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart NetBox

- name: Install NetBox systemd unit
  ansible.builtin.template:
    src: netbox.service.j2
    dest: /etc/systemd/system/netbox.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart NetBox
  when: netbox_deploy_manage_systemd | bool

- name: Apply pending NetBox runtime changes
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode and not netbox_deploy_skip_runtime | bool

- name: Ensure NetBox is enabled and started
  ansible.builtin.systemd:
    name: netbox.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - netbox_deploy_manage_systemd | bool
    - not ansible_check_mode
    - not netbox_deploy_skip_runtime | bool

- name: Wait for NetBox readiness
  ansible.builtin.uri:
    url: "{{ netbox_deploy_health_url }}"
    method: GET
    status_code: 200
    validate_certs: "{{ netbox_deploy_validate_certs }}"
  register: netbox_deploy_health
  until: netbox_deploy_health.status == 200
  retries: 40
  delay: 5
  changed_when: false
  when: not ansible_check_mode and not netbox_deploy_skip_runtime | bool
