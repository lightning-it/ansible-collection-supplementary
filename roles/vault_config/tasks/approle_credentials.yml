---
- name: Select Vault auth
  ansible.builtin.set_fact:
    vault_config_auth_method: >-
      {{
        'approle'
        if (vault_config_hashi_vault_auth_method == 'approle'
            and (ansible_hashi_vault_role_id | default('', true) | trim | length > 0)
            and (ansible_hashi_vault_secret_id | default('', true) | trim | length > 0))
        else 'token'
        if (vault_config_token | default('', true) | trim | length > 0)
        else vault_config_hashi_vault_auth_method
      }}
    vault_config_role_id: "{{ ansible_hashi_vault_role_id | default(omit, true) }}"
    vault_config_secret_id: "{{ ansible_hashi_vault_secret_id | default(omit, true) }}"
  changed_when: false
  delegate_to: localhost
  no_log: true

- name: Get AppRole role ID for {{ approle.role_name }}
  community.hashi_vault.vault_read:
    url: "{{ vault_address }}"
    auth_method: "{{ vault_config_auth_method }}"
    token: "{{ vault_config_token }}"
    role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
    secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
    validate_certs: "{{ vault_config_vault_validate_certs }}"
    namespace: "{{ approle.namespace | default(omit) }}"
    path: "auth/approle/role/{{ approle.role_name }}/role-id"
  register: approle_role_id
  delegate_to: localhost
  no_log: true


# First try to retrieve the credentials from the KV.
# A missing KV entry is expected for a new AppRole.

- name: Read existing AppRole credentials from {{ approle.credential_path }}
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_address }}"
    auth_method: "{{ vault_config_auth_method }}"
    token: "{{ vault_config_token }}"
    role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
    secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
    validate_certs: "{{ vault_config_vault_validate_certs }}"
    engine_mount_point: "{{ approle.kv_mount }}"
    path: "{{ approle.credential_path }}"
    namespace: "{{ approle.namespace | default(omit) }}"
  register: existing_approle_credentials
  failed_when: false
  delegate_to: localhost
  no_log: true


# If a Secret ID exists in the KV, validate it against the AppRole.
#
# IMPORTANT:
# secret-id/lookup does NOT consume a Secret ID.
# This is therefore safe even when secret_id_num_uses is 1.

- name: Validate existing AppRole secret ID for {{ approle.role_name }}
  community.hashi_vault.vault_write:
    url: "{{ vault_address }}"
    auth_method: "{{ vault_config_auth_method }}"
    token: "{{ vault_config_token }}"
    role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
    secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
    validate_certs: "{{ vault_config_vault_validate_certs }}"
    namespace: "{{ approle.namespace | default(omit) }}"
    path: "auth/approle/role/{{ approle.role_name }}/secret-id/lookup"
    data:
      secret_id: "{{ existing_approle_credentials.data.data.secret_id }}"
  register: existing_approle_secret_id_lookup
  failed_when: false
  changed_when: false
  when:
    - not existing_approle_credentials.failed
    - existing_approle_credentials.data is defined
    - existing_approle_credentials.data.data is defined
    - existing_approle_credentials.data.data.secret_id is defined
    - existing_approle_credentials.data.data.secret_id | length > 0
  delegate_to: localhost
  no_log: true


# Generate a new Secret ID only when:
#
# - there is no KV entry, or
# - the KV entry has no Secret ID, or
# - the existing Secret ID is no longer valid.
#
# A normal Ansible run therefore does NOT generate anything.

- name: Create new AppRole secret ID for {{ approle.role_name }}
  community.hashi_vault.vault_write:
    url: "{{ vault_address }}"
    auth_method: "{{ vault_config_auth_method }}"
    token: "{{ vault_config_token }}"
    role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
    secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
    validate_certs: "{{ vault_config_vault_validate_certs }}"
    namespace: "{{ approle.namespace | default(omit) }}"
    path: "auth/approle/role/{{ approle.role_name }}/secret-id"
    data:
      ttl: "{{ approle.secret_id_ttl | default(0) }}"
      num_uses: "{{ approle.secret_id_num_uses | default(0) }}"
  register: generated_approle_secret_id
  when:
    - >
      existing_approle_credentials.failed
      or existing_approle_credentials.data is not defined
      or existing_approle_credentials.data.data is not defined
      or existing_approle_credentials.data.data.secret_id is not defined
      or existing_approle_credentials.data.data.secret_id | length == 0
      or existing_approle_secret_id_lookup.failed | default(false)
  delegate_to: localhost
  no_log: true


# Store the new credentials only when a new Secret ID was actually generated.
#
# The role ID is always taken from the AppRole itself, i.e. from Terraform's
# AppRole configuration. Ansible does not create or manage the role ID.

- name: Store new AppRole credentials in {{ approle.credential_path }}
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_address }}"
    auth_method: "{{ vault_config_auth_method }}"
    token: "{{ vault_config_token }}"
    role_id: "{{ ansible_hashi_vault_role_id | default('') }}"
    secret_id: "{{ ansible_hashi_vault_secret_id | default('') }}"
    validate_certs: "{{ vault_config_vault_validate_certs }}"
    engine_mount_point: "{{ approle.kv_mount }}"
    path: "{{ approle.credential_path }}"
    namespace: "{{ approle.namespace | default(omit) }}"
    data:
      role_id: "{{ approle_role_id.data.data.role_id }}"
      secret_id: "{{ generated_approle_secret_id.data.data.secret_id }}"
  when:
    - generated_approle_secret_id is defined
    - generated_approle_secret_id.changed | default(false)
  delegate_to: localhost
  no_log: true
