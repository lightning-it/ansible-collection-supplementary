---
- name: Ensure core Nginx variables are set
  ansible.builtin.assert:
    that:
      - nginx_deploy_pod_name | length > 0
      - nginx_deploy_pod_manifest_path | length > 0
      - nginx_deploy_image | length > 0
      - nginx_deploy_container_name | length > 0
      - nginx_deploy_conf_file | length > 0
      - nginx_deploy_conf_d_dir | length > 0
      - nginx_deploy_host_conf_file | length > 0
      - nginx_deploy_host_conf_d_dir | length > 0
      - nginx_deploy_host_root | length > 0
      - nginx_deploy_health_url_effective | length > 0
      - nginx_deploy_manage_systemd is boolean
      - >-
        not (nginx_deploy_manage_systemd | bool)
        or (
          nginx_deploy_systemd_unit_name is string
          and nginx_deploy_systemd_unit_name | length <= 240
          and nginx_deploy_systemd_unit_name
          is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
        )
      - >-
        not (nginx_deploy_manage_systemd | bool)
        or (
          nginx_deploy_systemd_description is string
          and nginx_deploy_systemd_description | trim | length > 0
          and '\n' not in nginx_deploy_systemd_description
          and '\r' not in nginx_deploy_systemd_description
        )
      - >-
        not (nginx_deploy_manage_systemd | bool)
        or nginx_deploy_systemd_scope == 'system'
      - >-
        not (nginx_deploy_manage_systemd | bool)
        or nginx_deploy_quadlet_dir | default('', true) | trim | length > 0
      - >-
        not (nginx_deploy_manage_systemd | bool)
        or nginx_deploy_systemd_enabled is boolean
      - nginx_deploy_skip_runtime is boolean
      - nginx_deploy_skip_config is boolean
      - nginx_deploy_skip_deploy is boolean
      - nginx_deploy_skip_validate is boolean
      - nginx_deploy_validate_certs is boolean
      - nginx_deploy_port_bindings is sequence
      - nginx_deploy_port_bindings | length > 0
      - nginx_deploy_networks is sequence
      - nginx_deploy_networks is not string
      - >-
        nginx_deploy_networks | select('string') | list | length
        == nginx_deploy_networks | length
      - >-
        nginx_deploy_networks | map('trim') | reject('equalto', '') | list | length
        == nginx_deploy_networks | length
      - >-
        nginx_deploy_networks
        | select('match', '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$')
        | list | length == nginx_deploy_networks | length
    fail_msg: "Nginx core variables are missing or invalid."
  tags: always

- name: Ensure default site variables are set when managed
  ansible.builtin.assert:
    that:
      - nginx_deploy_root | length > 0
      - nginx_deploy_host_root | length > 0
      - nginx_deploy_listen_port | int > 0
      - nginx_deploy_host_port | int > 0
    fail_msg: "nginx_deploy_root and nginx_deploy_listen_port are required when managing the default site."
  when:
    - nginx_deploy_manage_default_site | bool
    - not nginx_deploy_skip_config | bool
  tags: always

- name: Ensure Nginx port binding definitions are valid
  ansible.builtin.assert:
    that:
      - item.container_port is defined
      - item.container_port | int > 0
      - item.host_port is defined
      - item.host_port | int > 0
    fail_msg: "Each nginx_deploy_port_bindings entry must define container_port and host_port."
    quiet: true
  loop: "{{ nginx_deploy_port_bindings }}"
  tags: always
