---
- name: Manage Nginx native Quadlet service
  when:
    - nginx_deploy_manage_systemd | bool
    - not ansible_check_mode
  tags:
    - systemd
  block:
    - name: Resolve the exact legacy Podman kube unit identity
      ansible.builtin.command:
        argv:
          - systemd-escape
          - "{{ nginx_deploy_pod_manifest_path }}"
      register: nginx_deploy_legacy_systemd_name
      changed_when: false

    - name: Inspect the exact legacy Nginx unit activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
      register: nginx_deploy_legacy_systemd_active
      changed_when: false
      failed_when: false

    - name: Inspect the exact legacy Nginx unit enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
      register: nginx_deploy_legacy_systemd_enabled
      changed_when: false
      failed_when: false

    - name: Inspect the exact native Nginx unit activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ nginx_deploy_systemd_unit_name }}.service"
      register: nginx_deploy_native_systemd_active
      changed_when: false
      failed_when: false

    - name: Refuse unknown Nginx lifecycle states
      ansible.builtin.assert:
        that:
          - nginx_deploy_legacy_systemd_active.rc in [0, 1, 3, 4]
          - >-
            nginx_deploy_legacy_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
          - nginx_deploy_legacy_systemd_enabled.rc in [0, 1, 3, 4]
          - >-
            nginx_deploy_legacy_systemd_enabled.stdout | trim
            in [
              'enabled', 'enabled-runtime', 'linked', 'linked-runtime', 'alias',
              'disabled', 'static', 'indirect', 'generated', 'transient',
              'masked', 'masked-runtime', 'not-found'
            ]
          - nginx_deploy_native_systemd_active.rc in [0, 3, 4]
          - >-
            nginx_deploy_native_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
        fail_msg: >-
          Unable to prove the exact Nginx legacy/native lifecycle state;
          refusing Quadlet takeover.
        quiet: true

    - name: Refuse unmanaged Nginx pod; remove it first
      ansible.builtin.command:
        argv: [podman, pod, exists, "{{ nginx_deploy_pod_name }}"]
      register: nginx_deploy_existing_pod
      changed_when: false
      failed_when: >-
        nginx_deploy_existing_pod.rc not in [0, 1]
        or (nginx_deploy_existing_pod.rc == 0
        and nginx_deploy_legacy_systemd_active.stdout | trim != 'active'
        and nginx_deploy_native_systemd_active.stdout | trim != 'active')

    - name: Stage the native Nginx Quadlet before legacy shutdown
      ansible.builtin.include_role:
        name: lit.foundational.podman_systemd
      vars:
        podman_systemd_action: stopped
        podman_systemd_unit_name: "{{ nginx_deploy_systemd_unit_name }}"
        podman_systemd_description: "{{ nginx_deploy_systemd_description }}"
        podman_systemd_manifest_path: "{{ nginx_deploy_pod_manifest_path }}"
        podman_systemd_scope: "{{ nginx_deploy_systemd_scope }}"
        podman_systemd_quadlet_dir: "{{ nginx_deploy_quadlet_dir }}"
        podman_systemd_enabled: false
        podman_systemd_networks: "{{ nginx_deploy_networks }}"
      when: >-
        nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
        or nginx_deploy_legacy_systemd_enabled.stdout | trim
        in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime', 'alias']

    - name: Cut over to native Nginx Quadlet with rollback
      block:
        - name: Stop and disable the exact legacy Nginx unit before Quadlet takeover
          ansible.builtin.systemd:
            name: "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
            state: stopped
            enabled: false
          when: >-
            nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
            or nginx_deploy_legacy_systemd_enabled.stdout | trim
            in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime', 'alias']

        - name: Manage the native Nginx Quadlet service
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: >-
              {{
                'restarted'
                if (
                  nginx_deploy_kubeplay_remove | default(false) | bool
                  or nginx_deploy_kubeplay_run | default(false) | bool
                  or nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
                  or nginx_deploy_legacy_systemd_enabled.stdout | trim
                    in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime', 'alias']
                )
                else 'present'
              }}
            podman_systemd_unit_name: "{{ nginx_deploy_systemd_unit_name }}"
            podman_systemd_description: "{{ nginx_deploy_systemd_description }}"
            podman_systemd_manifest_path: "{{ nginx_deploy_pod_manifest_path }}"
            podman_systemd_scope: "{{ nginx_deploy_systemd_scope }}"
            podman_systemd_quadlet_dir: "{{ nginx_deploy_quadlet_dir }}"
            podman_systemd_enabled: "{{ nginx_deploy_systemd_enabled }}"
            podman_systemd_networks: "{{ nginx_deploy_networks }}"

        - name: Wait until Nginx is reachable
          ansible.builtin.uri:
            url: "{{ nginx_deploy_health_url_effective }}"
            method: GET
            validate_certs: "{{ nginx_deploy_validate_certs }}"
          register: nginx_deploy_health
          until: nginx_deploy_health.status == 200
          retries: 30
          delay: 5
          changed_when: false
          failed_when: nginx_deploy_health is failed or nginx_deploy_health.status != 200
      rescue:
        - name: Remove the failed native Nginx Quadlet runtime
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: absent
            podman_systemd_unit_name: "{{ nginx_deploy_systemd_unit_name }}"
            podman_systemd_description: "{{ nginx_deploy_systemd_description }}"
            podman_systemd_manifest_path: "{{ nginx_deploy_pod_manifest_path }}"
            podman_systemd_scope: "{{ nginx_deploy_systemd_scope }}"
            podman_systemd_quadlet_dir: "{{ nginx_deploy_quadlet_dir }}"
            podman_systemd_enabled: false
            podman_systemd_networks: "{{ nginx_deploy_networks }}"

        - name: Restore the exact legacy Nginx unit after failed takeover
          ansible.builtin.systemd:
            name: "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
            state: >-
              {{ 'started' if nginx_deploy_legacy_systemd_active.stdout | trim == 'active' else 'stopped' }}
            enabled: >-
              {{
                nginx_deploy_legacy_systemd_enabled.stdout | trim
                in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime', 'alias']
              }}
          when: >-
            nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
            or nginx_deploy_legacy_systemd_enabled.stdout | trim
            in ['enabled', 'enabled-runtime', 'linked', 'linked-runtime', 'alias']

        - name: Report failed native Nginx takeover after rollback
          ansible.builtin.fail:
            msg: >-
              Native Nginx Quadlet takeover failed. The failed native runtime
              was removed and the exact legacy unit was restored when present.
