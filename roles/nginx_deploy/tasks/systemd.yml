---
- name: Manage Nginx native Quadlet service
  when:
    - nginx_deploy_manage_systemd | bool
    - not ansible_check_mode
  tags:
    - systemd
  block:
    - name: Resolve the exact legacy Podman kube unit identity
      ansible.builtin.command:
        argv:
          - systemd-escape
          - "{{ nginx_deploy_pod_manifest_path }}"
      register: nginx_deploy_legacy_systemd_name
      changed_when: false

    - name: Inspect the exact legacy Nginx unit activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
      register: nginx_deploy_legacy_systemd_active
      changed_when: false
      failed_when: false

    - name: Inspect the exact legacy Nginx unit enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
      register: nginx_deploy_legacy_systemd_enabled
      changed_when: false
      failed_when: false

    - name: Inspect the exact native Nginx unit activity
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ nginx_deploy_systemd_unit_name }}.service"
      register: nginx_deploy_native_systemd_active
      changed_when: false
      failed_when: false

    - name: Inspect the exact native Nginx unit enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ nginx_deploy_systemd_unit_name }}.service"
      register: nginx_deploy_native_systemd_enabled
      changed_when: false
      failed_when: false

    - name: Refuse unknown Nginx lifecycle states
      ansible.builtin.assert:
        that:
          - nginx_deploy_legacy_systemd_active.rc in [0, 1, 3, 4]
          - >-
            nginx_deploy_legacy_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
          - nginx_deploy_legacy_systemd_enabled.rc in [0, 1, 3, 4]
          - >-
            nginx_deploy_legacy_systemd_enabled.stdout | trim
            in ['enabled', 'disabled', 'not-found']
          - nginx_deploy_native_systemd_active.rc in [0, 3, 4]
          - >-
            nginx_deploy_native_systemd_active.stdout | trim
            in ['active', 'inactive', 'failed', 'unknown']
          - nginx_deploy_native_systemd_enabled.rc in [0, 1, 3, 4]
          - >-
            nginx_deploy_native_systemd_enabled.stdout | trim
            in ['enabled', 'disabled', 'generated', 'not-found']
        fail_msg: >-
          Unable to prove the exact Nginx legacy/native lifecycle state;
          refusing Quadlet takeover.
        quiet: true

    - name: Inspect the desired native Nginx Quadlet file
      ansible.builtin.stat:
        path: "{{ nginx_deploy_quadlet_dir }}/{{ nginx_deploy_systemd_unit_name }}.kube"
        follow: false
      register: nginx_deploy_native_quadlet_file

    - name: Read the desired native Nginx Quadlet file
      ansible.builtin.slurp:
        path: "{{ nginx_deploy_quadlet_dir }}/{{ nginx_deploy_systemd_unit_name }}.kube"
      register: nginx_deploy_native_quadlet_read
      when:
        - nginx_deploy_native_quadlet_file.stat.exists | default(false)
        - nginx_deploy_native_quadlet_file.stat.isreg | default(false)
        - not (nginx_deploy_native_quadlet_file.stat.islnk | default(false))

    - name: Inspect the pre-transaction Nginx Pod manifest
      ansible.builtin.stat:
        path: "{{ nginx_deploy_pod_manifest_path }}"
        follow: false
      register: nginx_deploy_original_manifest_file

    - name: Refuse an unsafe pre-transaction Nginx Pod manifest
      ansible.builtin.assert:
        that:
          - >-
            not (nginx_deploy_original_manifest_file.stat.exists | default(false))
            or (
              nginx_deploy_original_manifest_file.stat.isreg | default(false)
              and not (nginx_deploy_original_manifest_file.stat.islnk | default(false))
            )
        fail_msg: >-
          The Nginx Pod manifest must be absent or a regular non-symlink file
          before a transactional Quadlet update.
        quiet: true

    - name: Capture the exact pre-transaction Nginx Pod manifest
      ansible.builtin.slurp:
        path: "{{ nginx_deploy_pod_manifest_path }}"
      register: nginx_deploy_original_manifest_read
      when: nginx_deploy_original_manifest_file.stat.exists | default(false)

    - name: Probe the desired Nginx Pod manifest without mutation
      ansible.builtin.template:
        src: nginx-pod.yml.j2
        dest: "{{ nginx_deploy_pod_manifest_path }}"
        mode: '0644'
      check_mode: true
      register: nginx_deploy_manifest_probe

    - name: Refuse unproven drift in an existing native Nginx Quadlet
      ansible.builtin.assert:
        that:
          - nginx_deploy_native_quadlet_file.stat.exists | default(false)
          - nginx_deploy_native_quadlet_file.stat.isreg | default(false)
          - not (nginx_deploy_native_quadlet_file.stat.islnk | default(false))
          - nginx_deploy_native_quadlet_read.content | default('') | length > 0
          - >-
            (
              nginx_deploy_native_quadlet_read.content
              | default('') | b64decode
            ).splitlines()
            | reject('equalto', '') | list
            == (
              [
                '[Unit]',
                'Description=' ~ nginx_deploy_systemd_description,
                'After=network-online.target',
                'Wants=network-online.target',
                '[Kube]',
                'Yaml=' ~ nginx_deploy_pod_manifest_path
              ]
              + (
                nginx_deploy_networks
                | map('regex_replace', '^(.*)$', 'Network=\\1') | list
              )
              + ['[Install]', 'WantedBy=multi-user.target']
            )
          - >-
            (
              nginx_deploy_systemd_enabled | bool
              and nginx_deploy_native_systemd_enabled.stdout | trim
              in ['enabled', 'generated']
            )
            or (
              not (nginx_deploy_systemd_enabled | bool)
              and nginx_deploy_native_systemd_enabled.stdout | trim == 'disabled'
            )
        fail_msg: >-
          The existing native Nginx Quadlet cannot be proven identical to the
          requested description, manifest, networks, directory, or enablement.
          Refusing an unprotected in-place update; use a transactional migration.
        quiet: true
      when: >-
        nginx_deploy_native_quadlet_file.stat.exists | default(false)
        or nginx_deploy_native_systemd_enabled.stdout | trim != 'not-found'

    - name: Refuse unmanaged Nginx pod; remove it first
      ansible.builtin.command:
        argv: [podman, pod, exists, "{{ nginx_deploy_pod_name }}"]
      register: nginx_deploy_existing_pod
      changed_when: false
      failed_when: >-
        nginx_deploy_existing_pod.rc not in [0, 1]
        or (nginx_deploy_existing_pod.rc == 0
        and nginx_deploy_legacy_systemd_active.stdout | trim != 'active'
        and nginx_deploy_native_systemd_active.stdout | trim != 'active')

    - name: Refuse non-transactional updates of an existing native Nginx unit
      ansible.builtin.assert:
        that:
          - >-
            nginx_deploy_native_systemd_enabled.stdout | trim == 'not-found'
            or (
              nginx_deploy_native_systemd_active.stdout | trim
              in ['active', 'inactive', 'failed']
              and
              not (nginx_deploy_manifest_probe.changed | default(false) | bool)
            )
        fail_msg: >-
          Updating an existing native Nginx Quadlet requires transactional
          manifest backup and restore support. Refusing mutation of the
          pre-existing runtime.
        quiet: true

    - name: Cut over to native Nginx Quadlet with rollback
      block:
        - name: Render the desired Nginx Pod manifest transactionally
          ansible.builtin.template:
            src: nginx-pod.yml.j2
            dest: "{{ nginx_deploy_pod_manifest_path }}"
            mode: '0644'
          register: nginx_deploy_manifest_render

        - name: Stage the native Nginx Quadlet before legacy shutdown
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: stopped
            podman_systemd_unit_name: "{{ nginx_deploy_systemd_unit_name }}"
            podman_systemd_description: "{{ nginx_deploy_systemd_description }}"
            podman_systemd_manifest_path: "{{ nginx_deploy_pod_manifest_path }}"
            podman_systemd_scope: "{{ nginx_deploy_systemd_scope }}"
            podman_systemd_quadlet_dir: "{{ nginx_deploy_quadlet_dir }}"
            podman_systemd_enabled: false
            podman_systemd_networks: "{{ nginx_deploy_networks }}"
          when: >-
            nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
            or nginx_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'

        - name: Stop and disable the exact legacy Nginx unit before Quadlet takeover
          ansible.builtin.systemd:
            name: "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
            state: stopped
            enabled: false
          when: >-
            nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
            or nginx_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'

        - name: Manage the native Nginx Quadlet service
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: >-
              {{
                'restarted'
                if (
                  nginx_deploy_manifest_render.changed | default(false) | bool
                  or nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
                  or nginx_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'
                )
                else 'present'
              }}
            podman_systemd_unit_name: "{{ nginx_deploy_systemd_unit_name }}"
            podman_systemd_description: "{{ nginx_deploy_systemd_description }}"
            podman_systemd_manifest_path: "{{ nginx_deploy_pod_manifest_path }}"
            podman_systemd_scope: "{{ nginx_deploy_systemd_scope }}"
            podman_systemd_quadlet_dir: "{{ nginx_deploy_quadlet_dir }}"
            podman_systemd_enabled: "{{ nginx_deploy_systemd_enabled }}"
            podman_systemd_networks: "{{ nginx_deploy_networks }}"
          when: >-
            nginx_deploy_native_systemd_enabled.stdout | trim == 'not-found'
            or nginx_deploy_native_systemd_active.stdout | trim in ['inactive', 'failed']
            or nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
            or nginx_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'

        - name: Wait until Nginx is reachable
          ansible.builtin.uri:
            url: "{{ nginx_deploy_health_url_effective }}"
            method: GET
            validate_certs: "{{ nginx_deploy_validate_certs }}"
          register: nginx_deploy_health
          until: nginx_deploy_health.status == 200
          retries: 30
          delay: 5
          changed_when: false
          failed_when: nginx_deploy_health is failed or nginx_deploy_health.status != 200
      rescue:
        - name: Capture the original native Nginx takeover failure
          ansible.builtin.set_fact:
            nginx_deploy_takeover_failure_message: >-
              {{ ansible_failed_result.msg | default('unknown takeover failure') }}
            nginx_deploy_cleanup_failure_message: ""
            nginx_deploy_manifest_restore_failure_message: ""
            nginx_deploy_native_restore_failure_message: ""
            nginx_deploy_legacy_restore_failure_message: ""

        - name: Attempt failed native Nginx cleanup without blocking restoration
          block:
            - name: Remove the failed native Nginx Quadlet runtime
              ansible.builtin.include_role:
                name: lit.foundational.podman_systemd
              vars:
                podman_systemd_action: absent
                podman_systemd_unit_name: "{{ nginx_deploy_systemd_unit_name }}"
                podman_systemd_description: "{{ nginx_deploy_systemd_description }}"
                podman_systemd_manifest_path: "{{ nginx_deploy_pod_manifest_path }}"
                podman_systemd_scope: "{{ nginx_deploy_systemd_scope }}"
                podman_systemd_quadlet_dir: "{{ nginx_deploy_quadlet_dir }}"
                podman_systemd_enabled: false
                podman_systemd_networks: "{{ nginx_deploy_networks }}"
              when: not (nginx_deploy_native_quadlet_file.stat.exists | default(false))
          rescue:
            - name: Capture failed native Nginx cleanup
              ansible.builtin.set_fact:
                nginx_deploy_cleanup_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown cleanup failure') }}

        - name: Attempt exact Nginx Pod manifest restoration
          block:
            - name: Restore the exact pre-transaction Nginx Pod manifest
              ansible.builtin.copy:
                dest: "{{ nginx_deploy_pod_manifest_path }}"
                content: "{{ nginx_deploy_original_manifest_read.content | b64decode }}"
                owner: "{{ nginx_deploy_original_manifest_file.stat.uid }}"
                group: "{{ nginx_deploy_original_manifest_file.stat.gid }}"
                mode: "{{ nginx_deploy_original_manifest_file.stat.mode }}"
              when: nginx_deploy_original_manifest_file.stat.exists | default(false)

            - name: Remove a transaction-created Nginx Pod manifest
              ansible.builtin.file:
                path: "{{ nginx_deploy_pod_manifest_path }}"
                state: absent
              when: not (nginx_deploy_original_manifest_file.stat.exists | default(false))
          rescue:
            - name: Capture failed Nginx Pod manifest restoration
              ansible.builtin.set_fact:
                nginx_deploy_manifest_restore_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown manifest restoration failure') }}

        - name: Attempt pre-existing native Nginx restoration without blocking legacy restoration
          block:
            - name: Restore pre-existing enabled or disabled native Nginx service state after failure
              ansible.builtin.systemd:
                name: "{{ nginx_deploy_systemd_unit_name }}.service"
                state: >-
                  {{ 'started' if nginx_deploy_native_systemd_active.stdout | trim == 'active' else 'stopped' }}
                enabled: >-
                  {{ nginx_deploy_native_systemd_enabled.stdout | trim == 'enabled' }}
                scope: "{{ nginx_deploy_systemd_scope }}"
              when: nginx_deploy_native_systemd_enabled.stdout | trim in ['enabled', 'disabled']

            - name: Restore pre-existing generated native Nginx service state after failure
              ansible.builtin.systemd:
                name: "{{ nginx_deploy_systemd_unit_name }}.service"
                state: >-
                  {{ 'started' if nginx_deploy_native_systemd_active.stdout | trim == 'active' else 'stopped' }}
                scope: "{{ nginx_deploy_systemd_scope }}"
              when: nginx_deploy_native_systemd_enabled.stdout | trim == 'generated'
          rescue:
            - name: Capture failed pre-existing native Nginx restoration
              ansible.builtin.set_fact:
                nginx_deploy_native_restore_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown native restoration failure') }}

        - name: Attempt exact legacy Nginx restoration after failed takeover
          block:
            - name: Restore the exact legacy Nginx unit after failed takeover
              ansible.builtin.systemd:
                name: "podman-kube@{{ nginx_deploy_legacy_systemd_name.stdout }}.service"
                state: >-
                  {{ 'started' if nginx_deploy_legacy_systemd_active.stdout | trim == 'active' else 'stopped' }}
                enabled: >-
                  {{ nginx_deploy_legacy_systemd_enabled.stdout | trim == 'enabled' }}
              when: >-
                nginx_deploy_legacy_systemd_active.stdout | trim == 'active'
                or nginx_deploy_legacy_systemd_enabled.stdout | trim == 'enabled'
          rescue:
            - name: Capture failed legacy Nginx restoration
              ansible.builtin.set_fact:
                nginx_deploy_legacy_restore_failure_message: >-
                  {{ ansible_failed_result.msg | default('unknown legacy restoration failure') }}

        - name: Report failed native Nginx takeover after rollback
          ansible.builtin.fail:
            msg: >-
              Native Nginx Quadlet takeover failed:
              {{ nginx_deploy_takeover_failure_message }}.
              Cleanup failure:
              {{ nginx_deploy_cleanup_failure_message | default('') | default('none', true) }}.
              Manifest restoration failure:
              {{ nginx_deploy_manifest_restore_failure_message | default('') | default('none', true) }}.
              Native restoration failure:
              {{ nginx_deploy_native_restore_failure_message | default('') | default('none', true) }}.
              Legacy restoration failure:
              {{ nginx_deploy_legacy_restore_failure_message | default('') | default('none', true) }}.
