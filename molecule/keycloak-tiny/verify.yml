---
- name: Verify canonical Keycloak Tiny scenario
  hosts: all
  gather_facts: false
  become: false
  vars:
    keycloak_tiny_admin_password: "{{ lookup('env', 'KEYCLOAK_TEST_ADMIN_PASSWORD') }}"
    keycloak_tiny_junit_dir: "{{ lookup('env', 'KEYCLOAK_JUNIT_DIR') | default('artifacts/junit', true) }}"
  tasks:
    - name: Verify Keycloak readiness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:19000/health/ready
        status_code: 200
      changed_when: false

    - name: Verify Keycloak liveness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:19000/health/live
        status_code: 200
      changed_when: false

    - name: Read Keycloak OIDC discovery document
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/realms/keycloak-test/.well-known/openid-configuration
        status_code: 200
        return_content: true
      register: keycloak_tiny_discovery
      changed_when: false

    - name: Request a Keycloak administration token
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/realms/master/protocol/openid-connect/token
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: admin
          password: "{{ keycloak_tiny_admin_password }}"
        status_code: 200
        return_content: true
      register: keycloak_tiny_admin_token
      changed_when: false
      no_log: true

    - name: Read managed Keycloak realm state
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/admin/realms/keycloak-test
        headers:
          Authorization: "Bearer {{ keycloak_tiny_admin_token.json.access_token }}"
        status_code: 200
        return_content: true
      register: keycloak_tiny_realm_state
      changed_when: false
      no_log: true

    - name: Read managed Keycloak authentication flows
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/admin/realms/keycloak-test/authentication/flows
        headers:
          Authorization: "Bearer {{ keycloak_tiny_admin_token.json.access_token }}"
        status_code: 200
        return_content: true
      register: keycloak_tiny_flows
      changed_when: false
      no_log: true

    - name: Read managed browser-flow executions
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:18080/admin/realms/keycloak-test/authentication/flows/keycloak-test-browser/executions
        headers:
          Authorization: "Bearer {{ keycloak_tiny_admin_token.json.access_token }}"
        status_code: 200
        return_content: true
      register: keycloak_tiny_flow_executions
      changed_when: false
      no_log: true

    - name: Read managed Keycloak identity provider
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:18080/admin/realms/keycloak-test/identity-provider/instances/keycloak-test-upstream
        headers:
          Authorization: "Bearer {{ keycloak_tiny_admin_token.json.access_token }}"
        status_code: 200
        return_content: true
      register: keycloak_tiny_identity_provider
      changed_when: false
      no_log: true

    - name: Read managed Keycloak required actions
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/admin/realms/keycloak-test/authentication/required-actions
        headers:
          Authorization: "Bearer {{ keycloak_tiny_admin_token.json.access_token }}"
        status_code: 200
        return_content: true
      register: keycloak_tiny_required_actions
      changed_when: false
      no_log: true

    - name: Assert real broker-catalog lifecycle state
      ansible.builtin.assert:
        that:
          - keycloak_tiny_realm_state.json.browserFlow == 'keycloak-test-browser'
          - >-
            keycloak_tiny_flows.json
            | selectattr('alias', 'equalto', 'keycloak-test-browser')
            | list | length == 1
          - >-
            keycloak_tiny_flow_executions.json
            | selectattr('providerId', 'defined')
            | selectattr('providerId', 'equalto', 'auth-cookie')
            | selectattr('requirement', 'equalto', 'ALTERNATIVE')
            | list | length == 1
          - keycloak_tiny_identity_provider.json.alias == 'keycloak-test-upstream'
          - keycloak_tiny_identity_provider.json.providerId == 'oidc'
          - keycloak_tiny_identity_provider.json.displayName == 'Keycloak Tiny disabled upstream'
          - not keycloak_tiny_identity_provider.json.enabled | bool
          - >-
            keycloak_tiny_required_actions.json
            | selectattr('alias', 'equalto', 'VERIFY_EMAIL')
            | selectattr('enabled', 'equalto', false)
            | list | length == 1
      no_log: true

    - name: Request a viewer token
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/realms/keycloak-test/protocol/openid-connect/token
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: keycloak-test-client
          username: keycloak_test_viewer
          password: "{{ keycloak_tiny_admin_password }}"
        status_code: 200
        return_content: true
      register: keycloak_tiny_token
      changed_when: false
      no_log: true

    - name: Decode the unpadded base64url viewer access token claims
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import base64, sys;
            segment = sys.stdin.read().strip().split('.')[1];
            print(base64.urlsafe_b64decode(segment + '=' * (-len(segment) % 4)).decode())
        stdin: "{{ keycloak_tiny_token.json.access_token }}"
      register: keycloak_tiny_decoded_claims
      changed_when: false
      no_log: true

    - name: Parse viewer access token claims
      ansible.builtin.set_fact:
        keycloak_tiny_claims: "{{ keycloak_tiny_decoded_claims.stdout | from_json }}"
      no_log: true

    - name: Assert externally observable Tiny state
      ansible.builtin.assert:
        that:
          - keycloak_tiny_discovery.json.issuer == 'http://127.0.0.1:18080/realms/keycloak-test'
          - keycloak_tiny_discovery.json.token_endpoint | length > 0
          - keycloak_tiny_discovery.json.jwks_uri | length > 0
          - keycloak_tiny_claims.preferred_username == 'keycloak_test_viewer'
          - "'viewers' in keycloak_tiny_claims.groups"
          - "'viewer' in keycloak_tiny_claims.realm_access.roles"
          - keycloak_tiny_claims.exp | int > keycloak_tiny_claims.iat | int

    - name: Inspect running Keycloak container image
      ansible.builtin.command:
        argv:
          - podman
          - inspect
          - keycloak-tiny-keycloak
          - --format
          - "{{ '{{.ImageName}}' }}"
      register: keycloak_tiny_image
      changed_when: false

    - name: Assert expected immutable-version input and secure manifest permissions
      ansible.builtin.stat:
        path: /etc/podman/pods/keycloak-tiny.yml
      register: keycloak_tiny_manifest

    - name: Assert runtime version and manifest permissions
      ansible.builtin.assert:
        that:
          - >-
            keycloak_tiny_image.stdout is match(
              '^quay\.io/keycloak/keycloak(?::26\.7\.1)?@sha256:'
              ~
              'f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6$'
            )
          - keycloak_tiny_manifest.stat.mode == '0600'
          - keycloak_tiny_manifest.stat.pw_name == 'root'

    - name: Create Tiny JUnit output directory
      ansible.builtin.file:
        path: "{{ keycloak_tiny_junit_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      become: false

    - name: Write meaningful Tiny JUnit results
      ansible.builtin.copy:
        dest: "{{ keycloak_tiny_junit_dir }}/keycloak-tiny.xml"
        mode: "0640"
        content: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="keycloak-tiny" tests="10" failures="0" errors="0" skipped="0">
            <testcase classname="keycloak.health" name="readiness" role="keycloak_deploy"/>
            <testcase classname="keycloak.health" name="liveness" role="keycloak_deploy"/>
            <testcase classname="keycloak.oidc" name="discovery" role="keycloak_cac"/>
            <testcase classname="keycloak.oidc" name="viewer-token" role="keycloak_cac"/>
            <testcase classname="keycloak.cac" name="authentication-flow-lifecycle" role="keycloak_cac"/>
            <testcase classname="keycloak.cac" name="identity-provider-lifecycle" role="keycloak_cac"/>
            <testcase classname="keycloak.cac" name="required-action-lifecycle" role="keycloak_cac"/>
            <testcase classname="keycloak.cac" name="deferred-browser-binding" role="keycloak_cac"/>
            <testcase classname="keycloak.runtime" name="version" role="keycloak_deploy"/>
            <testcase classname="keycloak.security" name="manifest-permissions" role="keycloak_deploy"/>
          </testsuite>
      delegate_to: localhost
      become: false
