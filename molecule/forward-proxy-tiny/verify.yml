---
- name: Verify forward proxy service configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    forward_proxy_test_root: /tmp/wunder/lit-forward-proxy-molecule
    forward_proxy_junit_root: >-
      {{
        lookup('ansible.builtin.env', 'QUALITY_ARTIFACT_ROOT')
        | default(forward_proxy_test_root ~ '/artifacts', true)
      }}/junit
  pre_tasks:
    - name: Read rootless verification UID
      ansible.builtin.command: id -u
      register: forward_proxy_verify_uid
      changed_when: false

    - name: Read rootless verification GID
      ansible.builtin.command: id -g
      register: forward_proxy_verify_gid
      changed_when: false
  tasks:
    - name: Read rendered Squid policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
      register: forward_proxy_squid_config

    - name: Read rendered Squid Pod manifest
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
      register: forward_proxy_pod_manifest

    - name: Assert the service and upstream chain are closed and hardened
      ansible.builtin.assert:
        that:
          - "'http_port 127.0.0.1:3128' in (forward_proxy_squid_config.content | b64decode)"
          - "'acl lit_clients src 127.0.0.1/32 10.89.0.0/24' in (forward_proxy_squid_config.content | b64decode)"
          - >-
            'acl lit_allowed_domains dstdomain .ubuntu.com registry.example.com'
            in (forward_proxy_squid_config.content | b64decode)
          - >-
            'cache_peer proxy.customer.example parent 8080 0 no-query default'
            in (forward_proxy_squid_config.content | b64decode)
          - "'never_direct allow all' in (forward_proxy_squid_config.content | b64decode)"
          - "'http_access deny all' in (forward_proxy_squid_config.content | b64decode)"
          - "'pid_filename /tmp/squid.pid' in (forward_proxy_squid_config.content | b64decode)"
          - >-
            'docker.io/ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029'
            in (forward_proxy_pod_manifest.content | b64decode)
          - "'imagePullPolicy: Never' in (forward_proxy_pod_manifest.content | b64decode)"
          - "'hostNetwork: true' in (forward_proxy_pod_manifest.content | b64decode)"
          - "'runAsUser: 13' in (forward_proxy_pod_manifest.content | b64decode)"
          - "'readOnlyRootFilesystem: true' in (forward_proxy_pod_manifest.content | b64decode)"
        quiet: true

    - name: Disable the previously managed forward proxy service
      ansible.builtin.include_role:
        name: lit.supplementary.forward_proxy
      vars:
        forward_proxy_enabled: false
        forward_proxy_manage_runtime: false
        forward_proxy_file_owner: "{{ forward_proxy_verify_uid.stdout }}"
        forward_proxy_file_group: "{{ forward_proxy_verify_gid.stdout }}"
        forward_proxy_config_path: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
        forward_proxy_pod_manifest_path: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
        forward_proxy_state_marker_path: "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy/managed.json"

    - name: Inspect disabled forward proxy paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
        - "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
        - "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy/managed.json"
      register: forward_proxy_disabled_paths

    - name: Assert disabled state removes only role-owned proxy state
      ansible.builtin.assert:
        that:
          - forward_proxy_disabled_paths.results | selectattr('stat.exists') | list | length == 0
        quiet: true

    - name: Create forward proxy JUnit directory
      ansible.builtin.file:
        path: "{{ forward_proxy_junit_root }}"
        state: directory
        mode: "0750"

    - name: Write forward proxy per-assertion JUnit results
      ansible.builtin.copy:
        dest: "{{ forward_proxy_junit_root }}/forward-proxy-tiny.xml"
        mode: "0640"
        content: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="forward-proxy-tiny" tests="2" failures="0" errors="0" skipped="0">
            <testcase classname="forward_proxy.policy" name="closed hardened policy" role="forward_proxy"/>
            <testcase classname="forward_proxy.lifecycle" name="owned cleanup" role="forward_proxy"/>
          </testsuite>
