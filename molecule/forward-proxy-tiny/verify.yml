---
- name: Verify forward proxy service configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    forward_proxy_test_root: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/forward-proxy-state
    forward_proxy_render_root: "{{ forward_proxy_test_root | dirname }}"
    forward_proxy_lock_path: "{{ forward_proxy_test_root }}.lock"
    forward_proxy_manage_runtime: false
    forward_proxy_config_path: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
    forward_proxy_pod_manifest_path: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
    forward_proxy_state_marker_path: "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy/managed.json"
    forward_proxy_quadlet_dir: "{{ forward_proxy_test_root }}/etc/containers/systemd"
    forward_proxy_verify_uid: "{{ lookup('pipe', 'id -u') }}"
    forward_proxy_verify_gid: "{{ lookup('pipe', 'id -g') }}"
    forward_proxy_trusted_parent_paths:
      - "{{ forward_proxy_test_root | dirname }}"
      - "{{ forward_proxy_test_root }}"
      - "{{ forward_proxy_test_root }}/etc"
      - "{{ forward_proxy_test_root }}/etc/containers"
      - "{{ forward_proxy_test_root }}/etc/containers/systemd"
      - "{{ forward_proxy_test_root }}/etc/squid"
      - "{{ forward_proxy_test_root }}/var"
      - "{{ forward_proxy_test_root }}/var/lib"
      - "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy"
    forward_proxy_junit_root: >-
      {{
        lookup('ansible.builtin.env', 'QUALITY_ARTIFACT_ROOT')
        | default(forward_proxy_test_root ~ '/artifacts', true)
      }}/junit
  tasks:
    - name: Read rendered Squid policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
      register: forward_proxy_squid_config

    - name: Read rendered Squid Pod manifest
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
      register: forward_proxy_pod_manifest

    - name: Decode rendered forward proxy configuration
      ansible.builtin.set_fact:
        forward_proxy_rendered_policy: "{{ forward_proxy_squid_config.content | b64decode }}"
        forward_proxy_rendered_pod: "{{ forward_proxy_pod_manifest.content | b64decode }}"

    - name: Evaluate the minimal rendered proxy contract
      ansible.builtin.assert:
        that:
          - "'acl lit_clients src 127.0.0.1/32 10.89.0.0/24' in forward_proxy_rendered_policy"
          - "'http_access deny all' in forward_proxy_rendered_policy"
          - >-
            'docker.io/ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029'
            in forward_proxy_rendered_pod
        quiet: true
      register: forward_proxy_policy_result
      ignore_errors: true

    - name: Simulate one completed unlink from an interrupted disable transaction
      ansible.builtin.file:
        path: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
        state: absent

    - name: Initialize forward proxy cleanup execution evidence
      ansible.builtin.set_fact:
        forward_proxy_cleanup_execution_result:
          name: disable managed service
          failed: false

    - name: Exercise cleanup without losing its failure evidence
      block:
        - name: Disable the previously managed forward proxy service
          ansible.builtin.include_role:
            name: lit.supplementary.forward_proxy
          vars:
            forward_proxy_enabled: false
            forward_proxy_manage_runtime: false
            forward_proxy_file_owner: "{{ forward_proxy_verify_uid }}"
            forward_proxy_file_group: "{{ forward_proxy_verify_gid }}"
            forward_proxy_config_path: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
            forward_proxy_pod_manifest_path: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
            forward_proxy_state_marker_path: "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy/managed.json"
            forward_proxy_quadlet_dir: "{{ forward_proxy_test_root }}/etc/containers/systemd"
      rescue:
        - name: Record the cleanup execution failure for JUnit
          ansible.builtin.set_fact:
            forward_proxy_cleanup_execution_result:
              name: disable managed service
              failed: true

    - name: Inspect disabled forward proxy paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
        - "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
        - "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy/managed.json"
      register: forward_proxy_disabled_paths

    - name: Evaluate each disabled-state cleanup contract independently
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        quiet: true
      loop: "{{ forward_proxy_disabled_paths.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: forward_proxy_cleanup_results
      ignore_errors: true

    - name: Assemble complete forward proxy assertion evidence
      ansible.builtin.set_fact:
        forward_proxy_failure_count: >-
          {{
            (
              [forward_proxy_policy_result]
              + [forward_proxy_cleanup_execution_result]
              + forward_proxy_cleanup_results.results
            )
            | selectattr('failed', 'equalto', true) | list | length
          }}

    - name: Create forward proxy JUnit directory
      ansible.builtin.file:
        path: "{{ forward_proxy_junit_root }}"
        state: directory
        mode: "0750"

    - name: Write aggregate forward proxy JUnit result
      ansible.builtin.copy:
        dest: "{{ forward_proxy_junit_root }}/forward-proxy-tiny.xml"
        mode: "0640"
        content: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="forward-proxy-tiny" tests="1"
            failures="{{ 1 if forward_proxy_failure_count | int > 0 else 0 }}" errors="0" skipped="0">
            <testcase classname="forward_proxy" name="render-policy-idempotence-cleanup"
              role="forward_proxy">{% if forward_proxy_failure_count | int > 0 %}
              <failure message="one or more forward proxy contracts failed"/>{% endif %}
            </testcase>
          </testsuite>

    - name: Fail after preserving every forward proxy assertion result
      ansible.builtin.assert:
        that: ["forward_proxy_failure_count | int == 0"]
        fail_msg: Forward proxy contract failed; JUnit evidence was preserved.
