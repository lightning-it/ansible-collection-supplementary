---
- name: Initialize unsafe destination-port rejection evidence
  ansible.builtin.set_fact:
    forward_proxy_invalid_port_rejected: false
    forward_proxy_invalid_port_rejection_message: ""

- name: Exercise unsafe destination-port rejection
  block:
    - name: Validate the unsafe destination port through the real role contract
      ansible.builtin.include_role:
        name: lit.supplementary.forward_proxy
        tasks_from: assert.yml
      vars:
        forward_proxy_manage_runtime: false
        forward_proxy_file_owner: "{{ forward_proxy_verify_uid.stdout }}"
        forward_proxy_file_group: "{{ forward_proxy_verify_gid.stdout }}"
        forward_proxy_allowed_destination_ports:
          - 80
          - 443
          - 22
  rescue:
    - name: Record expected unsafe destination-port rejection
      ansible.builtin.set_fact:
        forward_proxy_invalid_port_rejected: true
        forward_proxy_invalid_port_rejection_message: >-
          {{
            (
              ansible_failed_result.results | default([])
              | selectattr('failed', 'equalto', true)
              | map(attribute='msg') | list | first
            ) | default(ansible_failed_result.msg | default(''), true)
          }}

- name: Preserve unsafe destination-port rejection result for aggregate evidence
  ansible.builtin.set_fact:
    forward_proxy_negative_results: >-
      {{
        forward_proxy_negative_results
        + [
            {
              'item': {
                'name': 'reject unsafe destination port 22'
              },
              'failed': not (
                forward_proxy_invalid_port_rejected | bool
                and (
                  'permits only HTTP 80 and HTTPS CONNECT 443'
                  in forward_proxy_invalid_port_rejection_message
                )
              )
            }
          ]
      }}
