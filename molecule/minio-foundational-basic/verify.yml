---
- name: Verify MinIO foundational endpoint and credential coverage
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    minio_deploy_root_user: molecule-root-user
    minio_molecule_root_password_file: >-
      {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/minio-root
    minio_deploy_root_password: >-
      {{ lookup('ansible.builtin.password', minio_molecule_root_password_file,
                length=32, chars=['ascii_letters', 'digits']) }}
    minio_deploy_generate_root_credentials: false
    minio_deploy_store_root_credentials: false
    minio_deploy_vault_address: ''
    minio_deploy_vault_auth_ok: false
    minio_deploy_host_ip: 127.0.0.1
    minio_deploy_api_scheme: http
    minio_deploy_port: 9000
    minio_deploy_console_port: 9001
  roles:
    - role: lit.supplementary.minio_foundational
  tasks:
    - name: Inspect ephemeral MinIO credential file
      ansible.builtin.stat:
        path: "{{ minio_molecule_root_password_file }}"
        follow: false
        get_attributes: false
        get_checksum: false
        get_mime: false
      register: minio_molecule_root_password_stat
      no_log: true

    - name: Require restrictive ephemeral MinIO credential file
      ansible.builtin.assert:
        that:
          - minio_molecule_root_password_stat.stat.isreg | default(false)
          - not (minio_molecule_root_password_stat.stat.islnk | default(false))
          - minio_molecule_root_password_stat.stat.mode | default('') == '0600'
          - minio_molecule_root_password_stat.stat.nlink | default(0) | int == 1
        quiet: true
      no_log: true

    - name: Require exact MinIO foundational endpoint resolution
      ansible.builtin.assert:
        that:
          - minio_foundational_minio_deploy_api_url_effective == 'http://127.0.0.1:9000'
          - minio_foundational_minio_deploy_console_url_effective == 'http://127.0.0.1:9001'
          - >-
            minio_foundational_minio_deploy_health_url_effective
            == 'http://127.0.0.1:9000/minio/health/ready'
          - minio_foundational_minio_deploy_root_user_effective == 'molecule-root-user'
          - minio_foundational_minio_deploy_root_credentials_source == 'provided'
        quiet: true
      no_log: true
